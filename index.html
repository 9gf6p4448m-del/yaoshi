<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>妖市 v0.6</title>
<meta name="theme-color" content="#14101f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%8F%AE%3C/text%3E%3C/svg%3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ===== 佔位美術：正式版整批替換，邏輯層不得依賴任何樣式 =====
   ===== 橫向牌桌版：設計基準 844x390（iPhone 橫持） ===== */
:root{
  --bg:#120e1d; --table:#1d1531; --table2:#2a1f45; --panel:#1f1830; --panel2:#2a2142;
  --line:#3d3260; --ink:#e8e2f5; --dim:#9a8fc0; --gold:#e8b34b; --red:#e05555; --green:#5fbf77;
  --zuling:#5fae8f; --xianghuo:#e0a13f; --yinqi:#9b6fd4; --curse:#d45577;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
  font-size:14px;position:fixed;inset:0;width:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{touch-action:manipulation} /* 連點任何位置都不觸發 double-tap zoom（試玩回饋：視窗上跳）；下行捲動容器另開 pan-y */
#felt,#sheetbox,#modalbox{touch-action:pan-y}
#rotateHint{display:none;position:fixed;inset:0;z-index:99;background:var(--bg);
  flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#rotateHint .ic{font-size:52px;animation:rot 2s infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait){ #rotateHint{display:flex} }
.title{text-align:center;padding:22px 20px;height:100%;display:flex;flex-direction:column;justify-content:center}
.title h1{font-size:38px;color:var(--gold);letter-spacing:12px;margin-bottom:6px}
.title p{color:var(--dim);font-size:13px;line-height:1.7}
.title .btns{display:flex;gap:12px;justify-content:center;margin-top:14px}
#table{display:none;height:100%;height:100dvh;max-width:960px;margin:0 auto;
  grid-template-areas:"north north north" "west felt east" "south south south";
  grid-template-rows:56px 1fr 62px;grid-template-columns:120px 1fr 120px;gap:4px;padding:4px}
#table.on{display:grid}
#north{grid-area:north;display:flex;justify-content:center}
#west{grid-area:west} #east{grid-area:east}
#west,#east{display:flex;align-items:center}
.seat{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:5px 8px;cursor:pointer;transition:box-shadow .3s;width:100%}
.seat.hl{box-shadow:0 0 12px var(--gold);border-color:var(--gold)}
.seat.dead{opacity:.35}
#north .seat{display:flex;align-items:center;gap:8px;max-width:320px}
#west .seat,#east .seat{text-align:center}
.seat .av{font-size:26px;line-height:1.1}
.seat .nm{font-size:12px;white-space:nowrap}
.seat .st{font-size:10px;color:var(--dim);line-height:1.4}
.seat .dir{position:absolute;top:-7px;left:8px;background:var(--table2);border:1px solid var(--line);
  border-radius:6px;font-size:10px;padding:0 5px;color:var(--gold)}
.windb{position:absolute;top:-7px;right:8px;background:var(--gold);color:#14101f;border-radius:6px;
  font-size:10px;padding:0 5px;font-weight:bold}
.bubble{position:absolute;z-index:9;background:#efe8d8;color:#2a2142;border-radius:10px;padding:4px 9px;
  font-size:12px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.5);left:50%;transform:translateX(-50%);top:calc(100% + 4px)}
#west .bubble{left:calc(100% + 6px);top:50%;transform:translateY(-50%)}
#east .bubble{left:auto;right:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.bubble.show{opacity:1}
#felt{grid-area:felt;background:radial-gradient(ellipse at 50% 35%,var(--table2),var(--table));
  border:2px solid var(--line);border-radius:18px;padding:8px 10px;position:relative;overflow-y:auto}
#feltHead{text-align:center;font-size:12px;color:var(--gold);margin-bottom:5px}
#helpBtn{display:none;position:fixed;top:8px;right:10px;z-index:25;width:34px;height:34px;border-radius:50%;
  background:#2a2344;color:var(--gold);border:1px solid var(--gold);font-size:16px;line-height:1}
#stage{min-height:40px}
.preview{background:rgba(0,0,0,.25);border:1px dashed var(--gold);border-radius:10px;padding:4px 10px;
  font-size:11px;color:var(--gold);margin-bottom:6px;text-align:center}
.wishbar{background:rgba(0,0,0,.25);border:1px solid #7a5ea8;border-radius:10px;padding:4px 10px;
  font-size:11px;color:#cdb9ee;margin-bottom:6px;text-align:center}
.wishbar b{color:var(--gold)}
#market{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px;cursor:pointer;
  position:relative;transition:transform .15s}
.mcard:active{transform:scale(.97)}
.mcard.curse{border-color:var(--curse)}
.mcard.bided{border-color:var(--gold)}
.mcard .nm{font-weight:bold;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .pw{font-size:11px;color:var(--gold)}
.mcard .ab{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.3}
.mybid{position:absolute;top:-8px;right:-4px;background:var(--gold);color:#14101f;border-radius:8px;
  font-size:11px;font-weight:bold;padding:1px 7px;z-index:2}
.mybid.poison{background:var(--curse);color:#fff}
.fchip{display:inline-block;font-size:9px;border-radius:5px;padding:0 4px;margin-left:3px;color:#14101f;font-weight:bold}
.f-zuling{background:var(--zuling)} .f-xianghuo{background:var(--xianghuo)}
.f-yinqi{background:var(--yinqi)} .f-curse{background:var(--curse);color:#fff}
.stageCard{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:8px 12px;
  text-align:center;animation:pop .3s;max-width:420px;margin:0 auto}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.stageCard .big{font-size:15px;font-weight:bold}
.bidfly{display:flex;justify-content:space-between;padding:3px 10px;margin-top:5px;background:var(--panel2);
  border-radius:8px;font-size:12px;animation:slidein .3s}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.bidfly.win{background:var(--gold);color:#14101f;font-weight:bold}
.outcome{margin-top:6px;color:var(--gold);font-size:12px;animation:pop .3s}
#south{grid-area:south;display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:5px 12px;position:relative}
#south .dir{color:var(--gold);font-size:11px}
#south .av{font-size:28px}
#south .life{font-size:21px;font-weight:bold;color:var(--green);line-height:1}
#south .life.low{color:var(--red)}
#south .mut{line-height:1.35}
#budget{font-size:11px;color:var(--dim);margin-left:auto;text-align:right}
#budget.over{color:var(--red);font-weight:bold}
#south button.side{height:38px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);padding:0 12px;font-size:12px}
.bigbtn{height:44px;border-radius:10px;border:none;background:var(--gold);color:#14101f;
  font-size:15px;font-weight:bold;padding:0 22px}
.bigbtn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.bigbtn:disabled{opacity:.4}
#skipbtn{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);
  color:var(--dim);border-radius:8px;padding:2px 10px;font-size:11px;display:none;z-index:5}
/* 對決場景 */
#duel{display:none;position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 45%,#31204f,#0d0a16);
  flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#duelArena{display:flex;align-items:center;justify-content:center;gap:34px;width:100%}
.fighter{text-align:center;transition:transform .35s}
.fighter .fav{font-size:74px;line-height:1.15;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.fighter .fnm{font-size:14px;margin-top:2px}
.fighter .fpw{font-size:30px;font-weight:bold;color:var(--gold)}
.fighter .fdir{font-size:11px;color:var(--gold)}
.vsbig{font-size:26px;font-weight:bold;color:var(--dim);letter-spacing:2px}
.charge-l{transform:translateX(46px) scale(1.06)}
.charge-r{transform:translateX(-46px) scale(1.06)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-4deg)}
  50%{transform:translateX(7px) rotate(3deg)}80%{transform:translateX(-4px)}}
#duel .flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#duel .flashfx.on{animation:flashA .35s}
@keyframes flashA{0%{opacity:.85}100%{opacity:0}}
#duelResult{margin-top:14px;font-size:16px;min-height:26px;text-align:center}
#duelResult .dmg{font-size:20px;font-weight:bold}
#duelSub{color:var(--dim);font-size:12px;margin-top:4px;min-height:18px;text-align:center}
/* 熱座交棒 */
#handoff{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);
  flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#handoff .hav{font-size:64px}
#handoff .hnm{font-size:20px;color:var(--gold);font-weight:bold}
/* 選角畫面（844x390 橫向） */
#selectScr{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);
  flex-direction:column;padding:8px 12px;gap:6px}
#selectScr.on{display:flex}
#selHead{display:flex;align-items:center;gap:10px}
#selHead h2{margin:0;flex:1;font-size:15px}
.selback{height:30px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);padding:0 12px;font-size:12px}
#selGrid{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:1fr;
  gap:6px;overflow-y:auto;min-height:0}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 4px;
  text-align:center;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:1px;
  transition:box-shadow .2s;min-width:0}
.rcard .rav{font-size:23px;line-height:1.15}
.rcard .rnm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .rlf{font-size:9px;color:var(--dim)}
.rcard.sel{border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.rcard.taken{opacity:.28;pointer-events:none}
#selFoot{display:flex;align-items:center;gap:10px;min-height:52px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#selDesc{flex:1;font-size:11px;color:var(--dim);line-height:1.6;min-width:0}
#selDesc b{color:var(--ink)}
.descHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.descTag{border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:0 6px;font-size:10px}
.descRow{margin-top:2px;padding-left:10px;position:relative}
.descRow::before{content:"‣";position:absolute;left:0;color:var(--gold)}
/* 抽屜 / modal */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:none;align-items:center;justify-content:center}
#sheetbox{background:var(--panel);border-radius:16px;width:94%;max-width:460px;padding:14px 14px 16px;max-height:92vh;overflow-y:auto}
#sheetbox h3{font-size:15px;margin-bottom:2px}
#sheetbox .desc{font-size:12px;color:var(--dim);margin-bottom:10px;line-height:1.4}
.bidrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.stepper{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:50px;height:46px;background:var(--panel2);color:var(--ink);border:none;font-size:22px}
.stepper .amt{width:54px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:bold;color:var(--gold)}
.typebtn,.tgtsel{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);padding:0 12px;font-size:13px}
.typebtn.yaming{border-color:var(--red);color:var(--red)}
.capnote{font-size:11px;color:var(--dim);width:100%}
.bloodbar{margin-top:7px;background:rgba(0,0,0,.25);border:1px solid var(--red);border-radius:10px;
  padding:6px 9px;text-align:center}
.bloodbtn{height:34px;border-radius:9px;border:1px solid var(--red);background:var(--panel2);
  color:var(--red);padding:0 12px;font-size:12px}
.bloodbtn:disabled{opacity:.35}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:none;align-items:center;justify-content:center}
#modalbox{background:var(--panel);border-radius:16px;width:94%;max-width:460px;max-height:88vh;overflow-y:auto;padding:14px}
.bagit{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.bagit .abtxt{font-size:11px;color:var(--dim);display:block}
.mut{color:var(--dim);font-size:12px}
h2{font-size:16px;color:var(--gold);margin:2px 0 8px}
.endrank{font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.heal{color:var(--green)} .dmg{color:var(--red)}
</style>
</head>
<body>
<div id="rotateHint"><div class="ic">📱</div><div>請把手機<b style="color:var(--gold)">轉橫</b>進入妖市<br><span class="mut">深夜牌桌需要寬一點的視野</span></div></div>
<div id="titleScr" class="title">
  <h1>妖　市</h1>
  <p>深夜的妖怪牌桌，壽命就是你的籌碼。<br>
  競標祖靈、香火、陰氣三系法寶，把詛咒塞給別人，活到天亮。<br>
  每夜風位輪轉（東→南→西→北），風位玩家當夜戰力＋3、平標優先。</p>
  <div class="btns">
    <button class="bigbtn" onclick="startEntry('solo')">單人入市</button>
    <button class="bigbtn alt" onclick="startEntry('hotseat')">雙人熱座</button>
  </div>
  <p style="margin-top:10px;color:var(--gold);font-size:11px">v0.6・新拍賣經濟＋今夜心願＋選角</p>
</div>
<div id="table">
  <div id="north"></div>
  <div id="west"></div>
  <div id="felt">
    <button id="skipbtn" onclick="doSkip()">跳過 ≫</button>
    <div id="feltHead"></div>
    <button id="helpBtn" onclick="openHelp()">？</button>
    <div id="stage"></div>
  </div>
  <div id="east"></div>
  <div id="south">
    <span class="av" id="myAv">🧑</span>
    <div><div class="dir" id="myDir">南・你</div><div class="life" id="myLife"></div></div>
    <div class="mut" id="myPow"></div>
    <button class="side" onclick="showBag(0)">袋子</button>
    <div id="budget"></div>
    <button class="bigbtn" id="mainbtn"></button>
  </div>
</div>
<div id="duel"><div class="flashfx" id="flashfx"></div>
  <div id="duelArena"></div>
  <div id="duelResult"></div><div id="duelSub"></div>
</div>
<div id="handoff">
  <div class="hav" id="hoAv"></div>
  <div class="hnm" id="hoNm"></div>
  <div class="mut" id="hoTxt"></div>
  <button class="bigbtn" id="hoBtn">開始出價</button>
</div>
<div id="selectScr">
  <div id="selHead"><h2 id="selTitle">選擇你的角色</h2><button class="selback" onclick="backToTitle()">返回</button></div>
  <div id="selGrid"></div>
  <div id="selFoot"><div id="selDesc">點一個角色，看被動與起始壽命</div><button class="bigbtn" id="selBtn" disabled onclick="confirmRole()">入市</button></div>
</div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetbox"></div></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div id="modalbox"></div></div>

<script>
"use strict";
/* ================= 常數（【試玩必調】集中此處） ================= */
const CFG = {
  LIFE: 40, ROUNDS: 12, MARKET: 4,
  CURSE_PROB: 0.65,
  SET_MIN: 2,
  DMG_BASE: 3, DMG_DIV: 5, DMG_MAX: 6,
  CONS_CAP_DIV: 3,
  /* 拍賣經濟 v0.6（2026-09-02 配置A，48 組配置×9 策略×n=2000 掃描決選）
     三值全設中性（BID_FEE=0, MAX_BIDS=0, CONS_LOSE_FRAC=0）＝回到 v0.5 規則（等價驗證用） */
  BID_FEE: 1,           /* 掛號費：每下一筆有效標先付的壽命，不論輸贏【決選值勿自調】 */
  MAX_BIDS: 2,          /* 每人每夜有效標件數上限（超過保留金額最大的前 N 筆）；0＝無上限 */
  CONS_LOSE_FRAC: 0.25, /* 保守標落標付費比例（cost=ceil(amt×frac)）；0＝全額退還 */
  WIND_POWER: 3,     /* 風位當夜戰力加成【試玩必調】 */
  AI_DESTROY_P: 0.5, /* 最強 AI 對詛咒品下防禦性銷毀標的機率【試玩必調】 */
  /* 命格系統（GAME_DESIGN §六之二）——係數全部【試玩必調】 */
  BLOOD_COST: 2,     /* 獻祭刀：第 n 次放血成本 = n×BLOOD_COST（遞增，甲′裁定）【試玩必調】 */
  BLOOD_DRAIN: 4,    /* 獻祭刀：每次放血「所有對手」各失的壽命（甲′裁定；整合版實測 −2 被心願回血稀釋到無感、−4 條件勝率 54.5% 有感不破格）【試玩必調】 */
  BLOOD_FLOOR: 1,    /* 放血後壽命不得低於此值（使用者裁定 2026-09-02） */
  /* AI 放血參數＝2026-09-02 模擬器判讀結果（n=2000，座位0 splitter 基礎策略）：
     不放血 59.4% ／ keep=15,k=1 59.2% ／ keep=8,k=3 57.3% ／ keep=1,k=∞ 48.4%
     → 放血在現行 2:3 匯率下嚴格劣於不放血，且匯率開到 2:25 仍然不划算（根因是傷害公式
     每 5 點戰力差才多 1 傷害、上限 +6，而壽命本身就是勝利資源）。故 AI 一律不放血。
     ★獻祭刀的匯率／機制待使用者裁定後再開啟（K 改回 1~3 即可恢復）★ */
  AI_BLOOD_T: 15,    /* AI 放血後願意保留的壽命下限 */
  AI_BLOOD_K: 1,     /* AI 每夜放血次數上限（DRAIN=4 下峰值用法＝每夜 1 次；0＝停用）【試玩必調】 */
  /* 心願系統（GAME_DESIGN §六之三 D）——總開關＋牌面數值全集中此處【試玩必調】 */
  WISH_ON: true,     /* false＝完全停用：不抽卡、不判定、不消耗 S.rng()，trace 與停用前逐位元組相等 */
  WISH_REWARD:{ yinqi:4, east:5, nowin:4, yaming:5, poison:4, battle:3, frugal:4, multi:5 }, /* 各牌達成獎勵【試玩必調】 */
  WISH_T:{ eastBleed: 4, yamingLost:2, frugalMax:3, multiWin:2 },  /* 各牌判定門檻【試玩必調】 */
  WISH_AI_YINQI: 4,  /* AI 持「夜訪陰氣」時對陰氣拍品的估值加成【試玩必調】 */
  WISH_AI_BATTLE: 2, /* AI 持「今夜必勝」時對一般拍品的估值加成【試玩必調】 */

/* ===== 供 ROLES 內容使用的小工具（不是引擎的一部分，引擎不呼叫它們） =====
   放在這裡是因為它們只服務資料表裡的角色行為；引擎函式不認得也不需要它們。 */
/* 局初「暗中鎖定一個系別」：用 seed 衍生的獨立亂數決定，故意不消耗 S.rng()——
   若消耗主亂數流，加一個角色就會位移整局的牌序，讓任何行為改動都無法逐項解釋。 */
function lockedSpec(p){
  if(!p.spec){
    const r=mulberry32(((S.seed^0x5bf03635)+p.id*0x9e3779b1)>>>0);
    p.spec=FACTIONS[Math.floor(r()*FACTIONS.length)];
  }
  return p.spec;
}
/* grudge 最高的活著對手；沒有任何仇恨值就回 null（同分取戰力高者，保決定性） */
function topGrudge(p){
  const g=p.grudge||{}; let best=null,bv=0;
  for(const q of S.players){
    if(!q.alive||q.id===p.id) continue;
    const v=g[q.id]||0;
    if(v>bv || (v===bv && v>0 && best && power(q)>power(best))){ bv=v; best=q; }
  }
  return bv>0?best:null;
}
/* 某人的主力陣營＝袋中非詛咒品最多的那一系（同數取先湊到的，保決定性） */
function mainFaction(p){
  const c={}; let f=null,m=0;
  for(const x of p.bag){
    if(x.curse) continue;
    c[x.f]=(c[x.f]||0)+1;
    if(c[x.f]>m){ m=c[x.f]; f=x.f; }
  }
  return f;
}
/* 陰間當鋪的一次性典當：唯一寫入 p.pawned 的地方（ARCH_SPEC §4 欄位）。
   成功典當回傳 true；呼叫端自己決定怎麼把「這次致死的扣血」調整成「剛好留 1 命」。
   縛靈鎖從 CURSES 表按名字取（資料表內容互相引用，不是引擎寫死 id）。 */
function pawnNow(p){
  if(p.pawned) return false;
  const lock=CURSES.find(x=>x.n==="縛靈鎖");
  p.pawned=true;
  p.bag.push({...lock});
  return true;
}

    check(ctx){ return (S.wishNight.yamingLost[ctx.p.id]||0)>=CFG.WISH_T.yamingLost; },
    reward(ctx){ ctx.p.life+=CFG.WISH_REWARD.yaming; },

    hooks:{ onAiAmount(ctx){
      ctx.amt=Math.max(1,Math.min(ctx.amt,CFG.WISH_AI_YAMING_CAP)); ctx.type="yaming";
    } }},
  wish_poison:{id:"wish_poison",name:"借刀傷人",
    desc:`本夜毒標命中任一人，＋${CFG.WISH_REWARD.poison} 壽命`, gain:CFG.WISH_REWARD.poison,
    /* 本夜市場沒有詛咒品＝恆假，不發；也要有別的活人可塞 */
    canDraw(p){ return S.market.some(x=>x.curse) && S.players.some(q=>q.alive&&q.id!==p.id); },
    check(ctx){ return !!S.wishNight.poisonHit[ctx.p.id]; },
    reward(ctx){ ctx.p.life+=CFG.WISH_REWARD.poison; },
    /* 追心願：本來不想出手的詛咒品，改下毒標塞給戰力最高的對手（不動既有 keep 自保決策） */
    hooks:{ onAiCurse(ctx){

    } }},
  wish_battle:{id:"wish_battle",name:"今夜必勝",
    desc:`本夜結算戰獲勝，＋${CFG.WISH_REWARD.battle} 壽命`, gain:CFG.WISH_REWARD.battle,
    /* 輪空預判（2026-09-02）：抽卡當下就算得出本夜誰輪空（活人數＋輪次已知），會輪空的人不發＝恆假不發原則。
       殘留：拍賣階段有人出局導致輪空易位的罕見情況，該夜此牌仍可能落空——記錄於 wish-report。 */
    canDraw(p){
      const alive=S.players.filter(q=>q.alive).map(q=>q.id);
      return pairings(alive,S.round-1).bye!==p.id;
    },
    check(ctx){ return S.wishNight.battleWin.has(ctx.p.id); },
    reward(ctx){ ctx.p.life+=CFG.WISH_REWARD.battle; },
    hooks:{ onAiValue(ctx){ if(!ctx.item.curse) ctx.val+=CFG.WISH_AI_BATTLE; } }},
  wish_frugal:{id:"wish_frugal",name:"惜命如金",
    desc:`本夜總出價 ≤${CFG.WISH_T.frugalMax} 壽命，＋${CFG.WISH_REWARD.frugal} 壽命`, gain:CFG.WISH_REWARD.frugal,
    check(ctx){ return (S.wishNight.totalBid[ctx.p.id]||0)<=CFG.WISH_T.frugalMax; },
    reward(ctx){ ctx.p.life+=CFG.WISH_REWARD.frugal; },
    hooks:{
      onAiCurse(ctx){ ctx.intent=null; ctx.target=null; },       /* 詛咒品出價（3~5）必爆額度，不碰 */
      onAiPlan(ctx){ ctx.maxPicks=Math.min(ctx.maxPicks,1); },
      onAiAmount(ctx){ ctx.amt=Math.min(ctx.amt,CFG.WISH_T.frugalMax); },
    }},
  wish_multi:{id:"wish_multi",name:"貪多務得",
    desc:`本夜同時得標 ${CFG.WISH_T.multiWin} 件以上拍品，＋${CFG.WISH_REWARD.multi} 壽命`, gain:CFG.WISH_REWARD.multi,
    check(ctx){ return (S.wishNight.wonCount[ctx.p.id]||0)>=CFG.WISH_T.multiWin; },
    reward(ctx){ ctx.p.life+=CFG.WISH_REWARD.multi; },
    hooks:{ onAiPlan(ctx){ ctx.maxPicks=Math.max(ctx.maxPicks,3); } }},
};

    desc:()=>`廟口擲杯賭局。每人密封壓注（0＝不擲，上限 ${CFG.POE_CAP}），各自擲杯——壓 X 成功率 X/(X+8)。**擲出聖杯者中壓注最高者**獨得彩池 ${Math.round(CFG.POE_CUT*100)}%（廟公抽二）＋一件法寶；無人擲出聖杯，彩池全數沒收`,

/* --- 5/5 NIGHTRULES：今夜市集規則。本次只建結構，不填內容。
   形狀：{id,name,desc,hooks:{...}} --- */
const NIGHTRULES = {};

/* ================= Hook 分派器 =================
   effect 來源與呼叫順序（固定，改了結果就不可重現）：
     1. p 的角色 → 2. p.bag 內有 ab 的道具（依袋中順序）→ 3. p 的本夜心願 → 4. S.nightRule → 5. S.event
   （心願來源 2026-09-02 加入：讓 WISHES 的 onAi* 扭曲不必在引擎寫 id 比對；
     停用心願（CFG.WISH_ON=false）時 p.wish 恆為 null，此來源等同不存在，行為與加入前逐位元組相等）
   同一個 effect 物件只收一次（袋裡兩把同名法寶＝一次效果，與舊行為一致）。
   HOOK_ORDER 可為個別 hook 指定不同的收集順序（ARCH_SPEC §3.10 要求 onNightEnd 道具先於角色）。
   ctx 是可變累加器：effect 直接改 ctx 的欄位，不回傳值。 */
const HOOK_ORDER = { onNightEnd:"itemsFirst" };
function collectEffects(p,order){
  const out=[], seen=new Set();
  const add=e=>{ if(e && !seen.has(e)){ seen.add(e); out.push(e); } };

    list=[]; const seen=new Set();

      if(!q) continue;

    pk.push(avail[Math.floor(rng()*avail.length)]);
  }
  const rest=pool.filter(k=>!pk.includes(k));

  S.market.forEach((it,i)=>{
    if(!it.curse)return;
    const strongest=[...S.players].filter(q=>q.alive).sort((a,b)=>power(b)-power(a))[0];
    let intent=null,target=null;
    if(strongest.id===p.id && S.rng()<CFG.AI_DESTROY_P){
      intent="keep"; /* 買下銷毀自保 */
    }else if(S.rng()<p.ai.spite){
      const foes=S.players.filter(q=>q.alive&&q.id!==p.id);
      intent="poison"; target=foes.sort((a,b)=>power(b)-power(a))[0].id;
    }
    /* hook 8.5：角色可改寫詛咒品的意圖與目標（紅衣婆婆改鎖仇人、爐主改買下銷毀保人…） */
    const cc={p,item:it,intent,target};
    applyHooks("onAiCurse",cc,p);
    intent=cc.intent; target=cc.target;
    if(!intent)return;
    const amt=Math.min(3+rnd(0,2), budget-spent-CFG.BID_FEE, p.life-spent-1-CFG.BID_FEE);
    if(amt<=0)return;
    const type=amt>consCapFor(p)?"yaming":"cons";
    bids[i]={amt,type,intent,target};
    spent+=amt+CFG.BID_FEE; /* 掛號費一併入帳（BID_FEE=0 時與 v0.5 無差異） */
  });
  const opts=[];
  S.market.forEach((it,i)=>{
    if(it.curse)return;
    const c=p.bag.filter(x=>x.f===it.f).length;
    const marginal=(c+1>=CFG.SET_MIN)?(c+1)*(c+1)-(c>=CFG.SET_MIN?c*c:0):0;
    /* hook 8.1：角色可改寫「這件在我心中值多少」 */
    const vc={p,item:it,val:it.p+marginal+(it.ab?2:0)+rnd(-2,2)};
    applyHooks("onAiValue",vc,p);
    opts.push({i,val:vc.val,intent:"keep",target:null});
  });
  opts.sort((a,b)=>b.val-a.val);
  /* hook 8.2：這夜要標幾件、要不要整夜不出手 */
  const plan={p,opts,maxPicks:2,skipAll:false};
  /* skipAll 語意（覆審 MEDIUM-1）：「整夜完全不出價」要含詛咒品攻防與計畫外出價，
     否則收驚婆蟄伏夜 13% 仍下標、兩袖清風 AI 自毀心願。清掉前面已下的詛咒標並擋掉 extra。 */
  applyHooks("onAiPlan",plan,p);
  if(plan.skipAll){ bids.forEach((b,i)=>{bids[i]=null;}); spent=0; }
  if(!plan.skipAll) for(const o of plan.opts.slice(0,plan.maxPicks)){
    /* 自我限制在 CFG.MAX_BIDS 筆內（含上面詛咒品攻防那幾筆）——
       超出的標會被 resolveAuction 裁掉，出了等於白規劃 */
    if(CFG.MAX_BIDS>0 && bids.filter(b=>b&&b.amt>0).length>=CFG.MAX_BIDS) break;
    let amt=Math.max(0,Math.round(o.val*p.ai.aggr)+rnd(-1,1));
    amt=Math.min(amt,budget-spent-CFG.BID_FEE,p.life-spent-CFG.BID_FEE);
    if(amt<=0)continue;
    const cap=consCapFor(p);
    const type=(amt>cap||(o.val>8&&S.rng()<p.ai.aggr))?"yaming":"cons";
    /* hook 8.3：角色可改寫單筆金額與標書型態（紀律壓價、破戒梭哈、當鋪超額…） */
    const ac={p,item:S.market[o.i],val:o.val,amt,type};
    applyHooks("onAiAmount",ac,p);
    /* 硬底線只剩「一輪總額不得超過 budgetFor(p)」——角色可以突破 45% 節流，
       但不能突破 onBudget 算出來的總額（陰間當鋪要超額，就從 onBudget 把它加大） */
    const finalAmt=Math.max(0,Math.min(Math.floor(ac.amt),fullBudget-spent-CFG.BID_FEE));
    if(finalAmt<=0)continue;
    bids[o.i]={amt:finalAmt,type:ac.type,intent:o.intent,target:o.target};
    spent+=finalAmt+CFG.BID_FEE;
  }
  /* hook 8.4：計畫外的額外出價（虛張、攪局）。hook 自己要顧好 ctx.budget 上限。 */
  const ec={p,bids,market:S.market,spent,budget:fullBudget};
  if(!plan.skipAll) applyHooks("onAiExtraBids",ec,p);
  return bids;
}
function resolveAuction(){
  /* 本夜統計（心願判定用）：純記錄，不消耗亂數、不改任何結算數值。
     東窗血光改吃 extLoss（非自願失血：對決傷害＋詛咒侵蝕，2026-09-02 裁定），不再需要 startLife */
  S.wishNight={wonCount:{},wonFacs:{},
    yamingLost:{},poisonHit:{},totalBid:{},battleWin:new Set(),
    extLoss:{}}; /* 非自願失血（對決傷害＋詛咒侵蝕），東窗血光的判準 */
  const all=S.players.map(p=>{
    if(!p.alive)return S.market.map(()=>null);
    if(!p.ai){
      const hb=S.humanBids[p.id]||[];
      return S.market.map((_,i)=>(hb[i]&&hb[i].amt>0)?{...hb[i]}:null);
    }
    return aiBids(p);
  });
  /* 每夜出價件數上限（CFG.MAX_BIDS）：每人只保留金額最大的前 N 筆有效標，其餘作廢。
     排序決定性：金額大者先、同額取索引小者（Array.sort 為穩定排序，不消耗亂數）。 */
  if(CFG.MAX_BIDS>0){
    all.forEach(row=>{
      row.map((b,i)=>({b,i})).filter(x=>x.b&&x.b.amt>0)
        .sort((a,b)=>b.b.amt-a.b.amt).slice(CFG.MAX_BIDS)
        .forEach(x=>{ row[x.i]=null; });
    });
  }
  const reveal=[];
  S.wonAny=new Set();
  S.bidAny=new Set(); /* 本輪（一夜）有實際出過價（amt>0）的玩家 id，供「整夜零出價」類被動查詢 */
  /* 本夜各家得標的陣營；整夜結束後才覆蓋 S.lastWon，所以 AI 出價時看到的一定是「上一夜」（ARCH_SPEC §4） */
  const lastWon={};
  S.market.forEach((it,i)=>{
    const entries=[];
    S.players.forEach(p=>{const b=all[p.id][i];if(b){
      entries.push({p,...b});S.bidAny.add(p.id);
      S.wishNight.totalBid[p.id]=(S.wishNight.totalBid[p.id]||0)+b.amt; /* 心願統計：本夜總出價 */
    }});
    let winner=null;
    if(entries.length){
      const effs=entries.map(e=>{
        const c={p:e.p,bid:e,item:it,eff:e.amt};
        applyHooks("onBidEff",c,e.p);
        return c.eff;
      });
      const top=Math.max(...effs);
      const tops=entries.filter((e,k)=>effs[k]===top);
      /* 平標決勝：風位優先 → 仍平則 S.rng() 決 */
      winner = tops.find(e=>e.p.id===windPid(S.round)) || tops[Math.floor(S.rng()*tops.length)];
    }
    const events=[];
    /* 本件拍品的得標者 id，供 onBidSettle 期間查詢（「被誰搶走」這種狀態累積要用到，
       而 onBidSettle 的 ctx 形狀是凍結的，不能加欄位——見 ARCH_SPEC §3.7／§8.6） */
    S.bidWinner=winner?winner.p.id:null;
    entries.forEach(e=>{
      const isWinner=(e===winner);
      /* nBids 為 additive 欄位（ARCH_SPEC §9 議題 1 核可的做法）：本件拍品的出價人數，
         供「唯一出價者」類被動查詢；既有 effect 都不讀它，行為不變。成本公式未動。 */
      const c={p:e.p,bid:e,item:it,isWinner,
        cost:(isWinner?e.amt
          :(e.type==="yaming"?Math.ceil(e.amt/2):Math.ceil(e.amt*CFG.CONS_LOSE_FRAC)))+CFG.BID_FEE, events, nBids:entries.length};
      applyHooks("onBidSettle",c,e.p);
      e.p.life-=c.cost;
      e.cost=c.cost; /* 供開標演出顯示實付（simulate 不序列化 entries，不影響 trace） */
    });
    S.bidWinner=null;
    /* 心願統計：押命標落標次數（在得標者確定後、不動結算本身） */
    entries.forEach(e=>{
      if(e!==winner&&e.type==="yaming")
        S.wishNight.yamingLost[e.p.id]=(S.wishNight.yamingLost[e.p.id]||0)+1;
    });
    let outcome="流標";
    if(winner){
      S.wonAny.add(winner.p.id);
      S.wishNight.wonCount[winner.p.id]=(S.wishNight.wonCount[winner.p.id]||0)+1; /* 心願統計 */
      lastWon[winner.p.id]=it.f;
      let target=null;
      if(winner.intent==="poison"){
        target=S.players[winner.target];
        target.bag.push(it);
        S.wishNight.poisonHit[winner.p.id]=true; /* 心願統計：毒標命中 */
        outcome=`${winner.p.name} 毒標得手 → 塞進 ${target.name} 的袋子`;
      }else if(it.curse){
        outcome=`${winner.p.name} 買下銷毀（自保）`;
      }else{
        winner.p.bag.push(it);
        (S.wishNight.wonFacs[winner.p.id]=S.wishNight.wonFacs[winner.p.id]||[]).push(it.f); /* 心願統計：入袋陣營 */
        outcome=`${winner.p.name} 入袋`;
      }
      /* 得標後的連鎖：得標者與被塞方的 effect 都要參與（去重後依序） */
      applyHooks("onWinItem",{winner:winner.p,item:it,target,events},[winner.p,target]);
    }
    reveal.push({it,entries,winner,outcome,events});
  });
  S.lastWon=lastWon; /* 整夜結算完才換上，明夜的 AI 才查得到「上一夜」 */
  S.players.forEach(p=>{if(p.alive&&p.life<=0){p.alive=false;p.life=0;}});
  return reveal;
}
function pairings(ids,round){
  const list=[...ids]; if(list.length%2)list.push(null);
  const m=list.length; if(m<2)return{pairs:[],bye:ids[0]??null};
  const others=list.slice(1),r=round%(m-1);
  const rot=[list[0],...others.map((_,k)=>others[(k+r)%others.length])];
  const pairs=[];let bye=null;
  for(let k=0;k<m/2;k++){
    const a=rot[k],b=rot[m-1-k];
    if(a===null)bye=b;else if(b===null)bye=a;else pairs.push([a,b]);
  }
  return{pairs,bye};
}
function battlePower(p){ return power(p)+(p.id===windPid(S.round)?CFG.WIND_POWER:0); }
function resolveBattles(){
  const alive=S.players.filter(p=>p.alive).map(p=>p.id);
  const {pairs,bye}=pairings(alive,S.round-1);
  const fights=[];
  pairs.forEach(([a,b])=>{
    const A=S.players[a],B=S.players[b];
    const pa=battlePower(A),pb=battlePower(B);
    if(pa===pb){fights.push({A,B,pa,pb,tie:true});return;}
    const paRaw=power(A), pbRaw=power(B);
    const [w,l,pw,pl,pwRaw,plRaw]=pa>pb?[A,B,pa,pb,paRaw,pbRaw]:[B,A,pb,pa,pbRaw,paRaw];
    const extra=[];
    const ctx={w,l,pw,pl,pwRaw,plRaw,extra,
      dmg:CFG.DMG_BASE+Math.min(CFG.DMG_MAX,Math.floor((pw-pl)/CFG.DMG_DIV))};
    applyHooks("onBattle",ctx,[w,l]);
    const dmg=ctx.dmg;
    l.life-=dmg;
    if(S.wishNight) S.wishNight.extLoss[l.id]=(S.wishNight.extLoss[l.id]||0)+dmg; /* 東窗血光：非自願失血 */
    if(S.wishNight) S.wishNight.battleWin.add(w.id); /* 心願統計：本夜結算戰勝者 */
    fights.push({A,B,pa,pb,w,l,dmg,extra});
  });
  const nightly=[];
  S.players.forEach(p=>{
    if(!p.alive)return;
    /* 夜末結算順序（ARCH_SPEC §3.10）：詛咒 drain → 道具 → 角色 → 心願 → 異事後效 */
    const drain=p.bag.reduce((s,x)=>s+(x.drain||0),0);
    if(drain){
      p.life-=drain;nightly.push(`🩸 ${p.name} 受詛咒侵蝕 -${drain}`);
      if(S.wishNight) S.wishNight.extLoss[p.id]=(S.wishNight.extLoss[p.id]||0)+drain; /* 東窗血光：非自願失血 */
    }
    applyHooks("onNightEnd",{p,log:nightly},p);
  });
  /* 心願判定（ARCH_SPEC §3.10：詛咒 drain → 道具 → 角色 → 心願 → 異事後效）。
     獨立第二圈：等所有人的 drain／道具／角色都結完，再統一判定，
     「讓東家失血」這類跨玩家條件才不會因遍歷順序讀到半套結果。
     此時尚未蓋出局旗——壽命歸零者若靠心願獎勵回到正值，視同被心願救回（與拼板舟等夜末回血同一語意）。 */
  S.players.forEach(p=>{ if(p.alive) judgeWish(p,nightly); });
  /* 異事後效（ARCH_SPEC §3.10 順序最後）：陰間放貸每夜攤還；身故勾銷；不計入東窗 extLoss（待辦14裁定） */
  if(S.debts) S.players.forEach(p=>{
    const d=S.debts[p.id];
    if(!d) return;
    if(!p.alive){ delete S.debts[p.id]; return; }
    const pay=Math.ceil(d.left/d.nights);
    p.life-=pay; d.left-=pay; d.nights--;
    nightly.push(`🧧 ${p.name} 攤還陰間貸款 -${pay}${d.left>0?`（餘 ${d.left}）`:"（已清償）"}`);
    if(d.left<=0||d.nights<=0) delete S.debts[p.id];
  });
  const deaths=[];
  S.players.forEach(p=>{if(p.alive&&p.life<=0){p.alive=false;p.life=0;deaths.push(p);}});
  /* 獻祭放血只在本夜生效：夜末一律歸零（正常遊戲、playPolicyGame、simulate 三條迴圈共用此處） */
  S.players.forEach(p=>{p.sacrificed=0;});
  /* 異事預告（GAME_DESIGN §六之三 B：前一夜預告）；EVENT_ON=false 時 eventForRound 恆 null */
  const nxev=eventForRound(S.round+1);
  if(nxev) nightly.push(`🔮 夜市耳語——明夜「${nxev.name}」將至：${nxev.hint||""}`);
  return{fights,bye,nightly,deaths};
}

function beginRound(){

/* ===== 異事 UI：密封輸入（熱座逐位真人交棒）→ 開盅演出 → 進入出價 ===== */

/* 獻祭放血條：只有持有 bloodlet flag（目前＝獻祭刀）的出價者看得到 */
function bloodHTML(ap){
  if(!hasFlag(ap,"bloodlet")) return "";

let sheetIdx=null;

function bump(d){
  const b=myBids[sheetIdx];
  if(d>0&&b.amt===0&&CFG.MAX_BIDS>0
     &&myBids.filter((x,k)=>k!==sheetIdx&&x.amt>0).length>=CFG.MAX_BIDS){
    $("shCap").textContent=`本夜最多 ${CFG.MAX_BIDS} 筆有效標，已滿——要標這件，先把另一件歸零`;
    return;
  }
  b.amt=Math.max(0,b.amt+d);
  if(b.type==="cons"&&b.amt>consCapFor(S.players[ACTIVE]))b.type="yaming";
  paintSheet();updateBudget();
}
function flipType(){
  const b=myBids[sheetIdx];
  if(b.type==="cons")b.type="yaming";
  else{b.type="cons";const cap=consCapFor(S.players[ACTIVE]);if(b.amt>cap)b.amt=cap;}
  paintSheet();updateBudget();
}
function setTgt(){

function paintSheet(){
  const b=myBids[sheetIdx];

  const t=$("shType");
  t.textContent=b.type==="cons"?"保守標":"押命標";

  const feeTxt=CFG.BID_FEE>0?`每筆有效標另付掛號費 ${CFG.BID_FEE} 壽命（不論輸贏）。`:"";
  const slotTxt=CFG.MAX_BIDS>0?`本夜有效標 ${nb}/${CFG.MAX_BIDS} 筆。`:"";
  const loseTxt=CFG.CONS_LOSE_FRAC>0
    ?`落標退還 ${Math.round((1-CFG.CONS_LOSE_FRAC)*100)}%（付 ${Math.round(CFG.CONS_LOSE_FRAC*100)}%）`
    :"落標全額退還";
  $("shCap").textContent=b.type==="cons"
    ?`保守標：${loseTxt}，上限 ${consCapFor(S.players[ACTIVE])}。${feeTxt}${slotTxt}`
    :`押命標：無上限，落標仍失一半出價。${feeTxt}${slotTxt}`;

function closeSheet(){
  $("sheet").style.display="none";

  if(wrap)wrap.outerHTML=mcardHTML(S.market[sheetIdx],sheetIdx);
  updateBudget();
}
function updateBudget(){
  const ap=S.players[ACTIVE];
  const nb=myBids.filter(b=>b.amt>0).length;
  const fees=nb*CFG.BID_FEE;
  const tot=myBids.reduce((s,b)=>s+b.amt,0)+fees;
  const el=$("budget");
  const cap=budgetFor(ap);
  el.innerHTML=`${S.mode==="hotseat"?DIRS[ACTIVE]+"家 ":""}出價合計 <b>${tot}</b>${fees>0?`（含掛號費 ${fees}）`:""} ／ 壽命 ${ap.life}${S.debts&&S.debts[ap.id]?`<span style="color:#ff8484">（欠${S.debts[ap.id].left}）</span>`:""}${CFG.MAX_BIDS>0?`　🏷 本夜標 ${nb}/${CFG.MAX_BIDS}`:""}`;
  el.className=tot>cap?"over":"";
  $("mainbtn").disabled=tot>cap;
}
function submitHumanBids(){
  S.humanBids[ACTIVE]=myBids;
  const hs=aliveHumans();
  const idx=hs.findIndex(p=>p.id===ACTIVE);
  if(idx<hs.length-1){
    ACTIVE=hs[idx+1].id;

/* ================= 開標演出 ================= */
function startRevealDirect(){ startReveal(); }
async function startReveal(){
  $("mainbtn").disabled=true;
  SKIP=false;$("skipbtn").style.display="block";
  const reveal=resolveAuction();
  /* 開標渲染的可視程度交給 hook 決定。showTypes 預設 false（ARCH_SPEC §9 待辦 8：
     標書型態改為隱藏資訊，只有普渡爐主的 onReveal 會打開它）。
     viewer 傳「活著的真人」陣列：solo＝[南家]（與舊行為等價）；熱座＝兩位真人共看同一畫面，
     任一位是爐主就顯示（同機同螢幕本來就藏不住，取聯集是誠實解——限制記錄於 roles-report.md）。 */
  const rv={reveal,viewerId:0,showEntries:true,showTypes:false};
  applyHooks("onReveal",rv,aliveHumans());
  const stage=$("stage");
  if(S.bleedLog&&S.bleedLog.length){
    renderSeats();
    stage.innerHTML=`<div class="stageCard">${S.bleedLog.map(t=>`<div class="big" style="font-size:16px">${t}</div>`).join("")}</div>`;
    await sleep(CFG.T*1.4);
  }
  for(const r of rv.reveal){
    renderSeats();
    stage.innerHTML=`<div class="stageCard">
      <div class="big">${r.it.n}<span class="fchip ${FAC[r.it.f].cls}">${FAC[r.it.f].n}</span>
      <span class="mut" style="font-size:11px">　${r.it.ab?("✦ "+abDesc(r.it.ab)):r.it.d}</span></div>
      <div id="flyzone"></div><div id="outzone"></div>
    </div>`;
    await sleep(CFG.T*0.8);
    const fz=$("flyzone");
    if(!rv.showEntries){
      fz.innerHTML=`<div class="bidfly"><span>出價已被遮蔽</span><span>—</span></div>`;
      await sleep(CFG.T*0.7);
    }else if(!r.entries.length){
      fz.innerHTML=`<div class="bidfly"><span>無人出價</span><span>—</span></div>`;
      await sleep(CFG.T*0.7);
    }else{
      const ordered=[...r.entries].sort((a,b)=>a.amt-b.amt);
      for(const e of ordered){
        fz.insertAdjacentHTML("beforeend",
          `<div class="bidfly ${e===r.winner?"win":""}"><span>${DIRS[e.p.id]}家・${e.p.name}${e.intent==="poison"?" 🕸毒標":""}</span><span>${e.amt} 壽命${rv.showTypes&&e.type==="yaming"?"・押命":""}${
            /* 實付顯示規則（2026-09-02 對抗覆審 HIGH-1/2）：
               得標者一律顯示——得標實付=出價+掛號費，兩種型態同式，不洩漏標書型態；
               落標者的實付兩型態算式不同（25% vs 50%），會被反推型態、廢掉普渡爐主的被動，
               故只在「這筆是真人自己的」或 viewer 有 showTypes 權限（爐主）時顯示。 */
            (e.cost>0&&(e===r.winner||!e.p.ai||rv.showTypes))?`・實付 ${e.cost}${(!e.p.ai)?`<span class="mut" style="font-size:10px">（${e===r.winner?"出價":"落標費"}${CFG.BID_FEE>0?"＋掛號費":""}）</span>`:""}`:""
          }</span></div>`);
        await sleep(CFG.T*0.65);
      }
    }
    $("outzone").innerHTML=`<div class="outcome">${r.outcome}</div>`;
    if(r.winner){
      sayFrom(r.winner.p.id, r.winner.intent==="poison"?"poison":"win");
      const losers=r.entries.filter(e=>e!==r.winner);
      if(losers.length&&!r.winner.p.ai)sayFrom(losers[0].p.id,"lose");
      if(r.winner.intent==="poison")sayFrom(r.winner.target,"poisoned");
    }
    for(const ev of r.events){
      /* 型態洩漏事件（typeLeak）按實付同規則過濾：真人的、或 viewer 有 showTypes（爐主）才顯示（覆核 F1） */

/* ================= 測試出口：headless 模擬（不碰 DOM） ================= */
/* 固定腳本策略：每夜對 market 中 p 值最高的一件出保守標，金額 = min(保守標上限, 5)，
   不下毒標、不買銷毀。用途是把對局變成完全決定性，供重構前後逐項比對。 */
function scriptedBids(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  let bi=0;
  for(let i=1;i<S.market.length;i++) if(S.market[i].p>S.market[bi].p) bi=i;
  bids[bi]={amt:Math.min(consCapFor(p),5),type:"cons",intent:"keep",target:null};
  return bids;
}
/* ================= 平衡模擬器：可插拔策略（給 runMany 用，不影響 simulate/scriptedBids 既有行為） =================
   每個策略都是 (p)=>bids 的純函式，bids 形狀與 scriptedBids 相同：長度＝S.market.length 的陣列，
   每格 null 或 {amt,type,intent,target}。三者只讀 S.market／consCapFor 等既有唯讀狀態，不寫入任何全域。 */
function policyGreedy(p){ return scriptedBids(p); } /* 標 p 值最高者，複用既有腳本策略 */
function policyHoarder(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const candidates=[];
  S.market.forEach((it,i)=>{ if(!it.curse && it.p>=6) candidates.push(i); });
  if(!candidates.length) return bids; /* 沒有大貨，零出價 */
  let bi=candidates[0];
  for(const i of candidates) if(S.market[i].p>S.market[bi].p) bi=i;
  const cap=consCapFor(p);
  const want=S.market[bi].p+3;
  if(want<=cap){ bids[bi]={amt:want,type:"cons",intent:"keep",target:null}; }
  else{ const amt=Math.min(want,Math.max(1,p.life-1)); bids[bi]={amt,type:"yaming",intent:"keep",target:null}; }
  return bids;
}
function policySplitter(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const cap=consCapFor(p);
  const amt=Math.max(1,Math.min(2,cap));
  const order=S.market.map((_,i)=>i).sort((a,b)=>S.market[b].p-S.market[a].p);
  order.slice(0,Math.min(3,order.length)).forEach(i=>{ bids[i]={amt,type:"cons",intent:"keep",target:null}; });
  return bids;
}
/* 把任一策略包成「先放血再出價」——用來窮舉獻祭刀的最佳用法（keep 越低＝越敢壓命）。
   放血發生在出價之前，所以會同步壓縮該夜預算（預算＝壽命），代價是真的。 */
function withBleed(baseFn,keep,k){
  const f=p=>{ bleed(p,keep,k); return baseFn(p); };
  f.bleedParams={keep,k};
  return f;
}
/* aiLike：玩家完全照 AI 的決策邏輯打，用來分辨「規則漏洞」還是「AI 太笨」 */
function policyAiLike(p){
  const saved=p.ai; p.ai={aggr:0.7,spite:0.15};
  let b; try{ b=aiBids(p); } finally { p.ai=saved; }
  return b.map(x=>x||{amt:0,type:"cons",intent:"keep",target:null});
}
/* bargain：對「全部」非詛咒拍品都下最小保守標（把零成本選擇權吃到極限的舊優勢策略） */
function policyBargain(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  S.market.forEach((it,i)=>{ if(!it.curse) bids[i]={amt:1,type:"cons",intent:"keep",target:null}; });
  return bids;
}
/* sniper：只搶單一最高價品，出到保守標上限 */
function policySniper(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  let bi=-1,bv=-99; S.market.forEach((it,i)=>{ if(!it.curse&&it.p>bv){bv=it.p;bi=i;} });
  if(bi>=0) bids[bi]={amt:consCapFor(p),type:"cons",intent:"keep",target:null};
  return bids;
}
/* specialist：只標自己主力系（湊共鳴），小額保守標 */
function policySpecialist(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const f=mainFaction(p)||FACTIONS[0];
  S.market.forEach((it,i)=>{ if(!it.curse&&it.f===f) bids[i]={amt:Math.min(3,consCapFor(p)),type:"cons",intent:"keep",target:null}; });
  return bids;
}
/* minlegal：對每一件都出「最低合法價」——舊規則 79% 勝率的免費選擇權利用者 */
function policyMinLegal(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const cap=consCapFor(p), budget=budgetFor(p);
  let spent=0;
  S.market.forEach((it,i)=>{
    if(it.curse) return;
    const need=1;
    if(need>cap) return;
    if(spent+need+CFG.BID_FEE>budget) return;
    bids[i]={amt:need,type:"cons",intent:"keep",target:null}; spent+=need+CFG.BID_FEE;
  });
  return bids;
}
/* minlegal2：同上但只挑「戰力／實付比」最好的前 2 件（有掛號費時的理性最低價版） */
function policyMinLegal2(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const cap=consCapFor(p);
  const cand=[];
  S.market.forEach((it,i)=>{
    if(it.curse) return;
    const need=1;
    if(need>cap) return;
    cand.push({i,need,ratio:it.p/(need+CFG.BID_FEE)});
  });
  cand.sort((a,b)=>b.ratio-a.ratio).slice(0,2).forEach(c=>{
    bids[c.i]={amt:c.need,type:"cons",intent:"keep",target:null};
  });
  return bids;
}
/* feeaware：知道掛號費存在的理性玩家——把邊際共鳴算進價值、只投 CP 值（價值÷實付）最高的
   前 2 件、出價壓在夠競爭的中額。驗收 A5：防「補完舊漏洞、又開一個新漏洞」的守門策略。 */
function policyFeeAware(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const cap=consCapFor(p), budget=budgetFor(p);
  const cand=[];
  S.market.forEach((it,i)=>{
    if(it.curse) return;
    const c=p.bag.filter(x=>!x.curse&&x.f===it.f).length;
    const marginal=(c+1>=CFG.SET_MIN)?(c+1)*(c+1)-(c>=CFG.SET_MIN?c*c:0):0;
    const val=it.p+marginal+(it.ab?2:0);
    const amt=Math.max(1,Math.min(cap,Math.ceil(val/2)));
    cand.push({i,amt,cp:val/(amt+CFG.BID_FEE)});
  });
  cand.sort((a,b)=>b.cp-a.cp||a.i-b.i);
  let spent=0;
  const kmax=CFG.MAX_BIDS>0?CFG.MAX_BIDS:2;
  for(const c of cand.slice(0,kmax)){
    if(spent+c.amt+CFG.BID_FEE>budget) continue;
    bids[c.i]={amt:c.amt,type:"cons",intent:"keep",target:null};
    spent+=c.amt+CFG.BID_FEE;
  }
  return bids;
}
const POLICIES={ greedy:policyGreedy, hoarder:policyHoarder, splitter:policySplitter,
  aiLike:policyAiLike, bargain:policyBargain, sniper:policySniper,
  specialist:policySpecialist, minlegal:policyMinLegal, minlegal2:policyMinLegal2,
  feeaware:policyFeeAware };
/* 無頭跑一整局，供 runMany 統計聚合用。不重用/不修改 simulate()，避免任何動到既有等價基準的風險——
   完全靠 makeState/resolveAuction/resolveBattles/power 這些既有唯讀引擎函式組成，邏輯零重寫。 */
function playPolicyGame(seed,policies,picks){
  makeState("solo",seed,picks);
  const deathRound={}; S.players.forEach(p=>deathRound[p.id]=null);
  const factionWinCounts={}, factionOffered={};
  Object.keys(FAC).forEach(f=>{ factionWinCounts[f]=0; factionOffered[f]=0; });
  let poisonBids=0, totalBids=0, unsoldItems=0, drawnItems=0;
  const lifeByRound=[];
  for(;;){
    drawWishes(); /* 與 beginRound 同時機（出價前），三條迴圈亂數序一致 */
    runEventPhaseHeadless(); /* 異事夜（EVENT_ON=false 零消耗）；真人座位同走 ai 啟發式 */
    if(S.players.filter(p=>p.alive).length<=1){ /* 異事殺到剩1人：該夜不再拍賣/對決 */
      S.players.forEach(p=>{ if(!p.alive&&deathRound[p.id]===null) deathRound[p.id]=S.round; });
      lifeByRound.push(S.players.map(p=>p.life));
      break;
    }
    S.humanBids={};
    S.players.forEach(p=>{
      if(!p.ai){ const pol=(policies&&policies[p.id])||scriptedBids; S.humanBids[p.id]=pol(p); }
    });
    S.market.forEach(it=>{ factionOffered[it.f]=(factionOffered[it.f]||0)+1; drawnItems++; });
    const reveal=resolveAuction();
    reveal.forEach(r=>{
      totalBids+=r.entries.length;
      if(r.winner){
        factionWinCounts[r.it.f]=(factionWinCounts[r.it.f]||0)+1;
        if(r.winner.intent==="poison") poisonBids++;
      }else{ unsoldItems++; }
    });
    resolveBattles();
    S.players.forEach(p=>{ if(!p.alive && deathRound[p.id]===null) deathRound[p.id]=S.round; });
    lifeByRound.push(S.players.map(p=>p.life));
    const aliveN=S.players.filter(p=>p.alive).length;
    const humanN=S.players.filter(p=>!p.ai&&p.alive).length;
    if(!humanN||aliveN<=1||S.round>=CFG.ROUNDS) break;
    S.round++; S.market=S.nextMarket; S.nextMarket=drawMarket();
  }
  const gameLength=S.round;
  S.players.forEach(p=>{ if(deathRound[p.id]===null) deathRound[p.id]=gameLength; });
  stripEndgameItems();
  const rank=[...S.players].sort((a,b)=>(b.alive?1:0)-(a.alive?1:0)||b.life-a.life);
  return {
    seed, gameLength, winnerId:rank[0].id,
    finalLife:S.players.map(p=>p.life), finalPower:S.players.map(p=>power(p)),
    survival:S.players.map(p=>deathRound[p.id]),
    lifeByRound, factionWinCounts, factionOffered,
    poisonBids, totalBids, unsoldItems, drawnItems,
  };
}
/* runMany({seeds:[...] 或 n:N, policies:{playerId:policyFn}}) → 統計聚合，見 docs 交付需求。
   policies 只覆寫非 AI 座位（solo 模式僅 id0 是人類），AI 座位一律照舊走 aiBids。 */
function runMany(opts){
  opts=opts||{};
  const seeds=opts.seeds?[...opts.seeds]:Array.from({length:opts.n||200},(_,i)=>i+1);
  const policies=opts.policies||{};
  const results=seeds.map(sd=>playPolicyGame(sd,policies,opts.picks));
  const n=results.length;
  const nPlayers=n?results[0].finalLife.length:0;
  const winRate=new Array(nPlayers).fill(0);
  const survivalSum=new Array(nPlayers).fill(0);
  const lifeSum=new Array(nPlayers).fill(0);
  const powerSum=new Array(nPlayers).fill(0);
  const factionWinCounts={}, factionOffered={};
  let poisonTotal=0,bidsTotal=0,unsoldTotal=0,drawnTotal=0,lengthSum=0;
  const lifeCurveSum=Array.from({length:CFG.ROUNDS},()=>new Array(nPlayers).fill(0));
  const lifeCurveCount=new Array(CFG.ROUNDS).fill(0);
  results.forEach(g=>{
    winRate[g.winnerId]++;
    g.survival.forEach((s,i)=>survivalSum[i]+=s);
    g.finalLife.forEach((l,i)=>lifeSum[i]+=l);
    g.finalPower.forEach((pw,i)=>powerSum[i]+=pw);
    Object.keys(g.factionWinCounts).forEach(f=>{ factionWinCounts[f]=(factionWinCounts[f]||0)+g.factionWinCounts[f]; });
    Object.keys(g.factionOffered).forEach(f=>{ factionOffered[f]=(factionOffered[f]||0)+g.factionOffered[f]; });
    poisonTotal+=g.poisonBids; bidsTotal+=g.totalBids; unsoldTotal+=g.unsoldItems; drawnTotal+=g.drawnItems;
    lengthSum+=g.gameLength;
    g.lifeByRound.forEach((lifeArr,ri)=>{ lifeCurveSum[ri]=lifeCurveSum[ri].map((v,pi)=>v+lifeArr[pi]); lifeCurveCount[ri]++; });
  });
  return {
    games:n,
    winRate:winRate.map(w=>n?w/n:0),
    avgSurvivalNights:survivalSum.map(s=>n?s/n:0),
    avgFinalLife:lifeSum.map(s=>n?s/n:0),
    avgFinalPower:powerSum.map(s=>n?s/n:0),
    lifeCurve:lifeCurveSum.map((arr,ri)=>lifeCurveCount[ri]?arr.map(v=>v/lifeCurveCount[ri]):null),
    factionWinCounts, unsoldRate:drawnTotal?unsoldTotal/drawnTotal:0,
    poisonUsageRate:bidsTotal?poisonTotal/bidsTotal:0,
    avgGameLength:n?lengthSum/n:0,
  };
}
/* 把 runMany 的統計輸出成可直接貼進 markdown 的表格 */
function statsToMarkdown(stats,title){
  const seatNames=["南家(id0)","北家(id1)","西家(id2)","東家(id3)"];
  let md=title?`#### ${title}\n\n`:"";
  md+=`局數：${stats.games}　平均對局長度：${stats.avgGameLength.toFixed(2)} 夜　流標率：${(stats.unsoldRate*100).toFixed(1)}%　毒標使用率：${(stats.poisonUsageRate*100).toFixed(1)}%\n\n`;
  md+="| 玩家 | 勝率 | 平均存活夜數 | 平均最終壽命 | 平均最終戰力 |\n|---|---|---|---|---|\n";
  stats.winRate.forEach((w,i)=>{
    md+=`| ${seatNames[i]||("玩家"+i)} | ${(w*100).toFixed(1)}% | ${stats.avgSurvivalNights[i].toFixed(2)} | ${stats.avgFinalLife[i].toFixed(2)} | ${stats.avgFinalPower[i].toFixed(2)} |\n`;
  });
  md+="\n| 陣營 | 得標次數 |\n|---|---|\n";
  Object.keys(stats.factionWinCounts).forEach(f=>{ md+=`| ${f} | ${stats.factionWinCounts[f]} |\n`; });
  return md;
}
/* ================= 優勢策略窮舉器（強制閘門，見 docs/GAME_DESIGN.md 六之四） =================
   analyzeEvent({name,players,options,payoff}) → 窮舉所有玩家選擇組合，回報是否存在優勢策略／免費午餐。
   判定定義照設計文件字面實作，不自行更動：
   - 弱優勢：選項 A 對玩家 i 而言，在每一種對手選擇組合下收益都 ≥ 其他所有選項，且至少一種組合下嚴格 >
   - freeLunch：存在「全員選同一項」的組合使每個人收益都 > 0
   - verdict='FAIL' 若 dominant 非空 或 freeLunch 為真 */
function decodeCombo(code,players,nOpts){
  const idxs=new Array(players); let c=code;
  for(let k=0;k<players;k++){ idxs[k]=c%nOpts; c=Math.floor(c/nOpts); }
  return idxs;
}
function analyzeEvent(spec){
  const {players,options,payoff}=spec;
  const nOpts=options.length;
  const total=Math.pow(nOpts,players);
  if(total>2000000) throw new Error("analyzeEvent: 組合數過大（"+total+"），請縮小 options 或 players");
  const payoffTable=[];
  for(let code=0;code<total;code++){
    const idxs=decodeCombo(code,players,nOpts);
    const choices=idxs.map(ix=>options[ix]);
    payoffTable.push({idxs,result:payoff(choices)});
  }
  const dominant=[]; const detail=[];
  for(let i=0;i<players;i++){
    const tables=options.map(()=>({}));
    for(const entry of payoffTable){
      const A=entry.idxs[i];
      const otherKey=entry.idxs.filter((_,j)=>j!==i).join(",");
      tables[A][otherKey]=entry.result[i];
    }
    for(let A=0;A<nOpts;A++){
      let dominatesAll=true, strictSomewhere=false;
      for(let B=0;B<nOpts && dominatesAll;B++){
        if(B===A) continue;
        for(const key of Object.keys(tables[A])){
          const pa=tables[A][key], pb=tables[B][key];
          if(pa<pb){ dominatesAll=false; break; }
          if(pa>pb) strictSomewhere=true;
        }
      }
      if(dominatesAll) dominant.push({player:i,option:options[A],strict:strictSomewhere});
    }
    detail.push({player:i,table:tables.map((t,idx)=>({option:options[idx],byOthers:t}))});
  }
  let freeLunch=false;
  for(let a=0;a<nOpts;a++){
    const choices=new Array(players).fill(options[a]);
    if(payoff(choices).every(v=>v>0)){ freeLunch=true; break; }
  }
  const verdict=(dominant.length>0||freeLunch)?"FAIL":"PASS";
  return {dominant,freeLunch,verdict,detail};
}
/* 窮舉閘門的雙向測試治具：舊版試膽大會（已知有優勢策略，必須 FAIL）／修正版（少數決，必須 PASS） */
const EVENT_OLD_SHRINE={
  name:"試膽大會（舊版・已知有 bug）", players:4, options:["in","out"],
  payoff(choices){
    const countIn=choices.filter(c=>c==="in").length;
    if(countIn===0) return choices.map(()=>-4);
    return choices.map(c=>c==="in"?(-2+15/countIn):0);
  }
};
const EVENT_NEW_SHRINE={
  name:"試膽大會（修正版・少數決）", players:4, options:["in","out"],
  payoff(choices){
    const n=choices.length, countIn=choices.filter(c=>c==="in").length, countOut=n-countIn;
    if(countIn===0||countOut===0) return choices.map(()=>-3);
    if(countIn===countOut) return choices.map(()=>-1);
    const inIsMinority=countIn<countOut;
    return choices.map(c=>c==="in"?(inIsMinority?6:-3):(inIsMinority?-3:6));
  }
};
/* 三個上線異事的閘門 spec（GAME_DESIGN §六之四存證，可隨時重跑）：
   試膽大會直接用 EVENT_NEW_SHRINE；瘟王／厲鬼為密封數字類，在離散網格上窮舉。
   2026-09-02 Node 實測三者 verdict 均 PASS（dominant 空、freeLunch false）。 */
const EVENT_SPEC_PLAGUE={
  name:"瘟王過境（湊12／失敗-6／最高投入得寶≈5）", players:4, options:[0,2,3,4],
  payoff(ch){
    const tot=ch.reduce((a,b)=>a+b,0);
    if(tot>=12){ const mx=Math.max(...ch); const nt=ch.filter(c=>c===mx).length;
      return ch.map(c=>-c+(c===mx&&mx>0?5/nt:0)); }
    return ch.map(c=>-c-6);
  }
};
const EVENT_SPEC_GHOST={
  name:"厲鬼索命（0號=被索者／無人出價-10／他人得標奪寶≈5）", players:4, options:[0,2,4,6],
  payoff(ch){
    const mx=Math.max(...ch);
    if(mx===0) return ch.map((c,i)=>i===0?-10:0);
    const tied=ch.map((c,i)=>c===mx?i:-1).filter(i=>i>=0), n=tied.length;
    const out=ch.map(()=>0);
    tied.forEach(w=>{ out[w]-=mx/n; if(w!==0){ out[w]+=5/n; out[0]-=5/n; } });
    return out;
  }
};
/* 第二批五樁的閘門 spec（2026-09-02 Node 實測均 PASS；建模假設見各註解）。
   送肉粽=修A（落選沾穢-1）、觀落陰=修B（落標付半）、放貸=修C（8/11/14/17）、
   大風吹=修D（風向圈）、博杯=修E（廟口擲杯，彩池×0.8）——原五版均 FAIL，裁定紀錄見 GAME_DESIGN changelog。 */
const EVENT_SPEC_ZONGZI={
  name:"送肉粽·修A（C=4王船煞/落選沾穢-1/無人-5）", players:4, options:["pass",0,3,6],
  payoff(ch){
    const asks=ch.map(c=>c==="pass"?null:c);
    const act=asks.map((a,i)=>a!==null?i:-1).filter(i=>i>=0);
    if(!act.length) return ch.map(()=>-5);
    const mn=Math.min(...act.map(i=>asks[i]));
    const tied=act.filter(i=>asks[i]===mn), n=tied.length;
    const out=ch.map(()=>0);
    act.forEach(i=>{ out[i]-=1; });
    tied.forEach(w=>{ out[w]+=(mn-4+1)/n; });
    return out;
  }};
const EVENT_SPEC_GUAN={
  name:"觀落陰·修B（V=3零和資訊/落標付半）", players:4, options:[0,2,4],
  payoff(ch){
    const mx=Math.max(...ch);
    if(mx===0) return ch.map(()=>0);
    const V=3;
    const tied=ch.map((c,i)=>c===mx?i:-1).filter(i=>i>=0), n=tied.length;
    const o=ch.map(()=>0);
    for(const w of tied){
      o[w]+=(-mx+V)/n;
      for(let i=0;i<4;i++) if(i!==w) o[i]+=(-V/3-(ch[i]>0?Math.ceil(ch[i]/2):0))/n;
    }
    return o;
  }};
const EVENT_SPEC_LOAN={
  name:"陰間放貸·修C（還8/11/14/17，獨借+2）", players:4, options:["borrow","no"],
  payoff(ch){
    const k=ch.filter(c=>c==="borrow").length;
    const repay=k?({1:8,2:11,3:14,4:17})[k]:0;
    return ch.map(c=>c==="borrow"?10-repay:0);
  }};
const EVENT_SPEC_WIND={
  name:"大風吹·修D 風向圈（富袋0號值6其餘2/單人圈-1）", players:4, options:["E","W"],
  payoff(ch){
    const worth=[6,2,2,2];
    const out=ch.map(()=>0);
    for(const side of ["E","W"]){
      const circ=ch.map((c,i)=>c===side?i:-1).filter(i=>i>=0);
      if(circ.length===1){ out[circ[0]]-=1; continue; }
      for(const i of circ){
        const others=circ.filter(j=>j!==i);
        out[i]-=worth[i];
        out[i]+=others.reduce((s,j)=>s+worth[j],0)/others.length;
      }
    }
    return out;
  }};
const EVENT_SPEC_POE={
  name:"博杯·修E 廟口擲杯（彩池0.8+寶4/成功者中最高注奪彩）", players:4, options:[0,2,5,10],
  payoff(ch){
    const act=ch.map((x,i)=>x>0?i:-1).filter(i=>i>=0);
    const pot=ch.reduce((a,b)=>a+b,0);
    const out=ch.map(x=>-x);
    if(!act.length) return out;
    const n=act.length;
    for(let mask=1; mask<(1<<n); mask++){
      let pr=1; const succ=[];
      act.forEach((pi,k)=>{
        const p=ch[pi]/(ch[pi]+8);
        if(mask&(1<<k)){ pr*=p; succ.push(pi); } else pr*=(1-p);
      });
      const mx=Math.max(...succ.map(i=>ch[i]));
      const tied=succ.filter(i=>ch[i]===mx);
      tied.forEach(w=>{ out[w]+=pr*(0.8*pot+4)/tied.length; });
    }
    return out;
  }};
function snapPlayers(){
  return S.players.map(p=>({id:p.id,life:p.life,alive:p.alive,bag:p.bag.map(x=>x.n),power:power(p)}));
}
function simulate(seed){
  makeState("solo",seed);
  const nights=[];
  for(;;){
    drawWishes(); /* 與 beginRound 同時機（出價前）；WISH_ON=false 時不耗亂數、trace 不變 */
    const evres=runEventPhaseHeadless(); /* 異事夜：EVENT_ON=false 恆 null、零 rng 消耗 */
    const pre=snapPlayers();
    if(S.players.filter(p=>p.alive).length<=1){ /* 異事殺到剩1人：該夜不再拍賣/對決 */
      nights.push({round:S.round, market:S.market.map(x=>x.n), pre, auction:[], mid:pre, battles:[],
        bye:null, nightly:[], deaths:[], ...(evres?{event:evres}:{}), post:snapPlayers()});
      break;
    }
    const market=S.market.map(x=>x.n);
    S.humanBids={};
    S.players.forEach(p=>{ if(!p.ai) S.humanBids[p.id]=scriptedBids(p); });
    const reveal=resolveAuction();
    const auction=reveal.map(r=>({
      item:r.it.n,
      winnerId:r.winner?r.winner.p.id:null,
      amt:r.winner?r.winner.amt:null,
      outcome:r.outcome,
      events:r.events.map(e=>e.txt),
    }));
    const mid=snapPlayers();
    const R=resolveBattles();
    const battles=R.fights.map(f=>({
      aId:f.A.id,bId:f.B.id,pa:f.pa,pb:f.pb,
      winnerId:f.tie?null:f.w.id, dmg:f.tie?0:f.dmg,
      extra:f.extra?[...f.extra]:[],
    }));
    nights.push({
      round:S.round, market, pre, auction, mid, battles,
      bye:R.bye, nightly:R.nightly, deaths:R.deaths.map(d=>d.id),
      ...(evres?{event:evres}:{}),
      post:snapPlayers(),
    });
    const aliveN=S.players.filter(p=>p.alive).length;
    const humanN=S.players.filter(p=>!p.ai&&p.alive).length;
    if(!humanN||aliveN<=1||S.round>=CFG.ROUNDS) break;
    S.round++; S.market=S.nextMarket; S.nextMarket=drawMarket();
  }
  stripEndgameItems();
  return {seed:S.seed, nights};
}
function trace(seeds){ return {seeds:[...seeds], runs:[...seeds].map(s=>simulate(s))}; }
