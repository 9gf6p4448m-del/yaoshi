<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>妖市 v0.2</title>
<meta name="theme-color" content="#14101f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%8F%AE%3C/text%3E%3C/svg%3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ===== 佔位美術：正式版整批替換，邏輯層不得依賴任何樣式 ===== */
:root{
  --bg:#120e1d; --table:#1d1531; --table2:#251a3e; --panel:#1f1830; --panel2:#2a2142;
  --line:#3d3260; --ink:#e8e2f5; --dim:#9a8fc0; --gold:#e8b34b; --red:#e05555; --green:#5fbf77;
  --zuling:#5fae8f; --xianghuo:#e0a13f; --yinqi:#9b6fd4; --curse:#d45577;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
  max-width:480px;margin:0 auto;min-height:100vh;font-size:15px;overflow-x:hidden}
/* ---- 牌桌 ---- */
#table{display:none;flex-direction:column;min-height:100vh;padding-bottom:84px}
#seatsTop{display:flex;justify-content:space-around;gap:6px;padding:8px 8px 0}
.seat{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:6px 8px;text-align:center;flex:1;max-width:130px;cursor:pointer;transition:box-shadow .3s}
.seat.hl{box-shadow:0 0 12px var(--gold);border-color:var(--gold)}
.seat.dead{opacity:.35}
.seat .av{font-size:24px;line-height:1.1}
.seat .nm{font-size:12px;white-space:nowrap}
.seat .st{font-size:11px;color:var(--dim)}
.seat .dir{position:absolute;top:-7px;left:8px;background:var(--table2);border:1px solid var(--line);
  border-radius:6px;font-size:10px;padding:0 5px;color:var(--gold)}
.bubble{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 4px);z-index:9;
  background:#efe8d8;color:#2a2142;border-radius:10px;padding:5px 9px;font-size:12px;
  white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.bubble.show{opacity:1}
.bubble::before{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-bottom-color:#efe8d8;border-top:none}
/* ---- 桌面中央 ---- */
#felt{flex:1;margin:14px 10px 8px;background:radial-gradient(ellipse at 50% 30%,var(--table2),var(--table));
  border:2px solid var(--line);border-radius:18px;padding:12px 10px;min-height:340px;position:relative}
#feltHead{text-align:center;font-size:13px;color:var(--gold);margin-bottom:8px}
#stage{min-height:60px}
.preview{background:rgba(0,0,0,.25);border:1px dashed var(--gold);border-radius:10px;padding:7px 10px;
  font-size:12px;color:var(--gold);margin-bottom:10px;text-align:center}
#market{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;
  position:relative;transition:transform .15s}
.mcard:active{transform:scale(.97)}
.mcard.curse{border-color:var(--curse)}
.mcard.bided{border-color:var(--gold)}
.mcard .nm{font-weight:bold;font-size:14px}
.mcard .pw{font-size:12px;color:var(--gold)}
.mcard .ab{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.35}
.mybid{position:absolute;top:-8px;right:-4px;background:var(--gold);color:#14101f;border-radius:8px;
  font-size:11px;font-weight:bold;padding:1px 7px}
.mybid.poison{background:var(--curse);color:#fff}
.fchip{display:inline-block;font-size:10px;border-radius:5px;padding:0 5px;margin-left:4px;color:#14101f;font-weight:bold}
.f-zuling{background:var(--zuling)} .f-xianghuo{background:var(--xianghuo)}
.f-yinqi{background:var(--yinqi)} .f-curse{background:var(--curse);color:#fff}
/* ---- 演出舞台 ---- */
.stageCard{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:12px;
  text-align:center;animation:pop .3s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.stageCard .big{font-size:18px;font-weight:bold}
.bidfly{display:flex;justify-content:space-between;padding:5px 10px;margin-top:6px;background:var(--panel2);
  border-radius:8px;font-size:13px;animation:slidein .3s}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.bidfly.win{background:var(--gold);color:#14101f;font-weight:bold}
.outcome{margin-top:8px;color:var(--gold);font-size:13px;animation:pop .3s}
.vs{display:flex;justify-content:space-around;align-items:center;margin:8px 0;font-size:15px}
.vs .pwr{font-size:26px;font-weight:bold;color:var(--gold)}
.dmgfloat{color:var(--red);font-weight:bold;animation:rise .8s}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
/* ---- 你的座位 ---- */
#south{display:flex;align-items:center;gap:10px;margin:0 10px 8px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:8px 12px}
#south .dir{color:var(--gold);font-size:12px}
#south .life{font-size:22px;font-weight:bold;color:var(--green)}
#south .life.low{color:var(--red)}
#south button{margin-left:auto;height:38px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);padding:0 12px;font-size:13px}
/* ---- 底部主按鈕 ---- */
#footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--panel);border-top:1px solid var(--line);padding:8px 10px;z-index:10}
#budget{font-size:12px;color:var(--dim);text-align:center;margin-bottom:5px}
#budget.over{color:var(--red);font-weight:bold}
.bigbtn{width:100%;height:48px;border-radius:10px;border:none;background:var(--gold);color:#14101f;
  font-size:16px;font-weight:bold}
.bigbtn:disabled{opacity:.4}
/* ---- 出價小抽屜 ---- */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:none;align-items:flex-end;justify-content:center}
#sheetbox{background:var(--panel);border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:16px 14px 20px}
#sheetbox h3{font-size:16px;margin-bottom:2px}
#sheetbox .desc{font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.4}
.bidrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stepper{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:52px;height:48px;background:var(--panel2);color:var(--ink);border:none;font-size:22px}
.stepper .amt{width:56px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:var(--gold)}
.typebtn,.tgtsel{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);padding:0 12px;font-size:14px}
.typebtn.yaming{border-color:var(--red);color:var(--red)}
.capnote{font-size:11px;color:var(--dim);width:100%}
/* ---- 通用 ---- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modalbox{background:var(--panel);border-radius:16px 16px 0 0;width:100%;max-width:480px;
  max-height:70vh;overflow-y:auto;padding:14px}
.bagit{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.bagit .abtxt{font-size:11px;color:var(--dim);display:block}
.mut{color:var(--dim);font-size:12px}
h2{font-size:17px;color:var(--gold);margin:4px 0 10px}
.title{text-align:center;padding:56px 20px}
.title h1{font-size:46px;color:var(--gold);letter-spacing:10px;margin-bottom:10px}
.title p{color:var(--dim);font-size:13px;line-height:1.9}
.endrank{font-size:15px;padding:6px 0;border-bottom:1px dashed var(--line)}
#skipbtn{position:absolute;top:8px;right:10px;background:none;border:1px solid var(--line);
  color:var(--dim);border-radius:8px;padding:3px 10px;font-size:12px;display:none;z-index:5}
.heal{color:var(--green)} .dmg{color:var(--red)}
</style>
</head>
<body>
<div id="titleScr" class="title">
  <h1>妖　市</h1>
  <p>深夜的妖怪牌桌，壽命就是你的籌碼。<br>
  你坐南家，北東西三席妖怪買家環伺。<br>
  競標祖靈、香火、陰氣三系法寶，<br>
  把詛咒塞給別人，活到天亮。</p>
  <p style="margin-top:14px;color:var(--gold)">v0.2 原型・佔位美術<br>數值與能力會依試玩回饋調整</p>
</div>
<div id="table">
  <div id="seatsTop"></div>
  <div id="felt">
    <button id="skipbtn" onclick="SKIP=true">跳過演出 ≫</button>
    <div id="feltHead"></div>
    <div id="stage"></div>
  </div>
  <div id="south">
    <div><div class="dir">南・你</div><div class="life" id="myLife"></div></div>
    <div class="mut" id="myPow"></div>
    <button onclick="showBag(0)">我的袋子</button>
  </div>
</div>
<div id="footer">
  <div id="budget"></div>
  <button class="bigbtn" id="mainbtn"></button>
</div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetbox"></div></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div id="modalbox"></div></div>

<script>
"use strict";
/* ================= 常數（【試玩必調】集中此處） ================= */
const CFG = {
  LIFE: 40, ROUNDS: 12, MARKET: 4,
  CURSE_PROB: 0.65,
  SET_MIN: 2,
  DMG_BASE: 3, DMG_DIV: 5, DMG_MAX: 6,
  CONS_CAP_DIV: 3,
  T: 650,            /* 演出基本節拍 ms【試玩必調】 */
};
const FAC = {
  zuling:{n:"祖靈",cls:"f-zuling"}, xianghuo:{n:"香火",cls:"f-xianghuo"},
  yinqi:{n:"陰氣",cls:"f-yinqi"}, curse:{n:"詛咒",cls:"f-curse"},
};
/* 能力文案（id → 說明）。效果實作見各 hook；數值【試玩必調】 */
const ABTXT = {
  bow:"戰勝時，對手額外 -2 壽命",
  shield:"戰敗時，少失 2 壽命",
  eye:"整夜未得標任何拍品時，夜末回 2 壽命",
  thunder:"共鳴計算時，祖靈視為多 1 件",
  boat:"每夜末回 1 壽命",
  flag:"你的保守標上限提高 50%",
  sword:"你袋中詛咒品的負值減半",
  wangchuan:"得標時，把你袋中一件詛咒品送給戰力最高的對手",
  bell:"明夜預告顯示兩件拍品",
  wuying:"共鳴計算時，香火視為多 1 件",
  tiger:"被毒標塞中時，下手的人失 2 壽命",
  redhat:"你的毒標比價時視為 +2",
  hairpin:"戰敗時，勝者也失 1 壽命",
  chair:"看穿所有對手的實際壽命",
  raincoat:"押命標落標時不再失血",
  nail:"戰勝時回 1 壽命",
  buoy:"共鳴計算時，陰氣視為多 1 件",
};
/* 道具池（p=戰力，ab=能力id；數值【試玩必調】，文案佔位） */
const POOL = [
  {n:"射日神弓",f:"zuling",p:7,ab:"bow",d:"射落烈日的太初之弓"},
  {n:"百步蛇紋盾",f:"zuling",p:6,ab:"shield",d:"排灣祖靈的鱗紋守護"},
  {n:"巴冷公主珠鍊",f:"zuling",p:6,d:"人蛇之戀的琉璃信物"},
  {n:"祖靈之眼",f:"zuling",p:5,ab:"eye",d:"注視子孫的山林之眼"},
  {n:"雷女之火",f:"zuling",p:5,ab:"thunder",d:"雷神之女擲下的天火"},
  {n:"拼板舟",f:"zuling",p:4,ab:"boat",d:"達悟人渡海的飛魚之舟"},
  {n:"山豬牙飾",f:"zuling",p:4,d:"勇士獵得的榮耀之牙"},
  {n:"媽祖令旗",f:"xianghuo",p:7,ab:"flag",d:"海上聖母的鎮瀾令"},
  {n:"王爺劍",f:"xianghuo",p:6,ab:"sword",d:"代天巡狩的斬瘟之劍"},
  {n:"送王船",f:"xianghuo",p:6,ab:"wangchuan",d:"載走瘟神的燒王船"},
  {n:"千里眼銅鈴",f:"xianghuo",p:5,ab:"bell",d:"望盡千里的預示銅鈴"},
  {n:"五營旗",f:"xianghuo",p:5,ab:"wuying",d:"五方神將的令旗"},
  {n:"虎爺印",f:"xianghuo",p:4,ab:"tiger",d:"咬鬼鎮煞的虎爺神印"},
  {n:"香灰符",f:"xianghuo",p:4,d:"廟裡求來的平安香灰"},
  {n:"魔神仔紅帽",f:"yinqi",p:7,ab:"redhat",d:"山中牽人迷途的紅帽"},
  {n:"林投姐髮簪",f:"yinqi",p:6,ab:"hairpin",d:"林投樹下的怨情之簪"},
  {n:"椅仔姑竹椅",f:"yinqi",p:6,ab:"chair",d:"問事通靈的三姑竹椅"},
  {n:"黃色小雨衣",f:"yinqi",p:5,ab:"raincoat",d:"雨夜裡跟在你身後"},
  {n:"水鬼浮標",f:"yinqi",p:5,ab:"buoy",d:"渡不了的人留下的"},
  {n:"虎姑婆指甲",f:"yinqi",p:4,ab:"nail",d:"床下傳來咬手指的聲音"},
  {n:"陰陽眼銅錢",f:"yinqi",p:4,d:"貼上眼皮就看得見"},
];
const CURSES = [
  {n:"冥婚紅包",f:"curse",p:-5,d:"撿到就得娶",curse:true},
  {n:"魔神仔的芭樂",f:"curse",p:0,d:"每輪結束失血 1",curse:true,drain:1},
  {n:"抓交替水符",f:"curse",p:-4,d:"水鬼的名冊",curse:true},
  {n:"縛靈鎖",f:"curse",p:-6,d:"鎖魂之鏈",curse:true},
  {n:"白虎煞",f:"curse",p:-3,d:"沖煞入宅",curse:true},
];
/* AI 台詞（佔位文案，正式版另審） */
const LINES = {
  1:{av:"👹",win:["這件老子要定了！","嘿嘿，好貨入袋。"],lose:["嘖——誰出這麼高？","搶什麼搶！"],
     poison:["拿去，別客氣。"],poisoned:["呸！誰塞的！"],bwin:["妖市裡別跟我裝闊。"],blose:["今夜風水不對…"]},
  2:{av:"👵",win:["乖乖，跟婆婆回家。","婆婆看上的跑不掉。"],lose:["年輕人，手腳真快。"],
     poison:["這個…給你戴著玩。"],poisoned:["小鬼敢陰我？"],bwin:["夜還長呢，孩子。"],blose:["咳咳…婆婆記住你了。"]},
  3:{av:"📜",win:["此物值此價，合算。","在下失禮了。"],lose:["溢價了，不追。"],
     poison:["非常抱歉，但棋局如此。"],poisoned:["豈有此理！"],bwin:["勝負早在標下時已定。"],blose:["失算…失算…"]},
};
const DIRS = {1:"北",2:"西",3:"東"};
/* ================= 工具 ================= */
let S=null, myBids=[], SKIP=false;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r, SKIP?0:ms));
const has=(p,ab)=>p.bag.some(x=>x.ab===ab);
/* ================= 引擎 ================= */
function newGame(){
  S={
    round:1, logs:[],
    deck:shuffle([...POOL,...POOL].map(x=>({...x}))),
    cdeck:shuffle([...CURSES,...CURSES].map(x=>({...x}))),
    players:[
      {id:0,name:"你",ai:null,life:CFG.LIFE,bag:[],alive:true},
      {id:1,name:"青面攤主",ai:{aggr:0.85,spite:0.25},life:CFG.LIFE,bag:[],alive:true},
      {id:2,name:"紅衣婆婆",ai:{aggr:0.6,spite:0.6},life:CFG.LIFE,bag:[],alive:true},
      {id:3,name:"斷手書生",ai:{aggr:0.7,spite:0.4},life:CFG.LIFE,bag:[],alive:true},
    ],
    wonAny:new Set(),
  };
  S.market=drawMarket(); S.nextMarket=drawMarket();
  $("titleScr").style.display="none";
  $("table").style.display="flex";
  showMarket();
}
function drawMarket(){
  const m=[]; const hasCurse=Math.random()<CFG.CURSE_PROB && S.cdeck.length;
  for(let i=0;i<CFG.MARKET-(hasCurse?1:0);i++){
    if(!S.deck.length) S.deck=shuffle([...POOL].map(x=>({...x})));
    m.push(S.deck.pop());
  }
  if(hasCurse) m.push(S.cdeck.pop());
  return shuffle(m);
}
function facCount(p,f){
  let c=p.bag.filter(x=>!x.curse&&x.f===f).length;
  if(f==="zuling"&&has(p,"thunder"))c++;
  if(f==="xianghuo"&&has(p,"wuying"))c++;
  if(f==="yinqi"&&has(p,"buoy"))c++;
  return c;
}
function power(p){
  let t=0;
  for(const x of p.bag){
    if(x.curse&&x.p<0&&has(p,"sword")) t+=-Math.ceil(Math.abs(x.p)/2);
    else t+=x.p;
  }
  for(const f of ["zuling","xianghuo","yinqi"]){
    const c=facCount(p,f);
    if(c>=CFG.SET_MIN) t+=c*c;
  }
  return t;
}
function consCapFor(p){
  let cap=Math.max(1,Math.floor(p.life/CFG.CONS_CAP_DIV));
  if(has(p,"flag")) cap=Math.floor(cap*1.5);
  return cap;
}
/* AI 出價 */
function aiBids(p){
  const bids=S.market.map(()=>null);
  const budget=Math.floor(p.life*0.45);
  const opts=[];
  S.market.forEach((it,i)=>{
    if(it.curse){
      if(Math.random()<p.ai.spite){
        const foes=S.players.filter(q=>q.alive&&q.id!==p.id);
        const tgt=foes.sort((a,b)=>power(b)-power(a))[0];
        opts.push({i,val:3+rnd(0,2),intent:"poison",target:tgt.id});
      }
      return;
    }
    const c=p.bag.filter(x=>x.f===it.f).length;
    const marginal=(c+1>=CFG.SET_MIN)?(c+1)*(c+1)-(c>=CFG.SET_MIN?c*c:0):0;
    const val=it.p+marginal+(it.ab?2:0)+rnd(-2,2);
    opts.push({i,val,intent:"keep",target:null});
  });
  opts.sort((a,b)=>b.val-a.val);
  let spent=0;
  for(const o of opts.slice(0,2)){
    let amt=Math.max(0,Math.round(o.val*p.ai.aggr)+rnd(-1,1));
    amt=Math.min(amt,budget-spent,p.life-spent);
    if(amt<=0)continue;
    const cap=consCapFor(p);
    const type=(amt>cap||(o.val>8&&Math.random()<p.ai.aggr))?"yaming":"cons";
    bids[o.i]={amt,type,intent:o.intent,target:o.target};
    spent+=amt;
  }
  return bids;
}
/* 開標結算（純邏輯，回傳演出資料） */
function resolveAuction(){
  const all=S.players.map(p=>{
    if(!p.alive)return S.market.map(()=>null);
    if(p.id===0)return myBids.map(b=>b.amt>0?{...b}:null);
    return aiBids(p);
  });
  const reveal=[];
  S.wonAny=new Set();
  S.market.forEach((it,i)=>{
    const entries=[];
    S.players.forEach(p=>{const b=all[p.id][i];if(b)entries.push({p,...b});});
    let winner=null;
    if(entries.length){
      const eff=e=>e.amt+((e.intent==="poison"&&has(e.p,"redhat"))?2:0);
      const top=Math.max(...entries.map(eff));
      const tops=entries.filter(e=>eff(e)===top);
      winner=tops[Math.floor(Math.random()*tops.length)];
    }
    const events=[];
    entries.forEach(e=>{
      if(e===winner){e.p.life-=e.amt;}
      else if(e.type==="yaming"){
        if(has(e.p,"raincoat")) events.push({txt:`${e.p.name} 的黃色小雨衣擋下了落標失血`});
        else e.p.life-=Math.ceil(e.amt/2);
      }
    });
    let outcome="流標";
    if(winner){
      S.wonAny.add(winner.p.id);
      if(winner.intent==="poison"){
        const tgt=S.players[winner.target];
        tgt.bag.push(it);
        outcome=`${winner.p.name} 毒標得手 → 塞進 ${tgt.name} 的袋子`;
        if(has(tgt,"tiger")){winner.p.life-=2;events.push({txt:`${tgt.name} 的虎爺印反咬，${winner.p.name} -2 壽命`});}
      }else if(it.curse){
        outcome=`${winner.p.name} 買下銷毀（自保）`;
      }else{
        winner.p.bag.push(it);
        outcome=`${winner.p.name} 入袋`;
        if(it.ab==="wangchuan"){
          const curses=winner.p.bag.filter(x=>x.curse);
          if(curses.length){
            const worst=curses.sort((a,b)=>a.p-b.p)[0];
            const foes=S.players.filter(q=>q.alive&&q.id!==winner.p.id);
            if(foes.length){
              const tgt=foes.sort((a,b)=>power(b)-power(a))[0];
              winner.p.bag.splice(winner.p.bag.indexOf(worst),1);
              tgt.bag.push(worst);
              events.push({txt:`送王船啟航——「${worst.n}」被送進 ${tgt.name} 的袋子`});
            }
          }
        }
      }
    }
    reveal.push({it,entries,winner,outcome,events});
  });
  S.players.forEach(p=>{if(p.alive&&p.life<=0){p.alive=false;p.life=0;}});
  return reveal;
}
/* 結算戰配對：round-robin，出局者移除後重排 */
function pairings(ids,round){
  const list=[...ids]; if(list.length%2)list.push(null);
  const m=list.length; if(m<2)return{pairs:[],bye:ids[0]??null};
  const others=list.slice(1),r=round%(m-1);
  const rot=[list[0],...others.map((_,k)=>others[(k+r)%others.length])];
  const pairs=[];let bye=null;
  for(let k=0;k<m/2;k++){
    const a=rot[k],b=rot[m-1-k];
    if(a===null)bye=b;else if(b===null)bye=a;else pairs.push([a,b]);
  }
  return{pairs,bye};
}
function resolveBattles(){
  const alive=S.players.filter(p=>p.alive).map(p=>p.id);
  const {pairs,bye}=pairings(alive,S.round-1);
  const fights=[];
  pairs.forEach(([a,b])=>{
    const A=S.players[a],B=S.players[b];
    const pa=power(A),pb=power(B);
    if(pa===pb){fights.push({A,B,pa,pb,tie:true});return;}
    const [w,l,pw,pl]=pa>pb?[A,B,pa,pb]:[B,A,pb,pa];
    let dmg=CFG.DMG_BASE+Math.min(CFG.DMG_MAX,Math.floor((pw-pl)/CFG.DMG_DIV));
    if(has(w,"bow"))dmg+=2;
    if(has(l,"shield"))dmg=Math.max(1,dmg-2);
    l.life-=dmg;
    const extra=[];
    if(has(l,"hairpin")){w.life-=1;extra.push(`${l.name} 的髮簪回敬 ${w.name} -1`);}
    if(has(w,"nail")){w.life+=1;extra.push(`${w.name} 吸食勝利 +1`);}
    fights.push({A,B,pa,pb,w,l,dmg,extra});
  });
  const nightly=[];
  S.players.forEach(p=>{
    if(!p.alive)return;
    const drain=p.bag.reduce((s,x)=>s+(x.drain||0),0);
    if(drain){p.life-=drain;nightly.push(`🩸 ${p.name} 受詛咒侵蝕 -${drain}`);}
    if(has(p,"boat")){p.life+=1;nightly.push(`⛵ ${p.name} 的拼板舟渡來生息 +1`);}
    if(has(p,"eye")&&!S.wonAny.has(p.id)){p.life+=2;nightly.push(`👁 ${p.name} 靜觀整夜，祖靈之眼回 +2`);}
  });
  const deaths=[];
  S.players.forEach(p=>{if(p.alive&&p.life<=0){p.alive=false;p.life=0;deaths.push(p);}});
  return{fights,bye,nightly,deaths};
}
/* ================= 牌桌渲染 ================= */
function renderSeats(hlIds){
  $("seatsTop").innerHTML=[1,2,3].map(id=>{
    const p=S.players[id];
    const lifeTxt=has(S.players[0],"chair")?`壽命 ${p.life}`:faceLbl(p);
    return `<div class="seat ${p.alive?"":"dead"} ${hlIds&&hlIds.includes(id)?"hl":""}" id="seat${id}" onclick="showBag(${id})">
      <span class="dir">${DIRS[id]}</span>
      <div class="av">${LINES[id].av}</div>
      <div class="nm">${p.name} ${faceOf(p)}</div>
      <div class="st">${lifeTxt}・${p.bag.length}件・力${power(p)}</div>
      <div class="bubble" id="bub${id}"></div>
    </div>`;
  }).join("");
  const me=S.players[0];
  $("myLife").textContent=me.life;
  $("myLife").className="life"+(me.life<=CFG.LIFE/3?" low":"");
  $("myPow").innerHTML=`戰力 <b style="color:var(--gold)">${power(me)}</b><br>袋 ${me.bag.length} 件`;
  $("feltHead").textContent=`第 ${S.round}/${CFG.ROUNDS} 夜`;
}
function faceOf(p){const r=p.life/CFG.LIFE;return !p.alive?"💀":r>2/3?"😊":r>1/3?"😰":"🥀";}
function faceLbl(p){const r=p.life/CFG.LIFE;return !p.alive?"出局":r>2/3?"氣色紅潤":r>1/3?"面色蒼白":"命懸一線";}
function say(id,txt){
  const b=$("bub"+id); if(!b)return;
  b.textContent=txt; b.classList.add("show");
  setTimeout(()=>b.classList.remove("show"), SKIP?300:2300);
}
function sayFrom(id,key){
  const arr=LINES[id]&&LINES[id][key]; if(!arr||!arr.length)return;
  say(id,arr[Math.floor(Math.random()*arr.length)]);
}
/* ================= 出價階段 ================= */
function showMarket(){
  SKIP=false; $("skipbtn").style.display="none";
  myBids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:1}));
  renderSeats();
  const pv=has(S.players[0],"bell")?S.nextMarket.slice(0,2):S.nextMarket.slice(0,1);
  $("stage").innerHTML=`
    <div class="preview">🔮 明夜預告：${pv.map(x=>`「${x.n}」`).join("、")}</div>
    <div id="market">${S.market.map((it,i)=>mcardHTML(it,i)).join("")}</div>
    <div class="mut" style="text-align:center;margin-top:10px">點拍品出價・可同時標多件</div>`;
  $("footer").style.display="block";
  $("mainbtn").textContent="蓋牌開標";
  $("mainbtn").onclick=startReveal;
  updateBudget();
}
function mcardHTML(it,i){
  const b=myBids[i];
  const badge=b.amt>0?`<span class="mybid ${b.intent==="poison"?"poison":""}">${b.intent==="poison"?"毒":"押"} ${b.amt}</span>`:"";
  return `<div class="mcard ${it.curse?"curse":""} ${b.amt>0?"bided":""}" id="mc${i}" onclick="openSheet(${i})">
    ${badge}
    <div class="nm">${it.n}</div>
    <div><span class="pw">${it.curse?"":"戰力 "}${it.p>=0?"+":""}${it.p}</span><span class="fchip ${FAC[it.f].cls}">${FAC[it.f].n}</span></div>
    <div class="ab">${it.ab?("✦ "+ABTXT[it.ab]):it.d}${it.drain?`・每夜 -${it.drain} 血`:""}</div>
  </div>`;
}
let sheetIdx=null;
function openSheet(i){
  sheetIdx=i;
  const it=S.market[i],b=myBids[i];
  const aliveAI=S.players.filter(p=>p.id!==0&&p.alive);
  const c=S.players[0].bag.filter(x=>x.f===it.f&&!x.curse).length;
  const syn=(!it.curse&&c>0)?`<br>💡 你已有 ${FAC[it.f].n} ×${c}，拿下後共鳴 ${(c+1>=CFG.SET_MIN)?`+${(c+1)*(c+1)}`:"尚未啟動"}`:"";
  $("sheetbox").innerHTML=`
    <h3>${it.n}<span class="fchip ${FAC[it.f].cls}">${FAC[it.f].n}</span></h3>
    <div class="desc">${it.ab?("✦ "+ABTXT[it.ab]+"<br>"):""}${it.d}${it.curse?"":"・戰力 +"+it.p}${syn}</div>
    <div class="bidrow">
      <div class="stepper">
        <button onclick="bump(-1)">−</button><span class="amt" id="shAmt">${b.amt}</span><button onclick="bump(1)">＋</button>
      </div>
      <button class="typebtn" id="shType" onclick="flipType()">保守標</button>
    </div>
    ${it.curse?`<div class="bidrow"><select class="tgtsel" id="shTgt" onchange="setTgt()" style="width:100%">
      <option value="destroy">買下銷毀（自保）</option>
      ${aliveAI.map(p=>`<option value="${p.id}">毒標塞給 ${DIRS[p.id]}家・${p.name}</option>`).join("")}
    </select></div>`:""}
    <div class="capnote" id="shCap"></div>
    <button class="bigbtn" style="margin-top:12px" onclick="closeSheet()">確定</button>`;
  if(it.curse){$("shTgt").value=b.intent==="poison"?String(b.target):"destroy";}
  paintSheet();
  $("sheet").style.display="flex";
}
function bump(d){
  const b=myBids[sheetIdx];
  b.amt=Math.max(0,b.amt+d);
  if(b.type==="cons"&&b.amt>consCapFor(S.players[0]))b.type="yaming";
  paintSheet();updateBudget();
}
function flipType(){
  const b=myBids[sheetIdx];
  if(b.type==="cons")b.type="yaming";
  else{b.type="cons";const cap=consCapFor(S.players[0]);if(b.amt>cap)b.amt=cap;}
  paintSheet();updateBudget();
}
function setTgt(){
  const v=$("shTgt").value,b=myBids[sheetIdx];
  if(v==="destroy"){b.intent="keep";}else{b.intent="poison";b.target=+v;}
}
function paintSheet(){
  const b=myBids[sheetIdx];
  $("shAmt").textContent=b.amt;
  const t=$("shType");
  t.textContent=b.type==="cons"?"保守標":"押命標";
  t.className="typebtn"+(b.type==="yaming"?" yaming":"");
  $("shCap").textContent=b.type==="cons"
    ?`保守標：落標全額退還，上限 ${consCapFor(S.players[0])}`
    :`押命標：無上限，落標仍失一半出價`;
}
function closeSheet(){
  $("sheet").style.display="none";
  const wrap=$("mc"+sheetIdx);
  if(wrap)wrap.outerHTML=mcardHTML(S.market[sheetIdx],sheetIdx);
  updateBudget();
}
function updateBudget(){
  const tot=myBids.reduce((s,b)=>s+b.amt,0);
  const el=$("budget");
  el.textContent=`本夜出價合計 ${tot} ／ 你的壽命 ${S.players[0].life}`;
  el.className=tot>S.players[0].life?"over":"";
  $("mainbtn").disabled=tot>S.players[0].life;
}
/* ================= 開標演出 ================= */
async function startReveal(){
  $("mainbtn").disabled=true;
  SKIP=false;$("skipbtn").style.display="block";
  const reveal=resolveAuction();
  const stage=$("stage");
  for(const r of reveal){
    renderSeats();
    stage.innerHTML=`<div class="stageCard">
      <div class="big">${r.it.n}<span class="fchip ${FAC[r.it.f].cls}">${FAC[r.it.f].n}</span></div>
      <div class="mut">${r.it.ab?("✦ "+ABTXT[r.it.ab]):r.it.d}</div>
      <div id="flyzone"></div><div id="outzone"></div>
    </div>`;
    await sleep(CFG.T*0.8);
    const fz=$("flyzone");
    if(!r.entries.length){
      fz.innerHTML=`<div class="bidfly"><span>無人出價</span><span>—</span></div>`;
      await sleep(CFG.T*0.7);
    }else{
      const ordered=[...r.entries].sort((a,b)=>a.amt-b.amt);
      for(const e of ordered){
        fz.insertAdjacentHTML("beforeend",
          `<div class="bidfly ${e===r.winner?"win":""}"><span>${e.p.id===0?"南":DIRS[e.p.id]}家・${e.p.name}${e.intent==="poison"?" 🕸毒標":""}</span><span>${e.amt} 壽命${e.type==="yaming"?"・押命":""}</span></div>`);
        await sleep(CFG.T*0.65);
      }
    }
    $("outzone").innerHTML=`<div class="outcome">${r.outcome}</div>`;
    if(r.winner&&r.winner.p.id!==0){
      sayFrom(r.winner.p.id, r.winner.intent==="poison"?"poison":"win");
    }else if(r.winner&&r.winner.p.id===0){
      const losers=r.entries.filter(e=>e!==r.winner&&e.p.id!==0);
      if(losers.length)sayFrom(losers[0].p.id,"lose");
    }
    if(r.winner&&r.winner.intent==="poison"&&r.winner.target!==0)sayFrom(r.winner.target,"poisoned");
    for(const ev of r.events){
      $("outzone").insertAdjacentHTML("beforeend",`<div class="outcome">${ev.txt}</div>`);
      await sleep(CFG.T*0.6);
    }
    await sleep(CFG.T*1.3);
  }
  renderSeats();
  $("mainbtn").textContent="開戰";
  $("mainbtn").disabled=false;
  $("mainbtn").onclick=startBattle;
  $("skipbtn").style.display="none";
}
/* ================= 戰鬥演出 ================= */
async function startBattle(){
  $("mainbtn").disabled=true;
  SKIP=false;$("skipbtn").style.display="block";
  const {fights,bye,nightly,deaths}=resolveBattles();
  const stage=$("stage");
  stage.innerHTML=`<h2 style="text-align:center">⚔️ 第 ${S.round} 夜・結算戰</h2><div id="fz2"></div>`;
  const fz=$("fz2");
  for(const f of fights){
    const seatA=f.A.id===0?"南":DIRS[f.A.id], seatB=f.B.id===0?"南":DIRS[f.B.id];
    renderSeats([f.A.id,f.B.id].filter(x=>x!==0));
    fz.insertAdjacentHTML("beforeend",`<div class="stageCard" style="margin-bottom:8px">
      <div class="vs"><span>${seatA}・${f.A.name}<br><span class="pwr">${f.pa}</span></span>
      <span class="mut">VS</span>
      <span>${seatB}・${f.B.name}<br><span class="pwr">${f.pb}</span></span></div>
      <div id="fr${f.A.id}_${f.B.id}"></div></div>`);
    await sleep(CFG.T);
    const frame=$(`fr${f.A.id}_${f.B.id}`);
    if(f.tie){frame.innerHTML=`<div class="mut">平手，互不失血</div>`;}
    else{
      frame.innerHTML=`<div class="dmgfloat">${f.w.name} 勝！${f.l.name} -${f.dmg} 壽命</div>`
        +f.extra.map(x=>`<div class="mut">${x}</div>`).join("");
      if(f.w.id!==0)sayFrom(f.w.id,"bwin");else if(f.l.id!==0)sayFrom(f.l.id,"blose");
    }
    await sleep(CFG.T);
  }
  if(bye!==null)fz.insertAdjacentHTML("beforeend",`<div class="mut" style="text-align:center">🌙 ${S.players[bye].name} 本夜輪空</div>`);
  if(nightly.length){
    fz.insertAdjacentHTML("beforeend",`<div class="stageCard" style="margin-top:6px">${nightly.map(x=>`<div style="font-size:13px;padding:2px 0">${x}</div>`).join("")}</div>`);
    await sleep(CFG.T);
  }
  for(const d of deaths){
    fz.insertAdjacentHTML("beforeend",`<div class="outcome">💀 ${d.name} 壽命耗盡，消失在妖市裡</div>`);
    await sleep(CFG.T*0.8);
  }
  renderSeats();
  $("skipbtn").style.display="none";
  const aliveN=S.players.filter(p=>p.alive).length;
  const me=S.players[0];
  if(!me.alive||aliveN<=1||S.round>=CFG.ROUNDS){
    $("mainbtn").textContent="看最終結果";$("mainbtn").onclick=endGame;
  }else{
    $("mainbtn").textContent="進入下一夜";$("mainbtn").onclick=nextRound;
  }
  $("mainbtn").disabled=false;
}
function nextRound(){
  S.round++;S.market=S.nextMarket;S.nextMarket=drawMarket();
  showMarket();
}
function endGame(){
  const rank=[...S.players].sort((a,b)=>(b.alive?1:0)-(a.alive?1:0)||b.life-a.life);
  const me=S.players[0],myRank=rank.indexOf(me)+1;
  renderSeats();
  $("stage").innerHTML=`<div style="text-align:center;padding:16px 4px">
    <div style="font-size:44px">${myRank===1?"🏆":"🏮"}</div>
    <h2 style="font-size:20px">${myRank===1?"你活到了天亮":"你是第 "+myRank+" 名"}</h2>
    ${rank.map((p,i)=>`<div class="endrank">${i+1}. ${p.name} — ${p.alive?`壽命 ${p.life}`:"出局"}（戰力 ${power(p)}）</div>`).join("")}
  </div>`;
  $("mainbtn").textContent="再入妖市";$("mainbtn").onclick=newGame;$("mainbtn").disabled=false;
}
/* ================= 袋子檢視 ================= */
function showBag(pid){
  const p=S.players[pid];
  let bonus="";
  for(const f of ["zuling","xianghuo","yinqi"]){
    const c=facCount(p,f);
    if(c>=CFG.SET_MIN)bonus+=`<div class="bagit"><span>共鳴：${FAC[f].n}×${c}</span><b class="heal">+${c*c}</b></div>`;
  }
  $("modalbox").innerHTML=`<h2>${pid===0?"南":DIRS[pid]}家・${p.name}（${faceLbl(p)}）</h2>
    ${p.bag.length?p.bag.map(x=>`<div class="bagit"><span>${x.n}<span class="fchip ${FAC[x.f].cls}">${FAC[x.f].n}</span>
      ${x.ab?`<span class="abtxt">✦ ${ABTXT[x.ab]}</span>`:""}</span><b>${x.p>=0?"+":""}${x.p}${x.drain?` / 每夜-${x.drain}`:""}</b></div>`).join(""):`<p class="mut">空空如也</p>`}
    ${bonus}
    <div class="bagit" style="border:none;margin-top:6px"><b>總戰力</b><b style="color:var(--gold)">${power(p)}</b></div>
    <button class="bigbtn" style="margin-top:10px" onclick="closeModal()">關閉</button>`;
  $("modal").style.display="flex";
}
function closeModal(){$("modal").style.display="none";}
/* ================= 入口 ================= */
$("footer").style.display="block";
$("budget").textContent="";
$("mainbtn").textContent="踏入妖市";
$("mainbtn").onclick=newGame;
</script>
