<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>妖市 v0.4</title>
<meta name="theme-color" content="#14101f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%8F%AE%3C/text%3E%3C/svg%3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ===== 佔位美術：正式版整批替換，邏輯層不得依賴任何樣式 =====
   ===== 橫向牌桌版：設計基準 844x390（iPhone 橫持） ===== */
:root{
  --bg:#120e1d; --table:#1d1531; --table2:#2a1f45; --panel:#1f1830; --panel2:#2a2142;
  --line:#3d3260; --ink:#e8e2f5; --dim:#9a8fc0; --gold:#e8b34b; --red:#e05555; --green:#5fbf77;
  --zuling:#5fae8f; --xianghuo:#e0a13f; --yinqi:#9b6fd4; --curse:#d45577;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
  font-size:14px;position:fixed;inset:0;width:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,select,.mcard,.seat,.stepper{touch-action:manipulation}
#felt,#sheetbox,#modalbox{touch-action:pan-y}
#rotateHint{display:none;position:fixed;inset:0;z-index:99;background:var(--bg);
  flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#rotateHint .ic{font-size:52px;animation:rot 2s infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait){ #rotateHint{display:flex} }
.title{text-align:center;padding:22px 20px;height:100%;display:flex;flex-direction:column;justify-content:center}
.title h1{font-size:38px;color:var(--gold);letter-spacing:12px;margin-bottom:6px}
.title p{color:var(--dim);font-size:13px;line-height:1.7}
.title .btns{display:flex;gap:12px;justify-content:center;margin-top:14px}
#table{display:none;height:100%;height:100dvh;max-width:960px;margin:0 auto;
  grid-template-areas:"north north north" "west felt east" "south south south";
  grid-template-rows:56px 1fr 62px;grid-template-columns:120px 1fr 120px;gap:4px;padding:4px}
#table.on{display:grid}
#north{grid-area:north;display:flex;justify-content:center}
#west{grid-area:west} #east{grid-area:east}
#west,#east{display:flex;align-items:center}
.seat{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:5px 8px;cursor:pointer;transition:box-shadow .3s;width:100%}
.seat.hl{box-shadow:0 0 12px var(--gold);border-color:var(--gold)}
.seat.dead{opacity:.35}
#north .seat{display:flex;align-items:center;gap:8px;max-width:320px}
#west .seat,#east .seat{text-align:center}
.seat .av{font-size:26px;line-height:1.1}
.seat .nm{font-size:12px;white-space:nowrap}
.seat .st{font-size:10px;color:var(--dim);line-height:1.4}
.seat .dir{position:absolute;top:-7px;left:8px;background:var(--table2);border:1px solid var(--line);
  border-radius:6px;font-size:10px;padding:0 5px;color:var(--gold)}
.windb{position:absolute;top:-7px;right:8px;background:var(--gold);color:#14101f;border-radius:6px;
  font-size:10px;padding:0 5px;font-weight:bold}
.bubble{position:absolute;z-index:9;background:#efe8d8;color:#2a2142;border-radius:10px;padding:4px 9px;
  font-size:12px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.5);left:50%;transform:translateX(-50%);top:calc(100% + 4px)}
#west .bubble{left:calc(100% + 6px);top:50%;transform:translateY(-50%)}
#east .bubble{left:auto;right:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.bubble.show{opacity:1}
#felt{grid-area:felt;background:radial-gradient(ellipse at 50% 35%,var(--table2),var(--table));
  border:2px solid var(--line);border-radius:18px;padding:8px 10px;position:relative;overflow-y:auto}
#feltHead{text-align:center;font-size:12px;color:var(--gold);margin-bottom:5px}
#stage{min-height:40px}
.preview{background:rgba(0,0,0,.25);border:1px dashed var(--gold);border-radius:10px;padding:4px 10px;
  font-size:11px;color:var(--gold);margin-bottom:6px;text-align:center}
#market{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px;cursor:pointer;
  position:relative;transition:transform .15s}
.mcard:active{transform:scale(.97)}
.mcard.curse{border-color:var(--curse)}
.mcard.bided{border-color:var(--gold)}
.mcard .nm{font-weight:bold;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .pw{font-size:11px;color:var(--gold)}
.mcard .ab{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.3}
.mybid{position:absolute;top:-8px;right:-4px;background:var(--gold);color:#14101f;border-radius:8px;
  font-size:11px;font-weight:bold;padding:1px 7px;z-index:2}
.mybid.poison{background:var(--curse);color:#fff}
.fchip{display:inline-block;font-size:9px;border-radius:5px;padding:0 4px;margin-left:3px;color:#14101f;font-weight:bold}
.f-zuling{background:var(--zuling)} .f-xianghuo{background:var(--xianghuo)}
.f-yinqi{background:var(--yinqi)} .f-curse{background:var(--curse);color:#fff}
.stageCard{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:8px 12px;
  text-align:center;animation:pop .3s;max-width:420px;margin:0 auto}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.stageCard .big{font-size:15px;font-weight:bold}
.bidfly{display:flex;justify-content:space-between;padding:3px 10px;margin-top:5px;background:var(--panel2);
  border-radius:8px;font-size:12px;animation:slidein .3s}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.bidfly.win{background:var(--gold);color:#14101f;font-weight:bold}
.outcome{margin-top:6px;color:var(--gold);font-size:12px;animation:pop .3s}
#south{grid-area:south;display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:5px 12px;position:relative}
#south .dir{color:var(--gold);font-size:11px}
#south .av{font-size:28px}
#south .life{font-size:21px;font-weight:bold;color:var(--green);line-height:1}
#south .life.low{color:var(--red)}
#south .mut{line-height:1.35}
#budget{font-size:11px;color:var(--dim);margin-left:auto;text-align:right}
#budget.over{color:var(--red);font-weight:bold}
#south button.side{height:38px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);padding:0 12px;font-size:12px}
.bigbtn{height:44px;border-radius:10px;border:none;background:var(--gold);color:#14101f;
  font-size:15px;font-weight:bold;padding:0 22px}
.bigbtn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.bigbtn:disabled{opacity:.4}
#skipbtn{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);
  color:var(--dim);border-radius:8px;padding:2px 10px;font-size:11px;display:none;z-index:5}
/* 對決場景 */
#duel{display:none;position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 45%,#31204f,#0d0a16);
  flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#duelArena{display:flex;align-items:center;justify-content:center;gap:34px;width:100%}
.fighter{text-align:center;transition:transform .35s}
.fighter .fav{font-size:74px;line-height:1.15;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.fighter .fnm{font-size:14px;margin-top:2px}
.fighter .fpw{font-size:30px;font-weight:bold;color:var(--gold)}
.fighter .fdir{font-size:11px;color:var(--gold)}
.vsbig{font-size:26px;font-weight:bold;color:var(--dim);letter-spacing:2px}
.charge-l{transform:translateX(46px) scale(1.06)}
.charge-r{transform:translateX(-46px) scale(1.06)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-4deg)}
  50%{transform:translateX(7px) rotate(3deg)}80%{transform:translateX(-4px)}}
#duel .flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#duel .flashfx.on{animation:flashA .35s}
@keyframes flashA{0%{opacity:.85}100%{opacity:0}}
#duelResult{margin-top:14px;font-size:16px;min-height:26px;text-align:center}
#duelResult .dmg{font-size:20px;font-weight:bold}
#duelSub{color:var(--dim);font-size:12px;margin-top:4px;min-height:18px;text-align:center}
/* 熱座交棒 */
#handoff{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);
  flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#handoff .hav{font-size:64px}
#handoff .hnm{font-size:20px;color:var(--gold);font-weight:bold}
/* 抽屜 / modal */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:none;align-items:center;justify-content:center}
#sheetbox{background:var(--panel);border-radius:16px;width:94%;max-width:460px;padding:14px 14px 16px;max-height:92vh;overflow-y:auto}
#sheetbox h3{font-size:15px;margin-bottom:2px}
#sheetbox .desc{font-size:12px;color:var(--dim);margin-bottom:10px;line-height:1.4}
.bidrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.stepper{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:50px;height:46px;background:var(--panel2);color:var(--ink);border:none;font-size:22px}
.stepper .amt{width:54px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:bold;color:var(--gold)}
.typebtn,.tgtsel{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);padding:0 12px;font-size:13px}
.typebtn.yaming{border-color:var(--red);color:var(--red)}
.capnote{font-size:11px;color:var(--dim);width:100%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:none;align-items:center;justify-content:center}
#modalbox{background:var(--panel);border-radius:16px;width:94%;max-width:460px;max-height:88vh;overflow-y:auto;padding:14px}
.bagit{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.bagit .abtxt{font-size:11px;color:var(--dim);display:block}
.mut{color:var(--dim);font-size:12px}
h2{font-size:16px;color:var(--gold);margin:2px 0 8px}
.endrank{font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.heal{color:var(--green)} .dmg{color:var(--red)}
</style>
</head>
<body>
<div id="rotateHint"><div class="ic">📱</div><div>請把手機<b style="color:var(--gold)">轉橫</b>進入妖市<br><span class="mut">深夜牌桌需要寬一點的視野</span></div></div>
<div id="titleScr" class="title">
  <h1>妖　市</h1>
  <p>深夜的妖怪牌桌，壽命就是你的籌碼。<br>
  競標祖靈、香火、陰氣三系法寶，把詛咒塞給別人，活到天亮。<br>
  每夜風位輪轉（東→南→西→北），風位玩家當夜戰力＋3、平標優先。</p>
  <div class="btns">
    <button class="bigbtn" onclick="newGame('solo')">單人入市</button>
    <button class="bigbtn alt" onclick="newGame('hotseat')">雙人熱座</button>
  </div>
  <p style="margin-top:10px;color:var(--gold);font-size:11px">v0.4 原型・佔位美術・橫向牌桌</p>
</div>
<div id="table">
  <div id="north"></div>
  <div id="west"></div>
  <div id="felt">
    <button id="skipbtn" onclick="doSkip()">跳過 ≫</button>
    <div id="feltHead"></div>
    <div id="stage"></div>
  </div>
  <div id="east"></div>
  <div id="south">
    <span class="av" id="myAv">🧑</span>
    <div><div class="dir" id="myDir">南・你</div><div class="life" id="myLife"></div></div>
    <div class="mut" id="myPow"></div>
    <button class="side" onclick="showBag(0)">袋子</button>
    <div id="budget"></div>
    <button class="bigbtn" id="mainbtn"></button>
  </div>
</div>
<div id="duel"><div class="flashfx" id="flashfx"></div>
  <div id="duelArena"></div>
  <div id="duelResult"></div><div id="duelSub"></div>
</div>
<div id="handoff">
  <div class="hav" id="hoAv"></div>
  <div class="hnm" id="hoNm"></div>
  <div class="mut" id="hoTxt"></div>
  <button class="bigbtn" id="hoBtn">開始出價</button>
</div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetbox"></div></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div id="modalbox"></div></div>

<script>
"use strict";
/* ================= 常數（【試玩必調】集中此處） ================= */
const CFG = {
  LIFE: 40, ROUNDS: 12, MARKET: 4,
  CURSE_PROB: 0.65,
  SET_MIN: 2,
  DMG_BASE: 3, DMG_DIV: 5, DMG_MAX: 6,
  CONS_CAP_DIV: 3,
  WIND_POWER: 3,     /* 風位當夜戰力加成【試玩必調】 */
  AI_DESTROY_P: 0.5, /* 最強 AI 對詛咒品下防禦性銷毀標的機率【試玩必調】 */
  T: 650,            /* 演出基本節拍 ms【試玩必調】 */
};
const FAC = {
  zuling:{n:"祖靈",cls:"f-zuling",resonate:true}, xianghuo:{n:"香火",cls:"f-xianghuo",resonate:true},
  yinqi:{n:"陰氣",cls:"f-yinqi",resonate:true}, curse:{n:"詛咒",cls:"f-curse"},
};
/* 會參與共鳴計算的陣營（由 FAC 的 resonate 旗標決定，引擎不寫死名字） */
const FACTIONS = Object.keys(FAC).filter(k=>FAC[k].resonate);

/* ================= 五張資料表（加內容＝往這裡填一筆，不要改引擎） =================
   統一形狀：
     { id, name, desc, hooks:{ ... }, flags:[...], traits:{...} }
   - id     唯一鍵，程式用
   - name   顯示名
   - desc   玩家看到的效果說明
   - hooks  只寫用得到的，其餘省略；hook 契約見 docs/ARCH_SPEC.md §3
   - flags  靜態布林特性，引擎用 hasFlag(p,'xxx') 查（給沒有 hook 掛點的能力用）
   - traits 靜態數值特性，引擎用 traitMax(p,'xxx',預設) 查
   - order  （可選，數字）同一次 applyHooks 內多個 effect 的生效優先序，數字小的先跑；省略＝預設 100
   hook 內只准碰 ctx 與自己這一筆的資料；不要在引擎函式裡寫 if(id==='xxx')。
================================================================================= */

/* --- 1/5 ABILITIES：法寶／命格道具的能力（原 ABTXT 的文案併入 desc） --- */
const ABILITIES = {
  bow:{id:"bow",name:"射日神弓",desc:"戰勝時，對手額外 -2 壽命",order:10,
    hooks:{ onBattle(ctx){ if(has(ctx.w,"bow")) ctx.dmg+=2; } }},
  shield:{id:"shield",name:"百步蛇紋盾",desc:"戰敗時，少失 2 壽命",order:20,
    hooks:{ onBattle(ctx){ if(has(ctx.l,"shield")) ctx.dmg=Math.max(1,ctx.dmg-2); } }},
  eye:{id:"eye",name:"祖靈之眼",desc:"整夜未得標任何拍品時，夜末回 2 壽命",
    hooks:{ onNightEnd(ctx){
      if(!S.wonAny.has(ctx.p.id)){ ctx.p.life+=2; ctx.log.push(`👁 ${ctx.p.name} 靜觀整夜，祖靈之眼回 +2`); }
    } }},
  thunder:{id:"thunder",name:"雷女之火",desc:"共鳴計算時，祖靈視為多 1 件",
    hooks:{ onFacCount(ctx){ if(ctx.faction==="zuling") ctx.count++; } }},
  boat:{id:"boat",name:"拼板舟",desc:"每夜末回 1 壽命",
    hooks:{ onNightEnd(ctx){ ctx.p.life+=1; ctx.log.push(`⛵ ${ctx.p.name} 的拼板舟渡來生息 +1`); } }},
  flag:{id:"flag",name:"媽祖令旗",desc:"你的保守標上限提高 50%",
    hooks:{ onBidCap(ctx){ ctx.cap=Math.floor(ctx.cap*1.5); } }},
  sword:{id:"sword",name:"王爺劍",desc:"你袋中詛咒品的負值減半",
    hooks:{ onItemValue(ctx){
      if(ctx.item.curse && ctx.value<0) ctx.value=-Math.ceil(Math.abs(ctx.value)/2);
    } }},
  wangchuan:{id:"wangchuan",name:"送王船",desc:"得標時，把你袋中一件詛咒品送給戰力最高的對手",
    hooks:{ onWinItem(ctx){
      /* 現行行為＝只有「親自標下送王船並入袋」那一次才啟航（毒標塞人不算） */
      if(ctx.item.ab!=="wangchuan" || ctx.target) return;
      const curses=ctx.winner.bag.filter(x=>x.curse);
      if(!curses.length) return;
      const worst=curses.sort((a,b)=>a.p-b.p)[0];
      const foes=S.players.filter(q=>q.alive&&q.id!==ctx.winner.id);
      if(!foes.length) return;
      const tgt=foes.sort((a,b)=>power(b)-power(a))[0];
      ctx.winner.bag.splice(ctx.winner.bag.indexOf(worst),1);
      tgt.bag.push(worst);
      ctx.events.push({txt:`送王船啟航——「${worst.n}」被送進 ${tgt.name} 的袋子`});
    } }},
  bell:{id:"bell",name:"千里眼銅鈴",desc:"明夜預告顯示兩件拍品", traits:{preview:2}},
  wuying:{id:"wuying",name:"五營旗",desc:"共鳴計算時，香火視為多 1 件",
    hooks:{ onFacCount(ctx){ if(ctx.faction==="xianghuo") ctx.count++; } }},
  tiger:{id:"tiger",name:"虎爺印",desc:"被毒標塞中時，下手的人失 2 壽命",
    hooks:{ onWinItem(ctx){
      if(!ctx.target || !has(ctx.target,"tiger")) return;
      ctx.winner.life-=2;
      ctx.events.push({txt:`${ctx.target.name} 的虎爺印反咬，${ctx.winner.name} -2 壽命`});
    } }},
  redhat:{id:"redhat",name:"魔神仔紅帽",desc:"你的毒標比價時視為 +2",
    hooks:{ onBidEff(ctx){ if(ctx.bid.intent==="poison") ctx.eff+=2; } }},
  hairpin:{id:"hairpin",name:"林投姐髮簪",desc:"戰敗時，勝者也失 1 壽命",order:30,
    hooks:{ onBattle(ctx){
      if(!has(ctx.l,"hairpin")) return;
      ctx.w.life-=1; ctx.extra.push(`${ctx.l.name} 的髮簪回敬 ${ctx.w.name} -1`);
    } }},
  chair:{id:"chair",name:"椅仔姑竹椅",desc:"看穿所有對手的實際壽命", flags:["xrayLife"]},
  raincoat:{id:"raincoat",name:"黃色小雨衣",desc:"押命標落標時不再失血",
    hooks:{ onBidSettle(ctx){
      if(ctx.isWinner || ctx.bid.type!=="yaming") return;
      ctx.cost=0;
      ctx.events.push({txt:`${ctx.p.name} 的黃色小雨衣擋下了落標失血`});
    } }},
  nail:{id:"nail",name:"虎姑婆指甲",desc:"戰勝時回 1 壽命",order:40,
    hooks:{ onBattle(ctx){
      if(!has(ctx.w,"nail")) return;
      ctx.w.life+=1; ctx.extra.push(`${ctx.w.name} 吸食勝利 +1`);
    } }},
  buoy:{id:"buoy",name:"水鬼浮標",desc:"共鳴計算時，陰氣視為多 1 件",
    hooks:{ onFacCount(ctx){ if(ctx.faction==="yinqi") ctx.count++; } }},
};
const abDesc = ab => (ABILITIES[ab] && ABILITIES[ab].desc) || "";

/* --- 2/5 ROLES：角色（被動、AI 行為參數、台詞、頭像、起始壽命） ---

/* ================= Hook 分派器 =================
   effect 來源與呼叫順序（固定，改了結果就不可重現）：
     1. p 的角色 → 2. p.bag 內有 ab 的道具（依袋中順序）→ 3. S.nightRule → 4. S.event
   同一個 effect 物件只收一次（袋裡兩把同名法寶＝一次效果，與舊行為一致）。
   HOOK_ORDER 可為個別 hook 指定不同的收集順序（ARCH_SPEC §3.10 要求 onNightEnd 道具先於角色）。
   ctx 是可變累加器：effect 直接改 ctx 的欄位，不回傳值。 */
const HOOK_ORDER = { onNightEnd:"itemsFirst" };
function collectEffects(p,order){
  const out=[], seen=new Set();
  const add=e=>{ if(e && !seen.has(e)){ seen.add(e); out.push(e); } };
  const role=()=>{ if(p && p.roleId) add(ROLES[p.roleId]); };
  const items=()=>{ if(p) for(const it of p.bag) if(it.ab) add(ABILITIES[it.ab]); };
  if(order==="itemsFirst"){ items(); role(); } else { role(); items(); }
  if(S && S.nightRule) add(S.nightRule);
  if(S && S.event) add(S.event);
  return out;
}
/* p 可為：玩家 / 玩家陣列（雙方 effect 合併去重後依序跑）/ null（只取全域 effect） */
function applyHooks(name,ctx,p){
  const order=HOOK_ORDER[name];
  let list;
  if(Array.isArray(p)){
    list=[]; const seen=new Set();
    for(const q of p){
      if(!q) continue;
      for(const e of collectEffects(q,order)) if(!seen.has(e)){ seen.add(e); list.push(e); }
    }
  }else{
    list=collectEffects(p||null,order);
  }
  /* 依 order 數字小到大重排（未設 order 的 effect 預設 100）；同數字者維持收集順序不變——
     Array.prototype.sort 在現代引擎已保證穩定，不需額外索引 tie-break */
  list=list.slice().sort((a,b)=>(a.order??100)-(b.order??100));
  for(const e of list){ const h=e.hooks && e.hooks[name]; if(h) h(ctx); }
  return ctx;
}
/* 沒有 hook 掛點的靜態特性：flags（布林）與 traits（取最大值），引擎只問名字不認得內容 id */
function hasFlag(p,flag){ return collectEffects(p).some(e=>e.flags && e.flags.indexOf(flag)>=0); }
function traitMax(p,key,base){
  let v=base;
  for(const e of collectEffects(p)) if(e.traits && e.traits[key]>v) v=e.traits[key];
  return v;
}

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

function drawMarket(){
  const m=[]; const hasCurse=S.rng()<CFG.CURSE_PROB && S.cdeck.length;
  for(let i=0;i<CFG.MARKET-(hasCurse?1:0);i++){
    if(!S.deck.length) S.deck=shuffle([...POOL].map(x=>({...x})));
    m.push(S.deck.pop());
  }
  if(hasCurse) m.push(S.cdeck.pop());
  const ctx={market:shuffle(m),round:S.round};
  applyHooks("onMarketDraw",ctx,null); /* 全域 hook：只取 nightRule 與 event */
  return ctx.market;
}
function facCount(p,f){
  const ctx={p,faction:f,count:p.bag.filter(x=>!x.curse&&x.f===f).length};
  applyHooks("onFacCount",ctx,p);
  return ctx.count;
}
/* 逐件跑 onItemValue 加總 → 逐陣營跑 onFacCount 算共鳴 → 跑 onPowerCalc → 回傳。
   內部保留小數，四捨五入只在顯示層做（showPow）。 */
function power(p){
  let itemSum=0;
  for(const x of p.bag){
    const c={p,item:x,value:x.p};
    applyHooks("onItemValue",c,p);
    itemSum+=c.value;
  }
  let resonance=0;
  for(const f of FACTIONS){
    const c=facCount(p,f);
    if(c>=CFG.SET_MIN) resonance+=c*c;
  }
  const ctx={p,itemSum,resonance,flat:0,resonanceMul:1};
  applyHooks("onPowerCalc",ctx,p);
  return ctx.itemSum + ctx.resonance*ctx.resonanceMul + ctx.flat;
}
const showPow = p => Math.round(power(p));

function budgetFor(p){

  return ctx.budget;
}
function consCapFor(p){
  const ctx={p,cap:Math.max(1,Math.floor(p.life/CFG.CONS_CAP_DIV))};
  applyHooks("onBidCap",ctx,p);
  return ctx.cap;
}
function aiBids(p){
  const bids=S.market.map(()=>null);
  const budget=Math.floor(budgetFor(p)*0.45);
  let spent=0;
  /* 詛咒品攻防獨立出價，不跟法寶搶「前二」名額 */
  S.market.forEach((it,i)=>{
    if(!it.curse)return;
    const strongest=[...S.players].filter(q=>q.alive).sort((a,b)=>power(b)-power(a))[0];
    let intent=null,target=null;
    if(strongest.id===p.id && S.rng()<CFG.AI_DESTROY_P){
      intent="keep"; /* 買下銷毀自保 */
    }else if(S.rng()<p.ai.spite){
      const foes=S.players.filter(q=>q.alive&&q.id!==p.id);
      intent="poison"; target=foes.sort((a,b)=>power(b)-power(a))[0].id;
    }
    if(!intent)return;
    const amt=Math.min(3+rnd(0,2), budget-spent, p.life-spent-1);
    if(amt<=0)return;
    const type=amt>consCapFor(p)?"yaming":"cons";
    bids[i]={amt,type,intent,target};
    spent+=amt;
  });
  const opts=[];
  S.market.forEach((it,i)=>{
    if(it.curse)return;
    const c=p.bag.filter(x=>x.f===it.f).length;
    const marginal=(c+1>=CFG.SET_MIN)?(c+1)*(c+1)-(c>=CFG.SET_MIN?c*c:0):0;
    const val=it.p+marginal+(it.ab?2:0)+rnd(-2,2);
    opts.push({i,val,intent:"keep",target:null});
  });
  opts.sort((a,b)=>b.val-a.val);
  for(const o of opts.slice(0,2)){
    let amt=Math.max(0,Math.round(o.val*p.ai.aggr)+rnd(-1,1));
    amt=Math.min(amt,budget-spent,p.life-spent);
    if(amt<=0)continue;
    const cap=consCapFor(p);
    const type=(amt>cap||(o.val>8&&S.rng()<p.ai.aggr))?"yaming":"cons";
    bids[o.i]={amt,type,intent:o.intent,target:o.target};
    spent+=amt;
  }
  return bids;
}
function resolveAuction(){
  const all=S.players.map(p=>{
    if(!p.alive)return S.market.map(()=>null);
    if(!p.ai){
      const hb=S.humanBids[p.id]||[];
      return S.market.map((_,i)=>(hb[i]&&hb[i].amt>0)?{...hb[i]}:null);
    }
    return aiBids(p);
  });
  const reveal=[];
  S.wonAny=new Set();
  S.bidAny=new Set(); /* 本輪（一夜）有實際出過價（amt>0）的玩家 id，供「整夜零出價」類被動查詢 */
  S.market.forEach((it,i)=>{
    const entries=[];
    S.players.forEach(p=>{const b=all[p.id][i];if(b){entries.push({p,...b});S.bidAny.add(p.id);}});
    let winner=null;
    if(entries.length){
      const effs=entries.map(e=>{
        const c={p:e.p,bid:e,item:it,eff:e.amt};
        applyHooks("onBidEff",c,e.p);
        return c.eff;
      });
      const top=Math.max(...effs);
      const tops=entries.filter((e,k)=>effs[k]===top);
      /* 平標決勝：風位優先 → 仍平則 S.rng() 決 */
      winner = tops.find(e=>e.p.id===windPid(S.round)) || tops[Math.floor(S.rng()*tops.length)];
    }
    const events=[];
    entries.forEach(e=>{
      const isWinner=(e===winner);
      const c={p:e.p,bid:e,item:it,isWinner,
        cost:isWinner?e.amt:(e.type==="yaming"?Math.ceil(e.amt/2):0), events};
      applyHooks("onBidSettle",c,e.p);
      e.p.life-=c.cost;
    });
    let outcome="流標";
    if(winner){
      S.wonAny.add(winner.p.id);
      let target=null;
      if(winner.intent==="poison"){
        target=S.players[winner.target];
        target.bag.push(it);
        outcome=`${winner.p.name} 毒標得手 → 塞進 ${target.name} 的袋子`;
      }else if(it.curse){
        outcome=`${winner.p.name} 買下銷毀（自保）`;
      }else{
        winner.p.bag.push(it);
        outcome=`${winner.p.name} 入袋`;
      }
      /* 得標後的連鎖：得標者與被塞方的 effect 都要參與（去重後依序） */
      applyHooks("onWinItem",{winner:winner.p,item:it,target,events},[winner.p,target]);
    }
    reveal.push({it,entries,winner,outcome,events});
  });
  S.players.forEach(p=>{if(p.alive&&p.life<=0){p.alive=false;p.life=0;}});
  return reveal;
}
function pairings(ids,round){
  const list=[...ids]; if(list.length%2)list.push(null);
  const m=list.length; if(m<2)return{pairs:[],bye:ids[0]??null};
  const others=list.slice(1),r=round%(m-1);
  const rot=[list[0],...others.map((_,k)=>others[(k+r)%others.length])];
  const pairs=[];let bye=null;
  for(let k=0;k<m/2;k++){
    const a=rot[k],b=rot[m-1-k];
    if(a===null)bye=b;else if(b===null)bye=a;else pairs.push([a,b]);
  }
  return{pairs,bye};
}
function battlePower(p){ return power(p)+(p.id===windPid(S.round)?CFG.WIND_POWER:0); }
function resolveBattles(){
  const alive=S.players.filter(p=>p.alive).map(p=>p.id);
  const {pairs,bye}=pairings(alive,S.round-1);
  const fights=[];
  pairs.forEach(([a,b])=>{
    const A=S.players[a],B=S.players[b];
    const pa=battlePower(A),pb=battlePower(B);
    if(pa===pb){fights.push({A,B,pa,pb,tie:true});return;}
    const paRaw=power(A), pbRaw=power(B);
    const [w,l,pw,pl,pwRaw,plRaw]=pa>pb?[A,B,pa,pb,paRaw,pbRaw]:[B,A,pb,pa,pbRaw,paRaw];
    const extra=[];
    const ctx={w,l,pw,pl,pwRaw,plRaw,extra,
      dmg:CFG.DMG_BASE+Math.min(CFG.DMG_MAX,Math.floor((pw-pl)/CFG.DMG_DIV))};
    applyHooks("onBattle",ctx,[w,l]);
    const dmg=ctx.dmg;
    l.life-=dmg;
    fights.push({A,B,pa,pb,w,l,dmg,extra});
  });
  const nightly=[];
  S.players.forEach(p=>{
    if(!p.alive)return;
    /* 夜末結算順序（ARCH_SPEC §3.10）：詛咒 drain → 道具 → 角色 → 心願 → 異事後效 */
    const drain=p.bag.reduce((s,x)=>s+(x.drain||0),0);
    if(drain){p.life-=drain;nightly.push(`🩸 ${p.name} 受詛咒侵蝕 -${drain}`);}
    applyHooks("onNightEnd",{p,log:nightly},p);
  });
  const deaths=[];
  S.players.forEach(p=>{if(p.alive&&p.life<=0){p.alive=false;p.life=0;deaths.push(p);}});
  return{fights,bye,nightly,deaths};
}

    <button class="bigbtn" style="margin-top:10px;width:100%" onclick="closeModal()">關閉</button>`;
  $("modal").style.display="flex";
}
function closeModal(){$("modal").style.display="none";}
/* ================= 測試出口：headless 模擬（不碰 DOM） ================= */
/* 固定腳本策略：每夜對 market 中 p 值最高的一件出保守標，金額 = min(保守標上限, 5)，
   不下毒標、不買銷毀。用途是把對局變成完全決定性，供重構前後逐項比對。 */
function scriptedBids(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  let bi=0;
  for(let i=1;i<S.market.length;i++) if(S.market[i].p>S.market[bi].p) bi=i;
  bids[bi]={amt:Math.min(consCapFor(p),5),type:"cons",intent:"keep",target:null};
  return bids;
}
/* ================= 平衡模擬器：可插拔策略（給 runMany 用，不影響 simulate/scriptedBids 既有行為） =================
   每個策略都是 (p)=>bids 的純函式，bids 形狀與 scriptedBids 相同：長度＝S.market.length 的陣列，
   每格 null 或 {amt,type,intent,target}。三者只讀 S.market／consCapFor 等既有唯讀狀態，不寫入任何全域。 */
function policyGreedy(p){ return scriptedBids(p); } /* 標 p 值最高者，複用既有腳本策略 */
function policyHoarder(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const candidates=[];
  S.market.forEach((it,i)=>{ if(!it.curse && it.p>=6) candidates.push(i); });
  if(!candidates.length) return bids; /* 沒有大貨，零出價 */
  let bi=candidates[0];
  for(const i of candidates) if(S.market[i].p>S.market[bi].p) bi=i;
  const cap=consCapFor(p);
  const want=S.market[bi].p+3;
  if(want<=cap){ bids[bi]={amt:want,type:"cons",intent:"keep",target:null}; }
  else{ const amt=Math.min(want,Math.max(1,p.life-1)); bids[bi]={amt,type:"yaming",intent:"keep",target:null}; }
  return bids;
}
function policySplitter(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const cap=consCapFor(p);
  const amt=Math.max(1,Math.min(2,cap));
  const order=S.market.map((_,i)=>i).sort((a,b)=>S.market[b].p-S.market[a].p);
  order.slice(0,Math.min(3,order.length)).forEach(i=>{ bids[i]={amt,type:"cons",intent:"keep",target:null}; });
  return bids;
}
const POLICIES={ greedy:policyGreedy, hoarder:policyHoarder, splitter:policySplitter };
/* 無頭跑一整局，供 runMany 統計聚合用。不重用/不修改 simulate()，避免任何動到既有等價基準的風險——
   完全靠 makeState/resolveAuction/resolveBattles/power 這些既有唯讀引擎函式組成，邏輯零重寫。 */
function playPolicyGame(seed,policies){
  makeState("solo",seed);
  const deathRound={}; S.players.forEach(p=>deathRound[p.id]=null);
  const factionWinCounts={}, factionOffered={};
  Object.keys(FAC).forEach(f=>{ factionWinCounts[f]=0; factionOffered[f]=0; });
  let poisonBids=0, totalBids=0, unsoldItems=0, drawnItems=0;
  const lifeByRound=[];
  for(;;){
    S.humanBids={};
    S.players.forEach(p=>{
      if(!p.ai){ const pol=(policies&&policies[p.id])||scriptedBids; S.humanBids[p.id]=pol(p); }
    });
    S.market.forEach(it=>{ factionOffered[it.f]=(factionOffered[it.f]||0)+1; drawnItems++; });
    const reveal=resolveAuction();
    reveal.forEach(r=>{
      totalBids+=r.entries.length;
      if(r.winner){
        factionWinCounts[r.it.f]=(factionWinCounts[r.it.f]||0)+1;
        if(r.winner.intent==="poison") poisonBids++;
      }else{ unsoldItems++; }
    });
    resolveBattles();
    S.players.forEach(p=>{ if(!p.alive && deathRound[p.id]===null) deathRound[p.id]=S.round; });
    lifeByRound.push(S.players.map(p=>p.life));
    const aliveN=S.players.filter(p=>p.alive).length;
    const humanN=S.players.filter(p=>!p.ai&&p.alive).length;
    if(!humanN||aliveN<=1||S.round>=CFG.ROUNDS) break;
    S.round++; S.market=S.nextMarket; S.nextMarket=drawMarket();
  }
  const gameLength=S.round;
  S.players.forEach(p=>{ if(deathRound[p.id]===null) deathRound[p.id]=gameLength; });
  const rank=[...S.players].sort((a,b)=>(b.alive?1:0)-(a.alive?1:0)||b.life-a.life);
  return {
    seed, gameLength, winnerId:rank[0].id,
    finalLife:S.players.map(p=>p.life), finalPower:S.players.map(p=>power(p)),
    survival:S.players.map(p=>deathRound[p.id]),
    lifeByRound, factionWinCounts, factionOffered,
    poisonBids, totalBids, unsoldItems, drawnItems,
  };
}
/* runMany({seeds:[...] 或 n:N, policies:{playerId:policyFn}}) → 統計聚合，見 docs 交付需求。
   policies 只覆寫非 AI 座位（solo 模式僅 id0 是人類），AI 座位一律照舊走 aiBids。 */
function runMany(opts){
  opts=opts||{};
  const seeds=opts.seeds?[...opts.seeds]:Array.from({length:opts.n||200},(_,i)=>i+1);
  const policies=opts.policies||{};
  const results=seeds.map(sd=>playPolicyGame(sd,policies));
  const n=results.length;
  const nPlayers=n?results[0].finalLife.length:0;
  const winRate=new Array(nPlayers).fill(0);
  const survivalSum=new Array(nPlayers).fill(0);
  const lifeSum=new Array(nPlayers).fill(0);
  const powerSum=new Array(nPlayers).fill(0);
  const factionWinCounts={}, factionOffered={};
  let poisonTotal=0,bidsTotal=0,unsoldTotal=0,drawnTotal=0,lengthSum=0;
  const lifeCurveSum=Array.from({length:CFG.ROUNDS},()=>new Array(nPlayers).fill(0));
  const lifeCurveCount=new Array(CFG.ROUNDS).fill(0);
  results.forEach(g=>{
    winRate[g.winnerId]++;
    g.survival.forEach((s,i)=>survivalSum[i]+=s);
    g.finalLife.forEach((l,i)=>lifeSum[i]+=l);
    g.finalPower.forEach((pw,i)=>powerSum[i]+=pw);
    Object.keys(g.factionWinCounts).forEach(f=>{ factionWinCounts[f]=(factionWinCounts[f]||0)+g.factionWinCounts[f]; });
    Object.keys(g.factionOffered).forEach(f=>{ factionOffered[f]=(factionOffered[f]||0)+g.factionOffered[f]; });
    poisonTotal+=g.poisonBids; bidsTotal+=g.totalBids; unsoldTotal+=g.unsoldItems; drawnTotal+=g.drawnItems;
    lengthSum+=g.gameLength;
    g.lifeByRound.forEach((lifeArr,ri)=>{ lifeCurveSum[ri]=lifeCurveSum[ri].map((v,pi)=>v+lifeArr[pi]); lifeCurveCount[ri]++; });
  });
  return {
    games:n,
    winRate:winRate.map(w=>n?w/n:0),
    avgSurvivalNights:survivalSum.map(s=>n?s/n:0),
    avgFinalLife:lifeSum.map(s=>n?s/n:0),
    avgFinalPower:powerSum.map(s=>n?s/n:0),
    lifeCurve:lifeCurveSum.map((arr,ri)=>lifeCurveCount[ri]?arr.map(v=>v/lifeCurveCount[ri]):null),
    factionWinCounts, unsoldRate:drawnTotal?unsoldTotal/drawnTotal:0,
    poisonUsageRate:bidsTotal?poisonTotal/bidsTotal:0,
    avgGameLength:n?lengthSum/n:0,
  };
}
/* 把 runMany 的統計輸出成可直接貼進 markdown 的表格 */
function statsToMarkdown(stats,title){
  const seatNames=["南家(id0)","北家(id1)","西家(id2)","東家(id3)"];
  let md=title?`#### ${title}\n\n`:"";
  md+=`局數：${stats.games}　平均對局長度：${stats.avgGameLength.toFixed(2)} 夜　流標率：${(stats.unsoldRate*100).toFixed(1)}%　毒標使用率：${(stats.poisonUsageRate*100).toFixed(1)}%\n\n`;
  md+="| 玩家 | 勝率 | 平均存活夜數 | 平均最終壽命 | 平均最終戰力 |\n|---|---|---|---|---|\n";
  stats.winRate.forEach((w,i)=>{
    md+=`| ${seatNames[i]||("玩家"+i)} | ${(w*100).toFixed(1)}% | ${stats.avgSurvivalNights[i].toFixed(2)} | ${stats.avgFinalLife[i].toFixed(2)} | ${stats.avgFinalPower[i].toFixed(2)} |\n`;
  });
  md+="\n| 陣營 | 得標次數 |\n|---|---|\n";
  Object.keys(stats.factionWinCounts).forEach(f=>{ md+=`| ${f} | ${stats.factionWinCounts[f]} |\n`; });
  return md;
}
/* ================= 優勢策略窮舉器（強制閘門，見 docs/GAME_DESIGN.md 六之四） =================
   analyzeEvent({name,players,options,payoff}) → 窮舉所有玩家選擇組合，回報是否存在優勢策略／免費午餐。
   判定定義照設計文件字面實作，不自行更動：
   - 弱優勢：選項 A 對玩家 i 而言，在每一種對手選擇組合下收益都 ≥ 其他所有選項，且至少一種組合下嚴格 >
   - freeLunch：存在「全員選同一項」的組合使每個人收益都 > 0
   - verdict='FAIL' 若 dominant 非空 或 freeLunch 為真 */
function decodeCombo(code,players,nOpts){
  const idxs=new Array(players); let c=code;
  for(let k=0;k<players;k++){ idxs[k]=c%nOpts; c=Math.floor(c/nOpts); }
  return idxs;
}
function analyzeEvent(spec){
  const {players,options,payoff}=spec;
  const nOpts=options.length;
  const total=Math.pow(nOpts,players);
  if(total>2000000) throw new Error("analyzeEvent: 組合數過大（"+total+"），請縮小 options 或 players");
  const payoffTable=[];
  for(let code=0;code<total;code++){
    const idxs=decodeCombo(code,players,nOpts);
    const choices=idxs.map(ix=>options[ix]);
    payoffTable.push({idxs,result:payoff(choices)});
  }
  const dominant=[]; const detail=[];
  for(let i=0;i<players;i++){
    const tables=options.map(()=>({}));
    for(const entry of payoffTable){
      const A=entry.idxs[i];
      const otherKey=entry.idxs.filter((_,j)=>j!==i).join(",");
      tables[A][otherKey]=entry.result[i];
    }
    for(let A=0;A<nOpts;A++){
      let dominatesAll=true, strictSomewhere=false;
      for(let B=0;B<nOpts && dominatesAll;B++){
        if(B===A) continue;
        for(const key of Object.keys(tables[A])){
          const pa=tables[A][key], pb=tables[B][key];
          if(pa<pb){ dominatesAll=false; break; }
          if(pa>pb) strictSomewhere=true;
        }
      }
      if(dominatesAll) dominant.push({player:i,option:options[A],strict:strictSomewhere});
    }
    detail.push({player:i,table:tables.map((t,idx)=>({option:options[idx],byOthers:t}))});
  }
  let freeLunch=false;
  for(let a=0;a<nOpts;a++){
    const choices=new Array(players).fill(options[a]);
    if(payoff(choices).every(v=>v>0)){ freeLunch=true; break; }
  }
  const verdict=(dominant.length>0||freeLunch)?"FAIL":"PASS";
  return {dominant,freeLunch,verdict,detail};
}
/* 窮舉閘門的雙向測試治具：舊版試膽大會（已知有優勢策略，必須 FAIL）／修正版（少數決，必須 PASS） */
const EVENT_OLD_SHRINE={
  name:"試膽大會（舊版・已知有 bug）", players:4, options:["in","out"],
  payoff(choices){
    const countIn=choices.filter(c=>c==="in").length;
    if(countIn===0) return choices.map(()=>-4);
    return choices.map(c=>c==="in"?(-2+15/countIn):0);
  }
};
const EVENT_NEW_SHRINE={
  name:"試膽大會（修正版・少數決）", players:4, options:["in","out"],
  payoff(choices){
    const n=choices.length, countIn=choices.filter(c=>c==="in").length, countOut=n-countIn;
    if(countIn===0||countOut===0) return choices.map(()=>-3);
    if(countIn===countOut) return choices.map(()=>-1);
    const inIsMinority=countIn<countOut;
    return choices.map(c=>c==="in"?(inIsMinority?6:-3):(inIsMinority?-3:6));
  }
};
function snapPlayers(){
  return S.players.map(p=>({id:p.id,life:p.life,alive:p.alive,bag:p.bag.map(x=>x.n),power:power(p)}));
}
function simulate(seed){
  makeState("solo",seed);
  const nights=[];
  for(;;){
    const pre=snapPlayers();
    const market=S.market.map(x=>x.n);
    S.humanBids={};
    S.players.forEach(p=>{ if(!p.ai) S.humanBids[p.id]=scriptedBids(p); });
    const reveal=resolveAuction();
    const auction=reveal.map(r=>({
      item:r.it.n,
      winnerId:r.winner?r.winner.p.id:null,
      amt:r.winner?r.winner.amt:null,
      outcome:r.outcome,
      events:r.events.map(e=>e.txt),
    }));
    const mid=snapPlayers();
    const R=resolveBattles();
    const battles=R.fights.map(f=>({
      aId:f.A.id,bId:f.B.id,pa:f.pa,pb:f.pb,
      winnerId:f.tie?null:f.w.id, dmg:f.tie?0:f.dmg,
      extra:f.extra?[...f.extra]:[],
    }));
    nights.push({
      round:S.round, market, pre, auction, mid, battles,
      bye:R.bye, nightly:R.nightly, deaths:R.deaths.map(d=>d.id),
      post:snapPlayers(),
    });
    const aliveN=S.players.filter(p=>p.alive).length;
    const humanN=S.players.filter(p=>!p.ai&&p.alive).length;
    if(!humanN||aliveN<=1||S.round>=CFG.ROUNDS) break;
    S.round++; S.market=S.nextMarket; S.nextMarket=drawMarket();
  }
  return {seed:S.seed, nights};
}
function trace(seeds){ return {seeds:[...seeds], runs:[...seeds].map(s=>simulate(s))}; }
window.__yaoshi={ newGame, makeState, simulate, trace, mulberry32, get S(){return S;},
  CFG, POOL, CURSES, ABILITIES, ROLES, WISHES, EVENTS, NIGHTRULES, MODES,
  collectEffects, applyHooks, hasFlag, traitMax, power, facCount, consCapFor, budgetFor,
  /* 地基 2：平衡模擬器＋優勢策略窮舉器（見 docs/GAME_DESIGN.md 六之四、docs/ARCH_SPEC.md） */
  runMany, analyzeEvent, playPolicyGame, statsToMarkdown, POLICIES,
  scriptedBids, policyGreedy, policyHoarder, policySplitter,
  demoEvents:{ oldShrine:EVENT_OLD_SHRINE, newShrine:EVENT_NEW_SHRINE } };
/* ================= ?sim=1 平衡模擬器／窮舉器工具頁（獨立於正常遊戲頁，不共用 DOM） ================= */
