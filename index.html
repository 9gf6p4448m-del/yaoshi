<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>妖市</title>
<meta name="theme-color" content="#14101f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%8F%AE%3C/text%3E%3C/svg%3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ===== 佔位美術：正式版整批替換，邏輯層不得依賴任何樣式 =====
   ===== 美術層（2026-09-03 起）：色彩／字型變數與動畫 keyframes 在 assets/theme.css，
         角色頭像與圖示在 assets/*.svg，掛法與紀律見 docs/art-integration-guide.md =====
   ===== 橫向牌桌版：設計基準 844x390（iPhone 橫持） ===== */
:root{
  /* v0.11 起舊變數名全部指向 assets/theme.css 的 --c-* token（對照表在 theme.css 檔尾）。
     舊值留作備查：--bg #120e1d --table #1d1531 --table2 #2a1f45 --panel #1f1830 --panel2 #2a2142
     --line #3d3260 --ink #e8e2f5 --dim #9a8fc0 --gold #e8b34b --red #e05555 --green #5fbf77
     --zuling #5fae8f --xianghuo #e0a13f --yinqi #9b6fd4（紫，現改暗綠、紫讓給詛咒品）--curse #d45577 */
  --bg:var(--c-bg); --table:var(--c-bg-card); --table2:var(--c-bg-surface); --panel:var(--c-bg-surface); --panel2:var(--c-bg-raised);
  --line:var(--c-line); --ink:var(--c-text); --dim:var(--c-text-dim); --gold:var(--c-gold); --red:var(--c-danger); --green:var(--c-safe);
  --zuling:var(--c-zuli-light); --xianghuo:var(--c-xianghu-light); --yinqi:var(--c-yinqi-light); --curse:var(--c-curse-light);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body,"Microsoft JhengHei","PingFang TC",sans-serif);
  font-size:14px;position:fixed;inset:0;width:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{touch-action:manipulation} /* 連點任何位置都不觸發 double-tap zoom（試玩回饋：視窗上跳）；下行捲動容器另開 pan-y */
#felt,#sheetbox,#modalbox,#review,#selGrid{touch-action:pan-y}
#rotateHint{display:none;position:fixed;inset:0;z-index:99;background:var(--bg);
  flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#rotateHint .ic{font-size:52px;animation:rot 2s infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait){ #rotateHint{display:flex} }
.title{text-align:center;padding:22px 20px;height:100%;display:flex;flex-direction:column;justify-content:center}
.title h1{font-size:38px;color:var(--gold);letter-spacing:12px;margin-bottom:6px}
.title p{color:var(--dim);font-size:13px;line-height:1.7}
.title .btns{display:flex;gap:12px;justify-content:center;margin-top:14px}
#table{display:none;height:100%;height:100dvh;max-width:960px;margin:0 auto;
  grid-template-areas:"north north north" "west felt east" "south south south";
  grid-template-rows:56px 1fr 62px;grid-template-columns:120px 1fr 120px;gap:4px;padding:4px}
#table.on{display:grid}
#north{grid-area:north;display:flex;justify-content:center}
#west{grid-area:west} #east{grid-area:east}
#west,#east{display:flex;align-items:center}
/* 3D 環境層透出（v0.15，使用者裁定「甲」）：牌桌面板半透明＋毛玻璃，讓 canvas 的桌面／燈籠光／
   線香煙從後面透出來。透明度的單一事實來源＝下面三個變數，要調就改這裡，不要各處硬寫 rgba。
   每條都先寫不透明的舊值當 fallback：不支援 color-mix 的瀏覽器退回原樣，不會破版。 */
:root{--glass:color-mix(in srgb,var(--panel) 60%,transparent);
  --glass-felt:color-mix(in srgb,var(--table) 52%,transparent);
  --glass-felt2:color-mix(in srgb,var(--table2) 52%,transparent);
  --glass-blur:blur(7px)}
.seat{position:relative;background:var(--panel);background:var(--glass);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);border-radius:12px;
  padding:5px 8px;cursor:pointer;transition:box-shadow .3s;width:100%}
.seat.hl{box-shadow:0 0 12px var(--gold);border-color:var(--gold)}
.seat.dead{opacity:.35}
#north .seat{display:flex;align-items:center;gap:8px;max-width:320px}
#west .seat,#east .seat{text-align:center}
.seat .av{font-size:26px;line-height:1.1}
.seat .nm{font-size:12px;white-space:nowrap}
.seat .st{font-size:10px;color:var(--dim);line-height:1.4}
/* 角色頭像 SVG（assets/characters）：各處尺寸；載入失敗時 avHTML() 退回 emoji，這些規則不生效也無妨 */
.seat .av svg{width:38px;height:38px;display:block}
#south .av svg{width:42px;height:42px;display:block}
.fighter .fav svg{width:104px;height:104px;display:block;margin:0 auto}
.rav svg{width:58px;height:58px;display:block;margin:0 auto}
#hoAv svg{width:72px;height:72px;display:block;margin:0 auto}
.avi svg{width:24px;height:24px;vertical-align:middle}
/* 演出層（art-integration-guide §5）：開標黑幕、對決淡入淡出、傷害蓋章、盯上印。keyframes 在 theme.css */
#veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:6;border-radius:16px}
#veil.on{opacity:1}
#duel{opacity:0;transition:opacity .3s}
/* 對決時把網頁牌桌整個淡掉：#duel 的背景已經半透明，底下要露出的是 3D 舞台，
   不是被模糊的座位卡（實測 scratchpad b2-duel.png 第一版就是那樣，3D 完全沒發揮）。 */
#table.duelfade{opacity:0;transition:opacity .28s}
#duel.on{opacity:1}
.dmg{display:inline-block}
.mark-stamp{position:absolute;right:-6px;top:-9px;width:28px;height:28px;z-index:4;pointer-events:none;
  filter:drop-shadow(0 0 6px var(--c-danger,#e04040))}
#south .mark-stamp{right:auto;left:42px;top:-6px}
.seat .dir{position:absolute;top:-7px;left:8px;background:var(--table2);border:1px solid var(--line);
  border-radius:6px;font-size:10px;padding:0 5px;color:var(--gold)}
.windb{position:absolute;top:-7px;right:8px;background:var(--gold);color:#14101f;border-radius:6px;
  font-size:10px;padding:0 5px;font-weight:bold}
/* 座位卡「角色資訊」ⓘ 鈕（2026-09-02 試玩回饋：進遊戲後看不到角色被動）——純呈現，見 IMPLEMENTATION_GUIDE §11.7 慣例 */
.seat .roleInfoBtn{position:absolute;bottom:-7px;right:8px;background:var(--panel2);border:1px solid var(--gold);
  color:var(--gold);border-radius:6px;font-size:11px;padding:0 5px;line-height:15px;z-index:3;cursor:pointer}
#south button.side.roleInfoBtn{width:38px;padding:0;font-size:14px}
.bubble{position:absolute;z-index:9;background:#efe8d8;color:#2a2142;border-radius:10px;padding:4px 9px;
  font-size:12px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.5);left:50%;transform:translateX(-50%);top:calc(100% + 4px)}
#west .bubble{left:calc(100% + 6px);top:50%;transform:translateY(-50%)}
#east .bubble{left:auto;right:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.bubble.show{opacity:1}
#felt{grid-area:felt;background:radial-gradient(ellipse at 50% 35%,var(--table2),var(--table));
  background:radial-gradient(ellipse at 50% 35%,var(--glass-felt2),var(--glass-felt));
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:2px solid var(--line);border-radius:18px;padding:8px 10px;position:relative;overflow-y:auto}
/* 夜份列：12 格月相與風位資訊**同一列**（美術層 §4）。#felt 高度預算零餘裕，不得新增一列。 */
#feltHead{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;
  text-align:center;font-size:12px;color:var(--gold);margin-bottom:5px}
#nightbar{flex:0 0 auto;line-height:0}
#nightbar svg{height:13px;width:auto;display:block}
/* helpBtn 原本 position:fixed，但 #felt 的 backdrop-filter 會讓 fixed 子元素以 #felt 為容器，實際就是釘在牌桌右上角、
   與 #skipbtn 同一個角（2026-09-03 試玩回報重疊）。改成明確 absolute，#skipbtn 往左讓位（right:50px） */
/* 版本探針的更新條（2026-09-03）：GitHub Pages 的 index.html 有 10 分鐘 HTTP 快取，使用者重開常拿到舊版。
   探針發現伺服器版本比手上的新就亮這條，點了用帶版本號的網址重載（網址不同＝快取沒這份） */
#updBar{display:none;position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:60;background:#2a2344;color:var(--gold);
  border:1px solid var(--gold);border-radius:20px;padding:6px 14px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.6);cursor:pointer;white-space:nowrap}
#updBar.on{display:block;animation:pop .25s ease-out}
#helpBtn{display:none;position:absolute;top:6px;right:8px;z-index:25;width:34px;height:34px;border-radius:50%;
  background:#2a2344;color:var(--gold);border:1px solid var(--gold);font-size:16px;line-height:1}
#stage{min-height:40px}
.preview{background:rgba(0,0,0,.25);border:1px dashed var(--gold);border-radius:10px;padding:4px 10px;
  font-size:11px;color:var(--gold);margin-bottom:6px;text-align:center}
.wishbar{background:rgba(0,0,0,.25);border:1px solid #7a5ea8;border-radius:10px;padding:4px 10px;
  font-size:11px;color:#cdb9ee;margin-bottom:6px;text-align:center}
.wishbar b{color:var(--gold)}
/* 盯上徽章掛在卡角外側左上（與右上的 .mybid 對稱），不壓品名（v0.11 修正：原本 left:4px;top:4px 蓋住 .nm） */
.markb{position:absolute;left:-4px;top:-7px;font-size:9.5px;line-height:12px;background:var(--panel2);border:1px solid #c9a24a;border-radius:8px;padding:0 5px;color:#ffd97a;z-index:2;white-space:nowrap}
/* 今夜市集規則：說明併在 .preview（明夜預告／hint）框內的那一段＋押寶夜的「一注」輸入條 */
.rulein{color:#ffd9d0;margin-left:6px}
.rulein b{color:var(--gold)}
/* 盯上信譽：跟 .rulein 一樣是併進 .preview 框內的一段，不另佔高度（#felt 高度預算是零餘裕） */
.credin{color:#d8e8d4;margin-left:6px}
.aihint{display:block;font-size:11px;line-height:1.35;text-align:left;color:#d8e8d4}
.aihint .who{color:var(--gold);font-weight:600}
.aihint .sep{color:var(--dim);margin:0 4px}
.aihint b{color:var(--gold)}
.credin b{color:var(--gold)}
.stakebar{margin:0 0 5px;background:rgba(0,0,0,.25);border:1px solid var(--gold);border-radius:9px;
  padding:3px 9px;text-align:center}
.stakerow{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:nowrap}
.stakebar .stepper{display:flex;align-items:center}
.stakebar .stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:16px}
.stakebar .amt{width:40px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:var(--gold);font-family:var(--font-display,sans-serif);font-variant-numeric:tabular-nums}
.stakebar .typebtn{height:30px;font-size:12px;padding:0 10px;white-space:nowrap}
.pickbox{position:absolute;top:-8px;right:-4px;width:22px;height:22px;border-radius:7px;z-index:2;
  border:1px solid var(--gold);background:var(--panel2);color:var(--gold);
  font-size:13px;font-weight:bold;line-height:20px;text-align:center}
.pickbox.on{background:var(--gold);color:#14101f}
.mcard.locked{opacity:.5;cursor:default}
#market{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.mcard{background:var(--bg-sys,var(--panel));border:1px solid var(--line);border-radius:11px;padding:7px;cursor:pointer;
  position:relative;transition:transform .15s}
.mcard:active{transform:scale(.97)}
.mcard.curse{border-color:var(--curse)}
.mcard.bided{border-color:var(--gold)}
.mcard .nm{font-weight:bold;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .pw{font-size:11px;color:var(--gold)}
.mcard .ab{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.3}
/* 法寶圖示（美術層，art-integration-guide §3）：浮水印式絕對定位，**不佔任何高度**——
   #felt 的高度預算是零餘裕（GUIDE §11.10），加圖示不得讓卡片變高。
   沒有圖示的法寶靠 .bg-* 系別底色識別（§7 裁定 3），不拿別件的圖頂替。 */
.mico{position:absolute;right:2px;bottom:2px;width:30px;height:30px;opacity:.24;pointer-events:none;z-index:0}
.mcard>div{position:relative;z-index:1}
.iico{width:17px;height:17px;vertical-align:-3px;margin-right:4px}
.bico{width:11px;height:11px;vertical-align:-1px;margin-right:4px;opacity:.9}
.mybid{position:absolute;top:-8px;right:-4px;background:var(--gold);color:#14101f;border-radius:8px;
  font-size:11px;font-weight:bold;padding:1px 7px;z-index:2}
.mybid.poison{background:var(--curse);color:#fff}
.fchip{display:inline-block;font-size:9px;border-radius:5px;padding:0 4px;margin-left:3px;color:#14101f;font-weight:bold}
.f-zuling{background:var(--zuling)} .f-xianghuo{background:var(--xianghuo)}
.f-yinqi{background:var(--yinqi)} .f-curse{background:var(--curse);color:#fff}
.stageCard{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:8px 12px;
  text-align:center;animation:pop .3s;max-width:420px;margin:0 auto}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.stageCard .big{font-size:15px;font-weight:bold}
.bidfly{display:flex;justify-content:space-between;padding:3px 10px;margin-top:5px;background:var(--panel2);
  border-radius:8px;font-size:12px;animation:slidein .3s}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.bidfly.win{background:var(--gold);color:#14101f;font-weight:bold}
.outcome{margin-top:6px;color:var(--gold);font-size:12px;animation:pop .3s}
#south{grid-area:south;display:flex;align-items:center;gap:10px;background:var(--panel);
  background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);border-radius:12px;padding:5px 12px;position:relative}
#south .dir{color:var(--gold);font-size:11px}
#south .av{font-size:28px}
#south .life{font-size:21px;font-weight:bold;color:var(--green);line-height:1;font-family:var(--font-display,sans-serif);font-variant-numeric:tabular-nums}
#south .life.low{color:var(--red)}
#south .mut{line-height:1.35}
#budget{font-size:11px;color:var(--dim);margin-left:auto;text-align:right}
#budget.over{color:var(--red);font-weight:bold}
#south button.side{height:38px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);padding:0 12px;font-size:12px}
.bigbtn{height:44px;border-radius:10px;border:none;background:var(--gold);color:#14101f;
  font-size:15px;font-weight:bold;padding:0 22px}
.bigbtn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.bigbtn:disabled{opacity:.4}
#skipbtn{position:absolute;top:6px;right:50px;background:rgba(0,0,0,.3);border:1px solid var(--line);
  color:var(--dim);border-radius:8px;padding:2px 10px;font-size:11px;display:none;z-index:5}
/* 對決場景 */
/* 背景半透明：對決時鏡頭已切到貼桌面的低角度，這裡讓那個畫面透出來當舞台。
   兩層都留：不支援 color-mix 的瀏覽器退回原本的不透明漸層，不會變成看不清楚。 */
#duel{display:none;position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 45%,#31204f,#0d0a16);
  background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,#31204f 62%,transparent),color-mix(in srgb,#0d0a16 78%,transparent));
  flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#duelArena{display:flex;align-items:center;justify-content:center;gap:34px;width:100%}
/* 接線卷：3D 妖載入條——只在還沒載完才出現（見 pwAwaitFigures），字距與拍首字幕同一套 */
#duelLoad{display:none;font-size:12px;letter-spacing:3px;color:var(--gold);opacity:.8;margin-top:4px}
#duelLoad.on{display:block;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:.95}}
.fighter{text-align:center;transition:transform .35s}
.fighter .fav{font-size:74px;line-height:1.15;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.fighter .fnm{font-size:14px;margin-top:2px}
.fighter .fpw{font-size:30px;font-weight:bold;color:var(--gold);font-family:var(--font-display,sans-serif);font-variant-numeric:tabular-nums}
.fighter .fdir{font-size:11px;color:var(--gold)}
.vsbig{font-size:26px;font-weight:bold;color:var(--dim);letter-spacing:2px}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-4deg)}
  50%{transform:translateX(7px) rotate(3deg)}80%{transform:translateX(-4px)}}
#duel .flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#duel .flashfx.on{animation:flashA .35s}
@keyframes flashA{0%{opacity:.85}100%{opacity:0}}
#duelResult{margin-top:14px;font-size:16px;min-height:26px;text-align:center}
#duelResult .dmg{font-size:20px;font-weight:bold}
#duelSub{color:var(--dim);font-size:12px;margin-top:4px;min-height:18px;text-align:center}
/* ── 《紙紮夜戰》三拍演出（v0.31 卷 C1）──────────────────────────────────
   兩塊字幕與隻數牌只在 ON 分支（#duel.pw）現身；PAPERWAR_ON=false 時 display:none，
   連版面高度都不佔，OFF 的對決畫面與 v0.30 完全一樣。
   進出場動畫一律由 JS 用 WAAPI 驅動（SKIP 快轉要能立刻中斷），這裡只放靜態樣式。 */
#duelBeat,#duelMove{display:none}
#duel.pw #duelBeat{display:block;font-size:15px;letter-spacing:3px;color:var(--gold);
  min-height:21px;margin-bottom:2px;text-align:center;text-shadow:0 2px 8px #000,0 0 3px #000}
#duel.pw #duelMove{display:block;font-size:13px;min-height:18px;margin-top:2px;
  text-align:center;color:#ffd9a0;text-shadow:0 2px 8px #000,0 0 3px #000}
/* 演出可讀性小卷（2026-09-05 晚）：招式字幕靠出招那一側、字色用出招方系色、第二行效果說明 */
/* #duel 是置中的 column flex：字幕元素給 62% 寬、靠出招那一側對齊 flex 容器，字在其中置中 → 字的中心落在該側欄位附近
   （覆審 H-1：原本元素縮到內容寬、padding 反而把字推去對面；改 text-align:left 又會貼到螢幕邊） */
#duel.pw #duelMove.side-A,#duel.pw #duelMove.side-B{width:62%;box-sizing:border-box;text-align:center}
#duel.pw #duelMove.side-A{align-self:flex-start} #duel.pw #duelMove.side-B{align-self:flex-end}

#duel.pw #duelMove .mvline{display:block} #duel.pw #duelMove .mvdesc{display:block;font-size:11px;color:var(--dim);letter-spacing:0}

   ON 模式把上下留白整排收緊，量到 scrollHeight ≤ clientHeight 才算過。 */
#duel.pw #duelResult{margin-top:6px}

   顏色＝該紙紮的陣營（--pwf 由 fac-* class 帶入；v0.36 以前是三系淺色卻按體型套，陰氣小紙人顯示成祖靈棕＝誤導），
   體型改靠形狀：小紙人實心／大紙偶大片＋金邊／護法空心（只擋刀不出手）／飄影半透明＋虛線邊。
   每隊（同一件法寶）前一枚 .pwfac 系字徽。pwLineUp 逐子元素 stagger、pwBurnOne 只認 id，兩者都不受新增徽章影響。 */
.pwchip,.pwfac{--pwf:#8a8a8a}
.fac-zuling{--pwf:var(--zuling)} .fac-xianghuo{--pwf:var(--xianghuo)} .fac-yinqi{--pwf:var(--yinqi)}

.pwchip.ward{height:14px;background:transparent;border:1.5px solid var(--pwf)}
/* 半透明走 filter 不走 opacity：pwRise 用 WAAPI fill:both 把 opacity 釘在 1，CSS 的 opacity 永遠被蓋（探針實測 haunt computed opacity＝1；
   舊的 .burnt{opacity:.1} 同樣被蓋、燒掉的片只剩灰階——本卷一併改成 filter） */
.pwchip.haunt{filter:opacity(.6);border:1px dashed rgba(255,255,255,.75)}
.pwchip.burnt{filter:grayscale(1) opacity(.15)}
.pwfac{font-style:normal;font-size:9px;font-weight:bold;line-height:12px;width:12px;height:12px;border-radius:50%;
  text-align:center;color:#14101f;background:var(--pwf);margin-left:4px;align-self:center;
  box-shadow:0 1px 3px rgba(0,0,0,.5)}

/* 受擊停格（v0.27）：整頁的 CSS 動畫與轉場一起凍住，3D 那半邊由 ys:hitstop 事件把 dt 歸零。
   只停「播放狀態」，不改任何版面屬性，所以解凍後動畫接著原來的進度跑完，不會跳。 */
body.hitstop *, body.hitstop *::before, body.hitstop *::after{
  animation-play-state:paused!important; transition:none!important}
/* fxBurn 的燒燬（v0.27 積木庫）：焦邊→整個燒亮→縮成灰。時間由 --burn-ms 帶進來，
   紙紮夜戰要燒紙紮人時直接對那個元素叫 fxBurn()，不必再寫一份 keyframes。 */
.anim-burn{animation:burnAway var(--burn-ms,620ms) ease-in forwards}
@keyframes burnAway{
  0%{filter:none;transform:none;opacity:1}
  28%{filter:brightness(1.5) sepia(.5) drop-shadow(0 0 10px #f0a840);transform:scale(1.03)}
  62%{filter:brightness(2.1) sepia(.9) drop-shadow(0 0 18px #f06020);transform:scale(.98) rotate(-1.5deg);opacity:.85}
  100%{filter:brightness(.3) sepia(1) blur(3px);transform:scale(.86) translateY(10px) rotate(-3deg);opacity:0}}
/* 新增 keyframes 要跟著進 reduced-motion 清單（art-integration-guide §6 第 5 條）。
   theme.css 那份清單管既有的 .anim-*，本檔新增的就寫在本檔，跟 keyframes 放同一處。 */
@media (prefers-reduced-motion: reduce){ .anim-burn{animation-duration:1ms!important} }
/* 對決立體站姿（v0.27）：3D 層真的跑起來時（html.ys3d，由 js/renderer.js 掛上），

   免得同一張臉在同一個畫面出現兩次。3D 沒載入就維持原樣（驗收 J8）。
   .fav 不能直接 display:none——那樣兩欄會往中間塌、名字與戰力位置整個變，
   保留它的高度當成 3D 人形的佔位框。 */
html.ys3d #duelArena .fav{visibility:hidden;height:172px}
html.ys3d #duel{background:radial-gradient(ellipse at 50% 45%,rgba(49,32,79,.34),rgba(13,10,22,.6))}
/* 3D 版的碰撞閃光要收斂：原本整片 #fff 開 .85，疊上 bloom 與人形逆光之後整格泛白，
   火星與人臉全被洗掉（實測 scratchpad duel-844-3-spark.png 第一版）。改成中央亮、
   邊緣透的暖光，峰值降到 .5、時間縮到 .26s——閃的是「打擊點」，不是整個螢幕。 */
html.ys3d #duel .flashfx{background:radial-gradient(ellipse at 50% 42%,#fff 0%,#ffd9a0 34%,rgba(255,170,70,0) 70%)}
html.ys3d #duel .flashfx.on{animation:flash3d .26s}
@keyframes flash3d{0%{opacity:.5}100%{opacity:0}}
html.ys3d .fighter .fnm{text-shadow:0 2px 8px #000,0 0 3px #000}

<script>
"use strict";
/* ================= 常數（【試玩必調】集中此處） ================= */
const CFG = {
  LIFE: 50, ROUNDS: 12, MARKET: 4, /* LIFE 40→50：節奏包甲（2026-09-02 使用者裁定），角色起始壽命為 CFG.LIFE±n 一起平移 */
  CURSE_PROB: 0.65,
  SET_MIN: 2,
  DMG_BASE: 3, DMG_DIV: 5, DMG_MAX: 6,
  CONS_CAP_DIV: 6,      /* 保守標上限＝壽命÷此值。3→6（2026-09-03 使用者裁定，實驗見 docs/experiments/2026-09-03-conscap-div.md）：
     ÷3 時上限（開局 16）是成交價中位（5）的三倍，押命標永遠用不到；÷6 讓 43% 的得標價落在上限之上【試玩必調】 */
  /* 拍賣經濟 v0.6（2026-09-02 配置A，48 組配置×9 策略×n=2000 掃描決選）
     三值全設中性（BID_FEE=0, MAX_BIDS=0, CONS_LOSE_FRAC=0）＝回到 v0.5 規則（等價驗證用） */
  BID_FEE: 1,           /* 掛號費：每下一筆有效標先付的壽命，不論輸贏【決選值勿自調】 */
  MAX_BIDS: 2,          /* 每人每夜有效標件數上限（超過保留金額最大的前 N 筆）；0＝無上限 */
  CONS_LOSE_FRAC: 0.25, /* 保守標落標付費比例（cost=ceil(amt×frac)）；0＝全額退還 */
  WIND_POWER: 3,     /* 風位當夜戰力加成【試玩必調】 */
  AI_DESTROY_P: 0.5, /* 最強 AI 對詛咒品下防禦性銷毀標的機率【試玩必調】 */
  /* AI 預設打法旋鈕（ARCH_SPEC 待辦 22；預設值＝改動前行為，trace 不變）：
     AI_IDLE_P＝每夜整夜按兵不動的機率（0 時不耗亂數）；AI_THROTTLE＝計畫內出價的預算節流比例 */
  AI_IDLE_P: 0, AI_THROTTLE: 0.30, /* 節流 0.45→0.30：節奏包甲 */
  NIGHT_REGEN: 5, /* 天明回血：節奏包甲（n=10000：中位 11 夜、46% 到 12 夜、出局 1.73 人；設 0＝關）【試玩必調】 */
  /* 盯上宣告（GAME_DESIGN §5.8，2026-09-02）：封標前每人公開釘一件。MARK_ON=false＝不宣告、不耗亂數、trace 與加入前相等。
     MARK_TAX 虛張稅（盯了沒出價）／MARK_SCARE 怯場型每多一人盯的估值折減／MARK_CONTEST 搶標型對被盯品的加成／
     MARK_OWN 對自己盯的加成（承諾）／MARK_BLUFF_P AI 改盯次高（虛張）機率。全【試玩必調】
     ★MARK_TAX 於 2026-09-03 由 1 改為 0（使用者裁定，見 GAME_DESIGN §5.8）★：虛張的代價改由
     下面的「盯上信譽」承擔——騙人花掉的是別人對你的信任，不是硬收一筆看不懂的稅。
     設回 1 即恢復舊行為（Y1 kill switch 就是這樣驗的）。 */

  if(!p.spec){

    p.spec=FACTIONS[Math.floor(r()*FACTIONS.length)];
  }
  return p.spec;
}
/* grudge 最高的活著對手；沒有任何仇恨值就回 null（同分取戰力高者，保決定性） */
function topGrudge(p){
  const g=p.grudge||{}; let best=null,bv=0;
  for(const q of S.players){
    if(!q.alive||q.id===p.id) continue;
    const v=g[q.id]||0;
    if(v>bv || (v===bv && v>0 && best && power(q)>power(best))){ bv=v; best=q; }
  }
  return bv>0?best:null;
}
/* 某人的主力陣營＝袋中非詛咒品最多的那一系（同數取先湊到的，保決定性） */
function mainFaction(p){
  const c={}; let f=null,m=0;
  for(const x of p.bag){
    if(x.curse) continue;
    c[x.f]=(c[x.f]||0)+1;
    if(c[x.f]>m){ m=c[x.f]; f=x.f; }
  }
  return f;
}
/* 陰間當鋪的一次性典當：唯一寫入 p.pawned 的地方（ARCH_SPEC §4 欄位）。
   成功典當回傳 true；呼叫端自己決定怎麼把「這次致死的扣血」調整成「剛好留 1 命」。
   縛靈鎖從 CURSES 表按名字取（資料表內容互相引用，不是引擎寫死 id）。 */
function pawnNow(p){
  if(p.pawned) return false;
  const lock=CURSES.find(x=>x.n==="縛靈鎖");
  p.pawned=true;
  p.bag.push({...lock});
  return true;
}

  wish_unscathed:{id:"wish_unscathed",name:"全身而退",

    canDraw(p){

/* 第二批心願共用的小工具（純讀取、決定性、不耗亂數） */
function wishMissingFacs(p){ return FACTIONS.filter(f=>!p.bag.some(x=>!x.curse&&x.f===f)); }
function wishTopFoe(p){ /* 壽命最高的存活對手；同分取座位序小者 */
  const foes=S.players.filter(q=>q.alive&&q.id!==p.id);
  if(!foes.length) return null;
  return foes.sort((a,b)=>b.life-a.life||a.id-b.id)[0].id;
}
function wishTargetName(p){ const t=p&&p.wish&&p.wish.target; return t==null?"（無對象）":`「${S.players[t].name}」`; }

/* --- 4/5 EVENTS：妖市異事（GAME_DESIGN §六之三 B；第 CFG.EVENT_NIGHTS 夜觸發，前一夜預告）。
   形狀：{id,name,icon,input:"pick"|"num",opts?,desc(ctx),fmt(c)?,cap(p)?,prep(ctx)?,ai(p,ctx),settle(ctx)}
   input="pick"：opts 二選一；input="num"：密封數字 0..cap(p)。
   閘門存證：三者的 analyzeEvent spec 在 demoEvents（newShrine／plague／ghost），verdict 均實測 PASS（六之四）。
   settle 的壽命增減「不」計入 S.wishNight.extLoss——東窗血光維持「對決＋詛咒」的裁定口徑，
   是否擴及異事待使用者裁定（ARCH_SPEC §9 待辦 14）。 --- */
const EVENTS = {
  plague:{id:"plague",name:"瘟王過境",icon:"🕯",input:"num",hint:"全場合力湊壽命供奉，湊不滿全體遭殃",
    desc:()=>`全場需共同湊滿 ${CFG.PLAGUE_NEED} 壽命供奉瘟王，每人密封投入（可為 0）。湊滿：全體平安，投入最多者另獲一件法寶；沒湊滿：全體 -${CFG.PLAGUE_FAIL}，且已投入的壽命不退還`,
    fmt:c=>c>0?`投入 ${c}`:"分文不出",
    cap(p){ return Math.min(CFG.EVENT_INPUT_CAP, Math.max(0,p.life-1)); },
    ai(p){ const a=p.life>24?3+(S.rng()<0.3?1:0):p.life>12?2:(S.rng()<0.5?1:0);
      return Math.min(a,this.cap(p)); },
    settle(ctx){
      let tot=0; ctx.players.forEach(p=>{ const a=ctx.choices[p.id]|0; tot+=a; p.life-=a; });
      if(tot>=CFG.PLAGUE_NEED){
        const mx=Math.max(...ctx.players.map(p=>ctx.choices[p.id]|0));
        ctx.events.push({txt:`🕯 供奉湊得 ${tot}，瘟王平安過境`});
        if(mx>0){
          const tied=ctx.players.filter(p=>(ctx.choices[p.id]|0)===mx);
          const top=tied.length>1?tied[Math.floor(S.rng()*tied.length)]:tied[0];
          if(!S.deck.length) S.deck=shuffle([...POOL].map(x=>({...x})));
          const it=S.deck.pop(); top.bag.push(it);
          ctx.events.push({txt:`🎁 投入最多的 ${top.name}（${mx}）獲瘟王賞賜「${it.n}」`});
        }
      }else{
        ctx.players.forEach(p=>{ p.life-=CFG.PLAGUE_FAIL; });
        ctx.events.push({txt:`☠️ 只湊得 ${tot}，瘟疫橫掃——全體 -${CFG.PLAGUE_FAIL}，投入不退還`});
      }
    }},
  shrine:{id:"shrine",name:"試膽大會",icon:"⛩",input:"pick",hint:"二選一比膽，人少的一邊贏",
    opts:[{v:"in",label:"進廟"},{v:"out",label:"留下"}],
    desc:()=>`密封二選一「進廟」或「留下」。人數較少的一邊每人 +${CFG.SHRINE_WIN}，人數較多的一邊每人 -${CFG.SHRINE_LOSE}；2 比 2 平手雙方各 -${CFG.SHRINE_TIE}`,
    ai(){ return S.rng()<0.5?"in":"out"; },
    settle(ctx){
      const ids=ctx.players.map(p=>p.id);
      const countIn=ids.filter(id=>ctx.choices[id]==="in").length, countOut=ids.length-countIn;
      if(countIn===0||countOut===0){
        ctx.players.forEach(p=>{ p.life-=CFG.SHRINE_LOSE; });
        ctx.events.push({txt:`⛩ 全員選了同一邊，膽氣盡失——全體 -${CFG.SHRINE_LOSE}`});
        return;
      }
      if(countIn===countOut){
        ctx.players.forEach(p=>{ p.life-=CFG.SHRINE_TIE; });
        ctx.events.push({txt:`⛩ 兩邊人數平分，雙方各 -${CFG.SHRINE_TIE}`});
        return;
      }

      ctx.players.forEach(p=>{ p.life+=ctx.choices[p.id]===minority?CFG.SHRINE_WIN:-CFG.SHRINE_LOSE; });
      ctx.events.push({txt:`⛩ 人少的一邊（${minority==="in"?"進廟":"留下"}）贏得膽勇——+${CFG.SHRINE_WIN}／-${CFG.SHRINE_LOSE}`});

  ghost:{id:"ghost",name:"厲鬼索命",icon:"👹",input:"num",hint:"競標擋煞權，救壽命最低者有賞",

    settle(ctx){
      const act=ctx.players.map(p=>({p,amt:ctx.choices[p.id]|0})).filter(b=>b.amt>0);
      if(!act.length){ ctx.events.push({txt:"🥤 無人擲杯，廟埕冷清"}); return; }
      const pot=act.reduce((s,b)=>s+b.amt,0);
      act.forEach(b=>{ b.p.life-=b.amt; });
      const succ=act.filter(b=>S.rng()<b.amt/(b.amt+8)); /* 座位序擲杯，決定性 */
      ctx.events.push({txt:`🥤 ${act.map(b=>`${b.p.name} 壓 ${b.amt}${succ.includes(b)?"（聖杯！）":"（陰杯）"}`).join("、")}`});
      if(!succ.length){ ctx.events.push({txt:`🥤 無人得聖杯，彩池 ${pot} 全數沒收`}); return; }
      const mx=Math.max(...succ.map(b=>b.amt));
      const tied=succ.filter(b=>b.amt===mx);
      const w=(tied.length>1?tied[Math.floor(S.rng()*tied.length)]:tied[0]).p;
      const prize=Math.floor(CFG.POE_CUT*pot);
      w.life+=prize;
      if(!S.deck.length) S.deck=shuffle([...POOL].map(x=>({...x})));
      const it=S.deck.pop(); w.bag.push(it);
      ctx.events.push({txt:`🥤 ${w.name} 聖杯奪彩——得 ${prize} 壽命＋「${it.n}」`});
    }},
};

        ctx.market.forEach(x=>{ (x.curse?S.cdeck:S.deck).unshift(x); });

        S.unsoldCurses=[];
      },
    },
    report(st){ return st.forced>0

/* ================= Hook 分派器 =================
   effect 來源與呼叫順序（固定，改了結果就不可重現）：
     1. p 的角色 → 2. p.bag 內有 ab 的道具（依袋中順序）→ 3. p 的本夜心願 → 4. S.nightRule → 5. S.event
   （心願來源 2026-09-02 加入：讓 WISHES 的 onAi* 扭曲不必在引擎寫 id 比對；
     停用心願（CFG.WISH_ON=false）時 p.wish 恆為 null，此來源等同不存在，行為與加入前逐位元組相等）
   同一個 effect 物件只收一次（袋裡兩把同名法寶＝一次效果，與舊行為一致）。
   HOOK_ORDER 可為個別 hook 指定不同的收集順序（ARCH_SPEC §3.10 要求 onNightEnd 道具先於角色）。
   ctx 是可變累加器：effect 直接改 ctx 的欄位，不回傳值。 */
const HOOK_ORDER = { onNightEnd:"itemsFirst" };
function collectEffects(p,order){
  const out=[], seen=new Set();
  const add=e=>{ if(e && !seen.has(e)){ seen.add(e); out.push(e); } };
  const role=()=>{ if(p && p.roleId) add(ROLES[p.roleId]); };
  const items=()=>{ if(p) for(const it of p.bag) if(it.ab) add(ABILITIES[it.ab]); };
  if(order==="itemsFirst"){ items(); role(); } else { role(); items(); }
  if(p && p.wish && WISHES[p.wish.id]) add(WISHES[p.wish.id]); /* 本夜心願（私有 effect 來源） */
  if(S && S.nightRule) add(S.nightRule);
  if(S && S.event) add(S.event);
  return out;
}
/* p 可為：玩家 / 玩家陣列（雙方 effect 合併去重後依序跑）/ null（只取全域 effect） */
function applyHooks(name,ctx,p){
  const order=HOOK_ORDER[name];
  let list;
  if(Array.isArray(p)){
    list=[]; const seen=new Set();
    for(const q of p){
      if(!q) continue;
      for(const e of collectEffects(q,order)) if(!seen.has(e)){ seen.add(e); list.push(e); }
    }
  }else{
    list=collectEffects(p||null,order);
  }
  /* 依 order 數字小到大重排（未設 order 的 effect 預設 100）；同數字者維持收集順序不變——
     Array.prototype.sort 在現代引擎已保證穩定，不需額外索引 tie-break */
  list=list.slice().sort((a,b)=>(a.order??100)-(b.order??100));
  for(const e of list){ const h=e.hooks && e.hooks[name]; if(h) h(ctx); }
  return ctx;
}
/* 沒有 hook 掛點的靜態特性：flags（布林）與 traits（取最大值），引擎只問名字不認得內容 id */
function hasFlag(p,flag){ return collectEffects(p).some(e=>e.flags && e.flags.indexOf(flag)>=0); }
function traitMax(p,key,base){
  let v=base;
  for(const e of collectEffects(p)) if(e.traits && e.traits[key]>v) v=e.traits[key];
  return v;
}

   cleaveFull 精英濺射改全額／vsSwarm 對群體目標額外傷害／halfSplash 受到的濺射減半／thorn 被擊中反傷／

   使用者以為沒推上線。解法：開頁與從背景切回前景時，用帶時間戳的網址（快取一定沒有）抓一次線上的
   index.html，比對裡面的 VERSION 字串；比手上新就亮 #updBar，點了用 ?v=<新版> 重載。
   單一事實來源仍是 VERSION 常數，不另開 version.txt。

let UPD_LAST=0, UPD_NEW=null;
function checkForUpdate(force){
  try{
    if(typeof fetch!=="function"||typeof location==="undefined"||!/^https?:/.test(location.protocol)) return;
    const now=Date.now(); if(!force&&now-UPD_LAST<60000) return; UPD_LAST=now;
    const url=location.pathname.replace(/[^/]*$/,"")+"index.html?upd="+now;
    fetch(url,{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
      const m=t.match(/const VERSION="([0-9.]+)"/); if(!m) return;
      const cmp=(a,b)=>{ const x=a.split(".").map(Number), y=b.split(".").map(Number); for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; };
      if(cmp(m[1],VERSION)>0){ UPD_NEW=m[1]; const b=document.getElementById("updBar"); if(b){ b.textContent=`🆕 有新版 v${UPD_NEW}，點這裡更新`; b.classList.add("on"); } }
    }).catch(()=>{});
  }catch(e){}
}
function applyUpdate(){ if(!UPD_NEW) return; location.replace(location.pathname+"?v="+UPD_NEW); }
try{
  if(typeof document!=="undefined"&&document.addEventListener){
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkForUpdate(false); });
    if(typeof window!=="undefined"&&window.addEventListener) window.addEventListener("pageshow",()=>checkForUpdate(false));
    setTimeout(()=>checkForUpdate(true),1500);
  }
}catch(e){}

/* recordCred：夜末（宣告結算後）給每個有宣告的人記一筆
   min(1, 對那件的出價金額 ÷ 該件行情)，沒出價＝0；行情＝max(1,|it.p|)（詛咒品 p 為負）。
   「按占行情的比例加權」是為了堵「盯最便宜那件、出 1 塊錢養信譽」——同樣出 1，
   盯 p=6 的主標只拿 0.17，盯 p=2 的便宜貨才拿 0.5，而主標認真出價可以拿到接近 1。 */
function recordCred(){
  if(!CFG.MARK_CRED_ON||!CFG.MARK_ON||!S.marks) return;
  S.players.forEach(p=>{
    const m=S.marks[p.id]; if(!p.alive||m==null) return;
    const it=S.market[m]; if(!it) return;
    const am=S.wishNight&&S.wishNight.bidAmt&&S.wishNight.bidAmt[p.id];
    const amt=(am&&am[m])||0;
    const arr=(S.cred[p.id]=S.cred[p.id]||[]);
    arr.push(Math.min(1, amt/Math.max(1,Math.abs(it.p))));
    if(arr.length>CFG.MARK_CRED_WIN) arr.splice(0, arr.length-CFG.MARK_CRED_WIN);
  });
}
/* ================= 引擎 ================= */
/* 依座位表產生一位玩家。要加角色＝往 ROLES 填一筆、往 MODES 的 seats 排一格，不必動這裡。 */
/* ================= 異事引擎（正常頁／simulate／playPolicyGame 三條迴圈共用）=================
   EVENT_ON=false：makeState 不抽事件序、eventForRound 恆 null、全程零 S.rng() 消耗，
   trace 與加入前逐位元組相等（kill switch，同 WISH_ON 慣例）。 */
function eventForRound(r){
  if(!CFG.EVENT_ON||!S.eventOrder) return null;
  const i=CFG.EVENT_NIGHTS.indexOf(r);
  return (i>=0&&S.eventOrder[i])?EVENTS[S.eventOrder[i]]:null;
}
function eventCtx(ev){
  const ctx={ev, players:S.players.filter(p=>p.alive), choices:{}, events:[]};
  if(ev.prep) ev.prep(ctx);
  return ctx;
}
/* AI 依座位序消耗 S.rng()；humanToo=true（headless）時真人座位也走同一套 ai 啟發式 */
function fillEventChoices(ctx,humanToo){
  ctx.players.forEach(p=>{ if(p.ai||humanToo) ctx.choices[p.id]=ctx.ev.ai(p,ctx); });
}
function settleEvent(ctx,log){
  ctx.ev.settle(ctx);
  ctx.events.forEach(e=>log.push(e.txt));
  S.players.forEach(p=>{ if(p.alive&&p.life<=0){ p.alive=false; p.life=0; log.push(`💀 ${p.name} 沒能撐過「${ctx.ev.name}」，消失在妖市裡`); } });
}
/* 王船煞等「局末自動移除」道具：三條迴圈的終局各呼叫一次 */
function stripEndgameItems(){ S.players.forEach(p=>{ p.bag=p.bag.filter(x=>!x.endStrip); }); }
function runEventPhaseHeadless(){
  const ev=eventForRound(S.round); if(!ev) return null;
  const ctx=eventCtx(ev);
  fillEventChoices(ctx,true);
  const log=[];
  settleEvent(ctx,log);
  return {ev:ev.id, choices:{...ctx.choices}, log};
}
/* ================= 市集規則引擎（正常頁／simulate／playPolicyGame 三條迴圈共用）=================
   RULE_ON=false：makeState 不抽規則序、ruleForRound 恆 null、全程零 S.rng() 消耗，
   trace 與加入前逐位元組相等（kill switch，同 WISH_ON／EVENT_ON 慣例）。 */
/* 排程防呆（覆審 MEDIUM-2）：CFG 設錯時出聲，正常設定（RULE_NIGHTS=[3,7]）零輸出。
   同一則訊息只講一次，免得 runMany 跑幾千局時洗版。 */
const RULE_WARNED=new Set();
function checkRuleSchedule(){
  if(!CFG.RULE_ON) return;
  const warn=m=>{ if(RULE_WARNED.has(m)) return; RULE_WARNED.add(m); console.warn(m); };
  const clash=CFG.EVENT_ON?CFG.RULE_NIGHTS.filter(r=>CFG.EVENT_NIGHTS.indexOf(r)>=0):[];
  if(clash.length) warn(`[妖市] CFG.RULE_NIGHTS 與 CFG.EVENT_NIGHTS 撞夜：第 ${clash.join("／")} 夜——`
    +`那一夜會同時是異事夜與規則夜，兩則「夜市耳語」預告會擠在一起，排程請錯開`);
  const n=Object.keys(NIGHTRULES).length;
  if(CFG.RULE_NIGHTS.length>n) warn(`[妖市] CFG.RULE_NIGHTS 設了 ${CFG.RULE_NIGHTS.length} 夜，`
    +`但 NIGHTRULES 只有 ${n} 條——第 ${n+1} 個規則夜起會靜默失效（ruleForRound 恆回 null）`);
}
function ruleForRound(r){
  if(!CFG.RULE_ON||!S.ruleOrder) return null;
  const i=CFG.RULE_NIGHTS.indexOf(r);
  return (i>=0&&S.ruleOrder[i])?NIGHTRULES[S.ruleOrder[i]]:null;
}
/* 抽「第 r 夜」的市集：市集是前一夜就抽好的（S.nextMarket），所以 onMarketDraw 要看的是
   目標夜的規則、不是當下的 S.nightRule——暫時把目標夜的規則掛上去再抽，抽完還原。 */
function drawMarketFor(r){
  const prev=S.nightRule;
  S.nightRule=ruleForRound(r);
  const m=drawMarket(r);
  S.nightRule=prev;
  return m;
}
function mkPlayer(seat,i){
  const R=ROLES[seat.role];
  return {
    id:i, roleId:seat.role,
    name:seat.name||R.name, av:seat.av||R.av,
    /* seat.human=true ＝這一席由真人操作（選角模式下真人可用任何池角色；被動照常生效，
       onAi* hook 只在 aiBids 內觸發、真人天然不吃）。v0.5 遺留座位表沒有這個欄位＝照舊。 */
    ai:seat.human?null:(R.ai?{...R.ai}:null),
    life:roleLife0(R), bag:[], alive:true,
    /* ARCH_SPEC §4 的玩家欄位：本次只建欄位，尚未有內容會寫入它們 */
    wish:null, grudge:{}, spec:null, sacrificed:0, pawned:false,
  };
}
/* 選角模式的座位表：真人 humanN 席（picks 指定角色；缺的用 rng 從池中抽——headless 用），
   其餘席位由 rng 從剩下的池角色抽滿 4 席。抽取一律走傳入的種子化 rng（鐵則 2.3）。 */
function rosterSeats(md,picks,rng){
  const pool=Object.keys(ROLES).filter(k=>ROLES[k].pool);
  const humanN=md==="hotseat"?2:1;
  const pk=(picks?[...picks]:[]).filter(k=>ROLES[k]&&ROLES[k].pool).slice(0,humanN);
  while(pk.length<humanN){
    const avail=pool.filter(k=>!pk.includes(k));
    pk.push(avail[Math.floor(rng()*avail.length)]);
  }
  const rest=pool.filter(k=>!pk.includes(k));
  for(let i=rest.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
  const seats=pk.map((r,k)=>({role:r,human:true,
    ...(md==="hotseat"?{name:`玩家${["一","二"][k]}・${ROLES[r].name}`}:{})}));
  while(seats.length<4) seats.push({role:rest[seats.length-humanN]});
  return seats;
}
/* 只建狀態、不碰 DOM——讓 headless 模擬能重用同一份初始化。
   picks＝真人選的角色 id 陣列（solo 1 個、hotseat 2 個）；SELECT_ON=false 時忽略、走 MODES 寫死表。 */
function makeState(mode,seed,picks){
  const sd=(seed===undefined||seed===null)?(Date.now()>>>0):(seed>>>0);
  const md=mode||"solo";
  const rng=mulberry32(sd);
  /* 注意順序：選角抽取在牌堆洗牌之前消耗 rng（SELECT_ON=false 時零消耗，亂數流與 v0.5 相同） */
  const seats=SELECT_ON?rosterSeats(md,picks,rng):(MODES[md]||MODES.solo).seats;
  S={
    mode:md, round:1,
    seed:sd, rng, rngUi:mulberry32((sd^0x9e3779b9)>>>0),
    deck:null, cdeck:null,
    players:seats.map(mkPlayer),
    wonAny:new Set(), bidAny:new Set(), humanBids:{},
    /* lastWon：上一夜各家得標的陣營（青面攤主跟標用），每夜由 resolveAuction 覆蓋。
       （原本這裡還有 bidWinner 過渡全域，2026-09-03 已改成 onBidSettle 的 ctx.winner 欄位） */
    lastWon:{}, nightRule:null, event:null, bleedLog:[],
  };
  S.history={life:[S.players.map(p=>p.life)],nights:[]}; /* 局末回顧：純記錄（不耗亂數、不改結算），見 GUIDE §11.13 */
  /* 盯上信譽（§5.8）：S.cred[pid]＝最近 CFG.MARK_CRED_WIN 筆宣告分數。純記錄、不耗亂數；
     空陣列＝沒有紀錄＝信譽 1.0（credOf）。MARK_CRED_ON=false 時全程不會有人往裡面寫。 */
  S.cred={}; S.players.forEach(p=>{ S.cred[p.id]=[]; });
  S.deck=shuffle([...POOL,...POOL].map(x=>({...x})));
  S.cdeck=shuffle([...CURSES,...CURSES].map(x=>({...x})));
  /* 市集規則排程（RULE_ON=false 零 rng 消耗——kill switch）：洗牌決定各規則夜出哪一條。
     RULE_FORCE 只覆蓋抽到的結果、不省略洗牌，故「指定規則」與「隨機規則」的亂數流完全相同。 */
  checkRuleSchedule();
  S.ruleOrder=CFG.RULE_ON?shuffle(Object.keys(NIGHTRULES)).slice(0,CFG.RULE_NIGHTS.length):[];
  if(CFG.RULE_ON&&CFG.RULE_FORCE) S.ruleOrder=S.ruleOrder.map(()=>CFG.RULE_FORCE);
  S.market=drawMarketFor(1); S.nextMarket=drawMarketFor(2);
  /* 異事排程（EVENT_ON=false 零 rng 消耗——kill switch）：洗牌決定各觸發夜出哪樁異事 */
  S.eventOrder=CFG.EVENT_ON?shuffle(Object.keys(EVENTS)).slice(0,CFG.EVENT_NIGHTS.length):[];
  S.debts={}; /* 陰間放貸的跨夜還款排程（夜末攤還於 resolveBattles） */
  /* 《紙紮夜戰》活性統計（A9）：純記錄，不耗亂數、不改任何結算；PAPERWAR_ON=false 時全程不會有人往裡面寫 */
  S.pwStat={fights:0,burn:{},dmg:{},gang:0,splash:0,fear:0,lost:0,swap:0,bolt:0,bite:0,steal:0,regen:0,
    tr:{},beats:0,beatsReal:0,killed:0,burnSum:0,emptyBeats:0}; /* tr／beats 系列＝卷 D D-A9 的逐招活性與時間軸自檢 */
  return S;
}
function newGame(mode,seed,picks){
  makeState(mode,seed,picks);
  $("titleScr").style.display="none";
  $("table").classList.add("on");
  windStart(); /* 燈籠風聲環境音（純演出） */
  beginRound();
}
function drawMarket(forRound){
  const m=[]; const hasCurse=S.rng()<CFG.CURSE_PROB && S.cdeck.length;
  for(let i=0;i<CFG.MARKET-(hasCurse?1:0);i++){
    if(!S.deck.length) S.deck=shuffle([...POOL].map(x=>({...x})));
    m.push(S.deck.pop());
  }
  if(hasCurse) m.push(S.cdeck.pop());
  const ctx={market:shuffle(m),round:forRound===undefined?S.round:forRound};
  applyHooks("onMarketDraw",ctx,null); /* 全域 hook：只取 nightRule 與 event */
  return ctx.market;
}
function facCount(p,f){
  const ctx={p,faction:f,count:p.bag.filter(x=>!x.curse&&x.f===f).length};
  applyHooks("onFacCount",ctx,p);
  return ctx.count;
}
/* 逐件跑 onItemValue 加總 → 逐陣營跑 onFacCount 算共鳴 → 跑 onPowerCalc → 回傳。
   內部保留小數，四捨五入只在顯示層做（showPow）。 */
function power(p){
  let itemSum=0;
  for(const x of p.bag){
    const c={p,item:x,value:x.p};
    applyHooks("onItemValue",c,p);
    itemSum+=c.value;
  }
  let resonance=0;
  for(const f of FACTIONS){
    const c=facCount(p,f);
    if(c>=CFG.SET_MIN) resonance+=c*c;
  }
  const ctx={p,itemSum,resonance,flat:0,resonanceMul:1};
  applyHooks("onPowerCalc",ctx,p);
  return ctx.itemSum + ctx.resonance*ctx.resonanceMul + ctx.flat;
}
const showPow = p => Math.round(power(p));
/* 一輪出價總額上限（預設＝壽命） */
function budgetFor(p){
  const ctx={p,budget:p.life};
  applyHooks("onBudget",ctx,p);
  return ctx.budget;
}
function consCapFor(p){
  const ctx={p,cap:Math.max(1,Math.floor(p.life/CFG.CONS_CAP_DIV))};
  applyHooks("onBidCap",ctx,p);
  return ctx.cap;
}
/* AI 出價決策：五個 AI hook 的掛點（契約見 ARCH_SPEC §8）。
   這個函式只提供「所有 AI 共用的預設決策」與固定的呼叫順序；每隻 AI 的個性一律寫在
   ROLES 的 onAi* hook 裡。**這裡不得出現任何角色 id 的字串比對**——要加一隻有個性的
   AI，就往 ROLES 填一筆 hooks，不要回來改這個函式。 */
function aiBids(p){
  const bids=S.market.map(()=>null);
  const fullBudget=budgetFor(p);             /* 一輪出價總額上限（ARCH_SPEC §3.5） */
  const budget=Math.floor(fullBudget*CFG.AI_THROTTLE);  /* 計畫內出價的保守節流（預設決策自我約束；待辦 22 旋鈕） */
  let spent=0;
  /* 詛咒品攻防獨立出價，不跟法寶搶「前二」名額 */
  S.market.forEach((it,i)=>{
    if(!it.curse)return;
    const strongest=[...S.players].filter(q=>q.alive).sort((a,b)=>power(b)-power(a))[0];
    let intent=null,target=null;
    if(strongest.id===p.id && S.rng()<CFG.AI_DESTROY_P){
      intent="keep"; /* 買下銷毀自保 */
    }else if(S.rng()<p.ai.spite){
      const foes=S.players.filter(q=>q.alive&&q.id!==p.id);
      intent="poison"; target=foes.sort((a,b)=>power(b)-power(a))[0].id;
    }
    /* hook 8.5：角色可改寫詛咒品的意圖與目標（紅衣婆婆改鎖仇人、爐主改買下銷毀保人…） */
    const cc={p,item:it,intent,target};
    applyHooks("onAiCurse",cc,p);
    intent=cc.intent; target=cc.target;
    if(!intent)return;
    const amt=Math.min(3+rnd(0,2), budget-spent-CFG.BID_FEE, p.life-spent-1-CFG.BID_FEE);
    if(amt<=0)return;
    const type=amt>consCapFor(p)?"yaming":"cons";
    bids[i]={amt,type,intent,target};
    spent+=amt+CFG.BID_FEE; /* 掛號費一併入帳（BID_FEE=0 時與 v0.5 無差異） */
  });
  const opts=[];
  /* 卷 D D1：PAPERWAR_ON 時先量一次「我現在這袋對桌上其他人的邊際戰果」當基準，
     每件的估值＝加了它之後的戰果 − 這個基準（讀 unit 與對手袋子，不再只讀 it.p）。
     一夜只算一次基準與對手快照，逐件只多掃一次自己的袋子（runMany 10000 局仍跑得完）。 */
  let pwFoeBags=null, pwBase=0;
  if(CFG.PAPERWAR_ON){ pwFoeBags=pwFoeBagsOf(p); pwBase=pwTrialAvg(p.bag,pwFoeBags,S.round); }
  S.market.forEach((it,i)=>{
    if(it.curse)return;
    const c=p.bag.filter(x=>x.f===it.f).length;
    const marginal=(c+1>=CFG.SET_MIN)?(c+1)*(c+1)-(c>=CFG.SET_MIN?c*c:0):0;
    /* PAPERWAR_ON=false 走原式（A0 逐位元組相等的前提：同樣的加法、同樣的 rnd 呼叫位置） */
    let base;
    if(CFG.PAPERWAR_ON){
      const sWith=pwTrialAvg(p.bag.concat([it]),pwFoeBags,S.round);
      /* 分數差換成「這件大概幫我省下幾點壽命」：勝負是二元的，剩餘隻數差要先過一層 S 曲線，
         否則「本來就會贏」與「本來就會輸」的局面會把估值拉得跟實際效益脫節。 */
      const sig=x=>1/(1+Math.exp(-CFG.PW_AI_LOGIT*x));
      base=CFG.PW_AI_BASE+CFG.PW_AI_SCALE*CFG.PW_MAX*(sig(sWith)-sig(pwBase))+(it.ab?2:0);
    }else base=it.p+marginal+(it.ab?2:0);
    /* hook 8.1：角色可改寫「這件在我心中值多少」 */
    const vc={p,item:it,val:base+rnd(-2,2)};
    applyHooks("onAiValue",vc,p);
    /* 盯上反應（§5.8）：依角色分型對「被別人盯的拍品」調估值；自己盯的 +MARK_OWN（承諾——
       2026-09-03 虛張稅拿掉後，這一項也順便讓 AI 自己維持信譽：盯了就真的會去出價） */
    /* 信譽加權（2026-09-03）：把「幾個人盯」換成「盯的人加起來有多可信」。
       sum＝這些人的信譽總和；MARK_CRED_ON=false 時 sum 恆等於 k，
       於是 k*MARK_SCARE 與 MARK_CONTEST*(k/k) 都退化回原本那兩行（Y1 逐位元組相等的前提）。 */
    if(CFG.MARK_ON&&S.marks){
      const others=Object.keys(S.marks).filter(id=>+id!==p.id&&S.marks[id]===i);
      const k=others.length;
      const sum=CFG.MARK_CRED_ON?others.reduce((a,id)=>a+credOf(S.players[+id]),0):k;
      const mr=p.ai&&p.ai.markReact;
      if(k&&mr==="avoid") vc.val-=sum*CFG.MARK_SCARE;
      else if(k&&mr==="contest") vc.val+=CFG.MARK_CONTEST*(sum/k);
      if(S.marks[p.id]===i) vc.val+=CFG.MARK_OWN;
    }
    opts.push({i,val:vc.val,intent:"keep",target:null});
  });
  opts.sort((a,b)=>b.val-a.val);
  /* hook 8.2：這夜要標幾件、要不要整夜不出手 */
  /* 待辦 22：AI 預設「按兵不動」機率——AI_IDLE_P=0 時不呼叫 S.rng()，亂數序與加入前相同 */
  const plan={p,opts,maxPicks:2,skipAll:(CFG.AI_IDLE_P>0&&S.rng()<CFG.AI_IDLE_P)};
  /* skipAll 語意（覆審 MEDIUM-1）：「整夜完全不出價」要含詛咒品攻防與計畫外出價，
     否則收驚婆蟄伏夜 13% 仍下標、兩袖清風 AI 自毀心願。清掉前面已下的詛咒標並擋掉 extra。 */
  applyHooks("onAiPlan",plan,p);
  if(plan.skipAll){ bids.forEach((b,i)=>{bids[i]=null;}); spent=0; }
  if(!plan.skipAll) for(const o of plan.opts.slice(0,plan.maxPicks)){
    /* 自我限制在 CFG.MAX_BIDS 筆內（含上面詛咒品攻防那幾筆）——
       超出的標會被 resolveAuction 裁掉，出了等於白規劃 */
    if(CFG.MAX_BIDS>0 && bids.filter(b=>b&&b.amt>0).length>=CFG.MAX_BIDS) break;
    let amt=Math.max(0,Math.round(o.val*p.ai.aggr)+rnd(-1,1));
    amt=Math.min(amt,budget-spent-CFG.BID_FEE,p.life-spent-CFG.BID_FEE);
    if(amt<=0)continue;
    const cap=consCapFor(p);
    const type=(amt>cap||(o.val>8&&S.rng()<p.ai.aggr))?"yaming":"cons";
    /* hook 8.3：角色可改寫單筆金額與標書型態（紀律壓價、破戒梭哈、當鋪超額…） */
    const ac={p,item:S.market[o.i],val:o.val,amt,type};
    applyHooks("onAiAmount",ac,p);
    /* 硬底線只剩「一輪總額不得超過 budgetFor(p)」——角色可以突破 45% 節流，
       但不能突破 onBudget 算出來的總額（陰間當鋪要超額，就從 onBudget 把它加大） */
    const finalAmt=Math.max(0,Math.min(Math.floor(ac.amt),fullBudget-spent-CFG.BID_FEE));
    if(finalAmt<=0)continue;
    bids[o.i]={amt:finalAmt,type:ac.type,intent:o.intent,target:o.target};
    spent+=finalAmt+CFG.BID_FEE;
  }
  /* hook 8.4：計畫外的額外出價（虛張、攪局）。hook 自己要顧好 ctx.budget 上限。 */
  const ec={p,bids,market:S.market,spent,budget:fullBudget};
  if(!plan.skipAll) applyHooks("onAiExtraBids",ec,p);
  return bids;
}
/* 「戰力最高的活著對手」——收祟夜自動轉毒標與人類 UI 的預設對象共用同一份，避免兩邊漂移。
   選法與 aiBids 既有的 foes.sort((a,b)=>power(b)-power(a))[0] 相同（穩定排序，同分取座位序，零亂數消耗）。 */
function strongestFoe(pid){
  const foes=S.players.filter(q=>q.alive&&q.id!==pid);
  if(!foes.length) return null;
  return foes.sort((a,b)=>power(b)-power(a))[0];
}
/* 押寶夜（singleStake）的 headless 轉換：把「多筆自由拆分的出價」壓成規則要求的「一注多押」——
   勾選＝所有原本出過價的法寶、型態＝金額最大那筆的型態；詛咒品與毒標本夜不開標一併去掉。
   寫在引擎裡，aiBids() 與 POLICIES 的策略碼一個字都不用改。

   X 怎麼定（ARCH_SPEC §9 待辦 16，2026-09-02）：
   - **真人**在 UI 就已經封好一注（每個勾選格同一個 X），交卷時每筆帶 `stake:true` 進來——照原樣過，
     不加總、不夾上限，真人完全不受這一段影響。
   - **AI／策略**吐的是「多筆自由拆分的出價」，X＝原本那些出價裡「會被結算的那幾筆」的金額**總和**（不是最大那筆）。
     舊版取最大值等於「本來想花 3 筆的錢，現在只花 1 筆的錢壓 3 件」，分散型策略在押寶夜白撿一大截；
     改成加總才是「把原本要花的預算集中成一注」。之後過 onAiStake 讓角色可以再改寫，
     最後由引擎依型態夾上限（保守標＝consCapFor、押命標＝壽命−1），hook 改完也要過這道。 */
function toSingleStake(row,p){
  const act=row.map((b,i)=>({b,i}))
    .filter(x=>x.b&&x.b.amt>0&&!S.market[x.i].curse&&x.b.intent!=="poison");
  const out=S.market.map(()=>null);
  if(!act.length) return out;
  let best=act[0];
  for(const x of act) if(x.b.amt>best.b.amt) best=x; /* 同額取索引小者（穩定、不消耗亂數） */
  if(act.some(x=>x.b.stake)){                        /* 真人封好的一注：原樣過 */
    act.forEach(x=>{ out[x.i]={amt:best.b.amt,type:best.b.type,intent:"keep",target:null}; });
    return out;
  }
  /* hook 8.6 onAiStake：押寶夜的「這一注下多少、什麼型態、壓哪幾件」。
     ctx={p,picks,amt,type}；預設 amt＝會被結算的前 MAX_BIDS 筆總和（D1'）、type＝最大那筆、picks＝原本出過價的那幾格。
     這裡不得出現任何角色 id 比對（鐵則 2.4）——要改就往 ROLES 填一筆 onAiStake。 */
  /* X 的範圍（D1'，2026-09-02 使用者裁定甲）＝「在一般夜真的會進開標的那幾筆」的金額總和。
     押寶夜刻意不套 CFG.MAX_BIDS（勾幾件本來就不受限），所以加總前先照一般夜的規則挑出會被結算的
     前 N 筆——金額大者先、同額取索引小者（Array.sort 穩定，零亂數消耗）；MAX_BIDS=0（無上限）時全取。
     不先挑的話，會把「一般夜本來就會被裁掉、根本不會付錢」的那幾筆也算進 X，等於憑空放大 AI 的預算。
     **勾選集不受這一步影響**：被裁掉的那幾格仍然被這一注壓著，只是不計入 X。 */
  const paid=CFG.MAX_BIDS>0
    ? [...act].sort((x,y)=>y.b.amt-x.b.amt).slice(0,CFG.MAX_BIDS)
    : act;
  const ctx={p,picks:act.map(x=>x.i),amt:paid.reduce((n,x)=>n+x.b.amt,0),type:best.b.type};
  applyHooks("onAiStake",ctx,p);
  /* 型態上限夾（引擎硬底線）：保守標吃 consCapFor，押命標最多押到只剩 1 條命 */
  const cap=ctx.type==="cons"?consCapFor(p):Math.max(0,p.life-1);
  const amt=Math.max(0,Math.min(Math.floor(ctx.amt),cap));
  if(amt<=0) return out;
  ctx.picks.forEach(i=>{ if(out[i]!==undefined) out[i]={amt,type:ctx.type,intent:"keep",target:null}; });
  return out;
}
function resolveAuction(){
  /* 本夜市集規則（GAME_DESIGN §六之三 E）。三條迴圈在夜初都已設過一次，這裡再設一次是保險——
     讓「只呼叫 resolveAuction」的單元測試也走在完全相同的一條路上（A3 共用引擎）。 */
  S.nightRule=ruleForRound(S.round);
  S.ruleStat={extra:0,forced:0,multi:0,abstain:0,fallback:0}; /* 本夜規則活性計數（夜末 report 與模擬器統計用） */
  /* 本夜統計（心願判定用）：純記錄，不消耗亂數、不改任何結算數值。
     東窗血光改吃 extLoss（非自願失血：對決傷害＋詛咒侵蝕，2026-09-02 裁定），不再需要 startLife */
  S.wishNight={wonCount:{},wonFacs:{},
    yamingLost:{},poisonHit:{},totalBid:{},battleWin:new Set(),
    extLoss:{}, /* 非自願失血（對決傷害＋詛咒侵蝕），東窗血光的判準 */
    /* 第二批 16 張（v0.8）用的純記錄欄位：出價筆數／大貨得標／低價得標／押命得標／獨家得標／
       多人搶標得標／買下銷毀／毒標塞給了誰／對決造成的傷害。不耗亂數、不改結算數值 */
    bidCount:{},bigWin:{},cheapWin:{},yamingWon:{},soloWin:{},crowdWin:{},destroyed:{},poisonTargets:{},dmgDealt:{},
    bidItems:{}, /* 每人本夜出價過的拍品索引集合（虛張稅判定＋盯上活性統計） */
    bidAmt:{}};  /* 每人本夜對各件的出價金額 {pid:{索引:金額}}（盯上信譽記分用；純記錄、不改結算） */
  S.markStat={tax:0,markedItems:0,markedBids:0,unmarkedItems:0,unmarkedBids:0,hItems:0,hOthers:0}; /* hItems/hOthers＝真人出價的件數與其上他人的出價筆數（反事實活性量法） */ /* 盯上活性計數（純統計） */
  let all=S.players.map(p=>{
    if(!p.alive)return S.market.map(()=>null);
    if(!p.ai){
      const hb=S.humanBids[p.id]||[];
      return S.market.map((_,i)=>(hb[i]&&hb[i].amt>0)?{...hb[i]}:null);
    }
    return aiBids(p);
  });
  /* 市集規則的出價前置處理：引擎只認 flag、不認得是哪一條規則（鐵則 2.4）。
     統一攔在這裡＝AI 的 aiBids()、玩家 UI 與 POLICIES 策略碼都不必改，三條迴圈自動一致。 */
  const noDestroy=hasFlag(null,"noDestroy");
  const noCurse=hasFlag(null,"noCurseAuction");
  const single=hasFlag(null,"singleStake");
  if(noDestroy||noCurse) all.forEach((row,pid)=>S.market.forEach((it,i)=>{
    if(!it.curse||!row[i]) return;
    if(noCurse){ row[i]=null; return; }            /* 詛咒品整件不開標（押寶夜） */
    if(!noDestroy||row[i].intent==="poison") return; /* 毒標照舊 */
    /* 禁買下銷毀（收祟夜）：規格是「只能毒標塞給別人，或放著不管」——
       人類 UI 在 openSheet 就把意圖自動改成毒標，這裡對 AI／策略碼做同一件事，
       否則同一條禁令對人和對 AI 會是兩種語意（AI 的詛咒標憑空消失）。
       對象＝戰力最高的活著對手，與 aiBids 的既有選法一致，不消耗任何亂數。 */
    const foe=strongestFoe(pid);
    if(!foe){ row[i]=null; return; }               /* 沒有對手可塞才作廢 */
    row[i]={...row[i],intent:"poison",target:foe.id};
  }));
  if(single) all=all.map((row,pid)=>toSingleStake(row,S.players[pid]));
  /* 每夜出價件數上限（CFG.MAX_BIDS）：每人只保留金額最大的前 N 筆有效標，其餘作廢。
     排序決定性：金額大者先、同額取索引小者（Array.sort 為穩定排序，不消耗亂數）。
     一注多押的規則夜不套用——那一夜「勾幾件」本來就不受此限（費用只收一次，不會超額失血）。 */
  if(CFG.MAX_BIDS>0&&!single){
    all.forEach(row=>{
      row.map((b,i)=>({b,i})).filter(x=>x.b&&x.b.amt>0)
        .sort((a,b)=>b.b.amt-a.b.amt).slice(CFG.MAX_BIDS)
        .forEach(x=>{ row[x.i]=null; });
    });
  }
  const reveal=[];
  S.wonAny=new Set();
  S.bidAny=new Set(); /* 本輪（一夜）有實際出過價（amt>0）的玩家 id，供「整夜零出價」類被動查詢 */
  /* 本夜各家得標的陣營；整夜結束後才覆蓋 S.lastWon，所以 AI 出價時看到的一定是「上一夜」（ARCH_SPEC §4） */
  const lastWon={};
  /* 一注多押：同一注會出現在多件上，但費用只收一次——取「這個人最後一件押注」當唯一結算點，
     之前那幾件只參與比價、不收費（買路錢與落標費因此都只收一次）。 */
  const stakeLast={};
  if(single) all.forEach((row,pid)=>row.forEach((b,i)=>{ if(b) stakeLast[pid]=i; }));
  S.market.forEach((it,i)=>{
    const entries=[], withdrawn=[];
    S.players.forEach(p=>{const b=all[p.id][i];if(b){
      (S.wishNight.bidItems[p.id]=S.wishNight.bidItems[p.id]||new Set()).add(i); /* 純記錄：對第 i 件出過價 */
      (S.wishNight.bidAmt[p.id]=S.wishNight.bidAmt[p.id]||{})[i]=b.amt; /* 純記錄：金額（信譽記分用），與 bidItems 同一口徑 */
      /* 最多得一件：本夜已得標者自動退出其餘（不比價、不收費） */
      if(single&&S.wonAny.has(p.id)){ withdrawn.push({p,...b}); return; }
      const e={p,...b};
      /* 保守標上限的伺服端夾（ARCH_SPEC §9 待辦 20）：bump／flipType／ybBump／ybFlip 只在按鍵當下比對
         consCapFor，之後獻祭放血（doSacrifice）壓低壽命只重繪不重驗，會留下超上限的保守標——落標只付
         CONS_LOSE_FRAC 而不是押命標的一半。這裡用「結算當下的壽命」重算上限，超過就一律以押命標結算；
         UI 那層的夾只是提示。押寶夜的一注路徑走的是同一段（entries 由 all 展開而來），三條迴圈共用這一點。
         型態改了之後開標演出（showTypes）與押命標落標統計自然跟著改，因為兩者都讀這個 e.type。 */
      if(e.type==="cons"&&e.amt>consCapFor(p)) e.type="yaming";
      entries.push(e);S.bidAny.add(p.id);
    }});
    entries.filter(e=>!e.p.ai).forEach(h=>{ S.markStat.hItems++; S.markStat.hOthers+=entries.filter(e=>e.p.id!==h.p.id).length; }); /* 真人出價件上的他人出價數 */
    /* 被盯件只算「不是盯它的人」的出價（盯的人自己本來就會出價，算進去量不到反應）；但仍有選樣偏差，正式閘門用 hItems/hOthers 的反事實比較 */
    if(S.marks&&Object.keys(S.marks).some(id=>S.marks[id]===i)){ S.markStat.markedItems++; S.markStat.markedBids+=entries.filter(e=>S.marks[e.p.id]!==i).length; }
    else{ S.markStat.unmarkedItems++; S.markStat.unmarkedBids+=entries.length; }
    let winner=null, effs=[], top=null;
    if(entries.length){
      effs=entries.map(e=>{
        const c={p:e.p,bid:e,item:it,eff:e.amt};
        applyHooks("onBidEff",c,e.p);
        return c.eff;
      });
      top=Math.max(...effs);
      const tops=entries.filter((e,k)=>effs[k]===top);
      /* 平標決勝：風位優先 → 仍平則 S.rng() 決 */
      winner = tops.find(e=>e.p.id===windPid(S.round)) || tops[Math.floor(S.rng()*tops.length)];
    }
    if(single&&withdrawn.length&&withdrawn.some(w=>{
      /* 活性計數（純統計，不影響結算）：這一注要是沒退出，會不會也是本件的最高價 */
      const c={p:w.p,bid:w,item:it,eff:w.amt}; applyHooks("onBidEff",c,w.p);
      return top===null||c.eff>=top;
    })) S.ruleStat.multi++;
    const events=[];
    /* 本件拍品的得標者 id（沒人得標＝null），供 onBidSettle 期間查詢「被誰搶走」。
       2026-09-03（ARCH_SPEC §9 待辦 4）：原本走 S 上的過渡全域欄位，已改為 ctx 的
       additive 欄位——additive 加欄位不破壞既有 effect，且不必再讓讀取者知道有個全域。 */
    const bidWinnerId=winner?winner.p.id:null;
    entries.forEach(e=>{
      const isWinner=(e===winner);
      /* 一注多押：非得標者只在「最後一件」收一次費，之前那幾件只比價、實付 0 */
      if(single&&!isWinner&&stakeLast[e.p.id]!==i){ e.cost=0; return; }
      S.wishNight.totalBid[e.p.id]=(S.wishNight.totalBid[e.p.id]||0)+e.amt; /* 心願統計：本夜總出價 */
      S.wishNight.bidCount[e.p.id]=(S.wishNight.bidCount[e.p.id]||0)+1;    /* 心願統計：本夜有效出價筆數（孤注一擲） */
      /* nBids 為 additive 欄位（ARCH_SPEC §9 議題 1 核可的做法）：本件拍品的出價人數，
         供「唯一出價者」類被動查詢；既有 effect 都不讀它，行為不變。成本公式未動。 */
      /* 買路錢：盯上折抵（MARK_REBATE，預設 0＝與原本完全相同）。
         折抵只給「盯了這一件、而且真的對這一件出價」的人——盯 A 標 B 拿不到。 */
      const markedThis=CFG.MARK_ON&&CFG.MARK_REBATE>0&&S.marks&&S.marks[e.p.id]===i;
      const fee=Math.max(0,CFG.BID_FEE-(markedThis?CFG.MARK_REBATE:0));
      const c={p:e.p,bid:e,item:it,isWinner,
        cost:(isWinner?e.amt
          :(e.type==="yaming"?Math.ceil(e.amt/2):Math.ceil(e.amt*CFG.CONS_LOSE_FRAC)))+fee,
        events, nBids:entries.length, winner:bidWinnerId};
      applyHooks("onBidSettle",c,e.p);
      e.p.life-=c.cost;
      e.cost=c.cost; /* 供開標演出顯示實付（simulate 不序列化 entries，不影響 trace） */
    });
    /* 心願統計：押命標落標次數（在得標者確定後、不動結算本身） */
    entries.forEach(e=>{
      if(single&&stakeLast[e.p.id]!==i) return; /* 一注多押：一注只算一次落標 */
      if(e!==winner&&e.type==="yaming")
        S.wishNight.yamingLost[e.p.id]=(S.wishNight.yamingLost[e.p.id]||0)+1;
    });
    let outcome="流標";
    if(winner){
      S.wonAny.add(winner.p.id);
      S.wishNight.wonCount[winner.p.id]=(S.wishNight.wonCount[winner.p.id]||0)+1; /* 心願統計 */
      /* 心願統計（第二批）：獨家得標／多人搶標／押命標得標——只看本件的出價人數與得標標書型態 */
      if(entries.length===1) S.wishNight.soloWin[winner.p.id]=true;
      if(entries.length>=CFG.WISH_T2.crowdBids) S.wishNight.crowdWin[winner.p.id]=true;
      if(winner.type==="yaming") S.wishNight.yamingWon[winner.p.id]=true;
      lastWon[winner.p.id]=it.f;
      let target=null;
      if(winner.intent==="poison"){
        target=S.players[winner.target];
        target.bag.push(it);
        S.wishNight.poisonHit[winner.p.id]=true; /* 心願統計：毒標命中 */
        (S.wishNight.poisonTargets[winner.p.id]=S.wishNight.poisonTargets[winner.p.id]||[]).push(target.id); /* 禍水東引：塞給了誰 */
        outcome=`${winner.p.name} 毒標得手 → 塞進 ${target.name} 的袋子`;
      }else if(it.curse){
        S.wishNight.destroyed[winner.p.id]=true; /* 心願統計：買下銷毀（驅邪） */
        outcome=`${winner.p.name} 買下銷毀（自保）`;
      }else{
        winner.p.bag.push(it);
        (S.wishNight.wonFacs[winner.p.id]=S.wishNight.wonFacs[winner.p.id]||[]).push(it.f); /* 心願統計：入袋陣營 */
        if(it.p>=CFG.WISH_T2.bigfishP) S.wishNight.bigWin[winner.p.id]=true;      /* 一擲千金 */
        if(winner.amt<=CFG.WISH_T2.bargainAmt) S.wishNight.cheapWin[winner.p.id]=true; /* 撿漏 */
        outcome=`${winner.p.name} 入袋`;
      }
      /* 得標後的連鎖：得標者與被塞方的 effect 都要參與（去重後依序） */
      applyHooks("onWinItem",{winner:winner.p,item:it,target,events},[winner.p,target]);
    }
    reveal.push({it,entries,winner,outcome,events});
  });
  S.lastWon=lastWon; /* 整夜結算完才換上，明夜的 AI 才查得到「上一夜」 */
  recordAuction(reveal); /* 局末回顧：純記錄 */
  /* 本夜流標的詛咒品（無人得標＝無人毒標得手）：供市集規則的夜末後效取用；沒有規則時沒有人讀它 */
  S.unsoldCurses=reveal.filter(r=>!r.winner&&r.it.curse).map(r=>r.it);
  S.players.forEach(p=>{if(p.alive&&p.life<=0){p.alive=false;p.life=0;}});
  return reveal;
}
/* ================= 《紙紮夜戰》三拍自動戰引擎（卷 A，2026-09-03） =================
   規格：docs/proposals/2026-09-03-paper-war.md §2；驗收凍結 acceptance-paperwar-A.md。
   paperWar(A,B,ctx) 是純函式：只讀兩人的 bag 與 ctx（風位、月相、rng），不寫 S、不改玩家欄位；
   勝負與扣血算完後交回 resolveBattles 跑既有的 onBattle hooks（bow/shield/hairpin/nail…全部保留）。
   亂數紀律：只有雷女之火（天雷 15%）與虎爺印（反咬 15%）走 ctx.rng（＝S.rng），其餘零亂數；
   決定性：同種子同輸入同結果。CFG.PAPERWAR_ON=false 時本段一次都不會被呼叫。
   非疊加慣例：側面效果（先手／吸收／恐懼倍率／看穿／偷命／迷途／抓交替）一律取最大值一次，
   與 has() 的「同名法寶不疊加」同語意（GUIDE §2.5）；天雷／反咬是「每一隻紙紮自己的賭注」，逐隊擲。 */

/* 月相表：12 夜 ↔ assets/ui/night-indicator.svg 的 12 格。引擎與 #feltHead 同讀這一張（單一事實來源）。 */
const PHASES = {
  shuo :{id:"shuo", name:"朔月",icon:"🌑",fac:"yinqi"},
  shang:{id:"shang",name:"上弦",icon:"🌓",fac:"zuling"},
  wang :{id:"wang", name:"望月",icon:"🌕",fac:"xianghuo"},
  xia  :{id:"xia",  name:"下弦",icon:"🌗",fac:null},
};
/* 夜 1／12 朔月、2–5 上弦、6–8 望月、9–11 下弦（索引 0 不用） */
const PHASE_NIGHTS=[null,"shuo","shang","shang","shang","shang","wang","wang","wang","xia","xia","xia","shuo"];
function phaseFor(round){ return PHASES[PHASE_NIGHTS[(((((round|0)-1)%12)+12)%12)+1]]||PHASES.xia; }
/* 三拍對應的系別：一拍・撞＝祖靈、二拍・護＝香火、三拍・祟＝陰氣 */
const BEAT_FAC=["zuling","xianghuo","yinqi"];
const BEAT_NAME=["一拍・撞","二拍・護","三拍・祟"];
/* #feltHead 與戰報共用的月相字串（UI 與引擎不得各寫一份） */
function phaseText(round){
  const ph=phaseFor(round);
  /* 卷 D D3：月相改成該拍該系每隊 hp+1（原本 atk+1 對群體是乘數，A6 窮舉出現支配買法） */
  return `${ph.icon} ${ph.name}：${ph.fac?`${FAC[ph.fac].n}拍 hp+1`:"三拍無增幅"}`;
}

/* 袋子 → 紙紮陣。詛咒品不召喚、只記件數（每件讓本方前鋒全體 atk −1）；
   沒有任何可上場的紙紮（空袋／全詛咒）＝肉身 1 隻 atk1 hp3。 */
/* 沒有 unit 欄位的法寶（測試治具、卷 B 還沒配數值的新貨）：由 p 推一組預設紙紮，
   讓引擎對任何資料都跑得動——不必每加一件內容就回頭改引擎（鐵則 2.4 的同一個理由）。
   p≥6 推精英（貴貨＝一隻大妖），p<6 推護法身（便宜貨＝擋刀的紙人，不出手）。 */
function pwDefaultUnit(it){
  const p=Math.max(0,it.p|0);
  return p>=6?{body:"elite",count:1,atk:p+2,hp:p+2}:{body:"ward",count:1,atk:0,hp:p+5};
}
function buildArmy(bag){
  const teams=[]; let curses=0;
  for(const x of (bag||[])){
    if(x.curse){ curses++; continue; }
    const u=x.unit||pwDefaultUnit(x); if(!u) continue;
    /* ab＝這隊的 3D 模型鍵（接線卷；純資料，引擎不讀）：POOL 的 ab 是「能力」鍵，四件沒能力的法寶另用 m 指定檔名（凍結檔：balen/boartusk/ashcharm/yinyangcoin） */
    const t={idx:teams.length,fac:x.f,body:u.body,ab:x.ab||x.m||null,tr:(u.trait&&TRAITS[u.trait])||null,units:[]};
    for(let i=0;i<(u.count|0);i++)
      t.units.push({t:t.idx,body:u.body,atk:u.atk|0,hp:u.hp|0,max:u.hp|0,pend:0,alive:true});
    teams.push(t);
  }
  if(!teams.some(t=>t.units.length)){
    const t={idx:teams.length,fac:null,body:"swarm",ab:null,tr:null,units:[]};
    t.units.push({t:t.idx,body:"swarm",atk:1,hp:3,max:3,pend:0,alive:true});
    teams.push(t);
  }
  return {teams,curses};
}
function pwSide(p,tag){
  const a=buildArmy(p.bag);
  const units=[]; a.teams.forEach(t=>t.units.forEach(u=>units.push(u)));
  units.forEach((u,i)=>{ u.id=i; });
  return {p,tag:tag||"A",teams:a.teams,curses:a.curses,units,n0:units.length,burned:0,absorb:0,lost:-1,mod:0,wind:false,armorV:0};
}
/* 特性查詢：引擎只問「有沒有這個效果欄位」，不比對 trait id 字串（鐵則 2.4） */
const pwMax=(sd,k)=>{ let v=0; for(const t of sd.teams) if(t.tr&&t.tr[k]>v) v=t.tr[k]; return v; };
const pwAny=(sd,k)=>sd.teams.some(t=>t.tr&&t.tr[k]);
const pwAliveN=sd=>sd.units.reduce((n,u)=>n+(u.alive?1:0),0);
const pwHpSum=sd=>sd.units.reduce((s,u)=>s+(u.alive?u.hp:0),0);
const pwSwarmN=sd=>sd.units.reduce((n,u)=>n+(u.alive&&u.body==="swarm"?1:0),0);
const pwHasHaunt=sd=>sd.teams.some(t=>t.body==="haunt"&&t.units.some(u=>u.alive));
/* 前鋒＝會上場交鋒的紙紮（群體／精英／護法／肉身）；只有作祟站後陣不出手、不吃「前鋒」加成。
   卷 D：護法改成 atk 1 會出手（凍結檔 D2「只買護法不得再是 0%」），所以它也算前鋒。 */
const pwFront=u=>u.body!=="haunt";
/* 逐拍時間軸（卷 D D4，卷 C 演出用）：加欄位不動判定——這裡只 push 紀錄，不改任何 hp／alive／亂數。
   side＝行動方（burn 事件記的是「被燒的那一方」）；killed 只在 burn 事件為 true，
   所以 beats 的 killed 加總恆等於 burnedA+burnedB（D-A9 的斷言）。 */
function pwRec(env,beat,side,actor,target,kind,amount,killed,trId){
  if(!env.beats) return;
  const b={beat,side,actor,target,kind,amount:amount|0,killed:!!killed};
  if(trId) b.trId=trId; /* 只有 kind:"trait" 會帶，其餘事件的形狀一個位元組都沒變（D-A9 的斷言照舊） */
  env.beats.push(b);
}
/* 招式觸發：計數每次都記（活性統計），戰況 log 每場每招只印第一次（避免洗版）。
   卷 C1：同時往 beats 記一筆 {kind:"trait", trId}——加欄位不動判定（這裡只 push，
   不碰 hp／alive／亂數），演出層靠它把「哪件法寶出了哪一招」逐拍點名。
   sd＝擁有這個招的那一側（有些招是被動觸發、由對面的動作引起，side 要記招的主人）。 */
function pwFire(env,tr,msg,sd){
  if(!tr) return;
  env.stats.tr[tr.id]=(env.stats.tr[tr.id]||0)+1;
  pwRec(env,env.beat,sd?sd.tag:null,null,null,"trait",0,false,tr.id);
  if(!env.seen[tr.id]){ env.seen[tr.id]=1; if(msg) env.log.push(msg); }
}
function pwBurn(u,sd,env){
  if(!u.alive) return false;
  u.alive=false; u.hp=0; u.pend=0; sd.burned++;
  if(env) pwRec(env,env.beat,sd.tag,null,u.id,"burn",0,true);
  return true;
}
function pwLowest(sd,swarmOnly){
  let best=null;
  for(const u of sd.units){
    if(!u.alive) continue;
    if(swarmOnly&&u.body!=="swarm") continue;
    if(!best||u.hp<best.hp) best=u;
  }
  return best;
}
function pwMostHurt(sd){
  let best=null;
  for(const u of sd.units){
    if(!u.alive||u.hp>=u.max) continue;
    if(!best||(u.max-u.hp)>(best.max-best.hp)) best=u;
  }
  return best;
}
/* 目標：hp 最高者（扣掉本拍已分配的傷害），回傳前兩名（濺射用）。同值取先出現者。 */
function pwTopTwo(foe){
  let a=null,ar=0,b=null,br=0;
  for(const u of foe.units){
    if(!u.alive) continue;
    const rem=u.hp-u.pend; if(rem<=0) continue;
    if(!a||rem>ar){ b=a; br=ar; a=u; ar=rem; }
    else if(!b||rem>br){ b=u; br=rem; }
  }
  return [a,b];
}
/* 傷害入帳（送王船：吸收對面本拍首 N 點；陰陽眼銅錢 pierce 無視吸收；巴冷珠鍊 armor 每次受擊減傷） */
function pwDeal(tgt,foe,amt,env,pierce){
  if(amt<=0) return 0;
  if(foe.absorb>0&&!pierce){ const k=Math.min(foe.absorb,amt); foe.absorb-=k; amt-=k; }
  /* 琉璃護心：只護「珠鍊自己那一隊」，且每次受擊保底仍吃 1 點——
     全側減傷＋不保底的話，armor 1 對 atk 1 的群體＝完全免疫，一件 p6 就把「群體」從克制環裡刪掉
     （實測 D-A1 群體對精英 0%，全側版仍只回到 32.7%）。 */
  const at=foe.teams[tgt.t];
  if(at&&at.tr&&at.tr.armor>0&&amt>1&&at.armorBeat!==(env&&env.beat)){
    at.armorBeat=env&&env.beat;
    const k=Math.min(at.tr.armor,amt-1); amt-=k;
    if(env) pwFire(env,at.tr,`📿 琉璃護心：${foe.p.name} 本拍首次受擊 −${at.tr.armor}（保底 1）`,foe);
  }
  if(amt<=0) return 0;
  tgt.pend+=amt; return amt;
}
/* 一次攻擊：入帳後判定虎爺印反咬（賭注，走 rng） */
function pwStrike(att,sd,tgt,foe,amt,env,kind,pierce){
  const done=pwDeal(tgt,foe,amt,env,pierce);
  pwRec(env,env.beat,sd.tag,att?att.id:null,tgt.id,kind||"hit",done,false);
  const tt=foe.teams[tgt.t];
  if(tt.tr&&tt.tr.thorn&&att&&tt.thornBeat!==env.beat){ /* 獠牙反擊：每拍每隊只反一次（無亂數） */
    tt.thornBeat=env.beat;
    const th=pwDeal(att,sd,tt.tr.thorn|0,env,false);
    pwRec(env,env.beat,foe.tag,tgt.id,att.id,"thorn",th,false);
    pwFire(env,tt.tr,`🐗 獠牙反擊：反傷 ${tt.tr.thorn} 點`,foe);
  }
  if(tt.tr&&tt.tr.bite&&env.rng()<tt.tr.bite){
    const back=pwDeal(att,sd,tt.tr.biteDmg|0,env,false);
    pwRec(env,env.beat,foe.tag,tgt.id,att?att.id:null,"bite",back,false);
    env.stats.bite++; pwFire(env,tt.tr,`🐯 虎爺印反咬 ${tt.tr.biteDmg} 點`,foe);
  }
}
/* 該拍開場：回血 → 該系 ward 的靜態加成 → 月相 hp+1（卷 D D3）→ 割祭 → 算本拍的側面 atk 修正 */
function pwPrep(beat,fac,sd,env,phase){
  const rg=pwMax(sd,"regen");
  if(rg){
    const u=pwMostHurt(sd);
    if(u){ u.hp=Math.min(u.max,u.hp+rg); env.stats.regen++;
      pwFire(env,pwTrOf(sd,"regen"),`🕯️ 福壽綿長：${sd.p.name} 回 ${rg} hp`,sd); }
  }
  /* 護法的 hp 加成逐隊套用（買兩張就疊兩次）——沿用卷 A 的寫法，改成取最大值反而讓
     「只買護法」在 D-A6 出現支配買法（實測：非疊加版 5 夜紅、疊加版 0 夜紅）。 */
  for(const t of sd.teams){
    if(t.fac!==fac||!t.tr) continue;
    if(t.tr.hpFront){ let hit=0; for(const u of sd.units){ if(u.alive&&pwFront(u)){ u.max+=t.tr.hpFront; u.hp+=t.tr.hpFront; hit++; } }
      if(hit) pwFire(env,t.tr,`🛡️ 鱗紋護體：${sd.p.name} 前鋒 hp+${t.tr.hpFront}`,sd); }
    if(t.tr.hpAll){ let hit=0; for(const u of sd.units){ if(u.alive){ u.max+=t.tr.hpAll; u.hp+=t.tr.hpAll; hit++; } }
      if(hit) pwFire(env,t.tr,`⛰️ 山神庇佑：${sd.p.name} 全體 hp+${t.tr.hpAll}`,sd); }
    if(t.tr.hpFirst){ const u=sd.units.find(x=>x.alive&&pwFront(x));
      if(u){ u.max+=t.tr.hpFirst; u.hp+=t.tr.hpFirst; pwFire(env,t.tr,`🧧 香灰符：前鋒首隻 hp+${t.tr.hpFirst}`,sd); } }
  }
  /* 月相（卷 D D3，使用者裁定）：該拍該系每隊每隻 hp+1（原本是 atk+1，對群體是乘數而支配當夜） */
  if(phase&&phase.fac===fac){
    for(const t of sd.teams){ if(t.fac!==fac) continue; for(const u of t.units) if(u.alive){ u.max+=1; u.hp+=1; } }
  }
  /* 割祭（獻祭刀）：一拍自傷換全場 atk＋ */
  if(beat===1) for(const t of sd.teams){
    if(!t.tr||!t.tr.selfCut) continue;
    let cut=false;
    for(const u of t.units){ if(!u.alive) continue; u.hp=Math.max(1,u.hp-t.tr.selfCut); cut=true; }
    if(cut){ t.bonus=(t.bonus||0)+(t.tr.selfCutAtk|0);
      pwFire(env,t.tr,`🔪 割祭：${sd.p.name} 自傷 ${t.tr.selfCut} 換 atk+${t.tr.selfCutAtk}`,sd); }
  }
  /* 五方調兵（五營旗）：二拍本隊若已有折損，全體 hp+2（神將補位） */
  if(beat===2) for(const t of sd.teams){
    if(!t.tr||!t.tr.rallyHp) continue;
    if(!t.units.some(u=>!u.alive)) continue;
    for(const u of t.units) if(u.alive){ u.max+=t.tr.rallyHp; u.hp+=t.tr.rallyHp; }
    pwFire(env,t.tr,`🎏 五方調兵：${sd.p.name} 補位 hp+${t.tr.rallyHp}`,sd);
  }
  if(beat===2) sd.absorb=pwMax(sd,"absorb");
  if(beat===2&&sd.absorb) pwFire(env,pwTrOf(sd,"absorb"),`⛵ 送王船：吸收本拍首 ${sd.absorb} 點`,sd);
  let m=0;
  const k=sd.teams.filter(t=>t.fac===fac).length;   /* 同陣協同：同一拍出手的同系隊伍每多一隊 +1 */
  if(k>1) m+=k-1;
  if(beat===2){ const aa=pwMax(sd,"atkAll"); if(aa){ m+=aa;   /* 媽祖令旗：本方全體 atk+1 */
    pwFire(env,pwTrOf(sd,"atkAll"),`🚩 令旗改陣：${sd.p.name} 全體 atk+${aa}`,sd); } }
  if(beat===1&&sd.wind) m+=1;                       /* 風位方前鋒 atk+1（取代舊的 +3 戰力） */
  m-=sd.curses;                                     /* 詛咒纏身 */
  sd.mod=m;
}
/* 取本方第一個帶某效果欄位的 trait（純查表、供 log 標名字用） */
function pwTrOf(sd,k){ for(const t of sd.teams) if(t.tr&&t.tr[k]) return t.tr; return null; }
/* 一拍開場的賭注與首擊：雷女之火 15% 天雷燒掉對面 1 隻小兵；射日神弓直擊對面最壯的一隻 */
function pwBolt(sd,foe,env){
  for(const t of sd.teams){
    if(!t.tr||!t.units.some(u=>u.alive)) continue;
    if(t.tr.bolt&&env.rng()<t.tr.bolt){
      const v=pwLowest(foe,true);
      if(v){ pwRec(env,env.beat,sd.tag,null,v.id,"bolt",v.hp,false);
        if(pwBurn(v,foe,env)){ env.stats.bolt++; pwFire(env,t.tr,`⚡ 天雷燒掉 ${foe.p.name} 一隻小兵`,sd); } }
    }
    if(t.tr.openShot){
      const v=pwTopTwo(foe)[0];
      if(v){
        const n=t.tr.openShot|0;
        v.hp-=n; pwRec(env,env.beat,sd.tag,null,v.id,"openShot",n,false);
        pwFire(env,t.tr,`🏹 射日：${foe.p.name} 最壯的一隻 −${n}`,sd);
        if(v.hp<=0) pwBurn(v,foe,env);
      }
    }
  }
}
/* 三拍開場的作祟：迷途、抓交替（恐懼在 pwPass、偷命在勝負之後） */
function pwHaunt(sd,foe,env){
  if(pwAny(sd,"lost")){
    if(pwAny(foe,"immuneLost")){
      pwFire(env,pwTrOf(foe,"immuneLost"),`🔔 千里眼：${foe.p.name} 識破迷途`,foe);
    }else{
      let best=null,bn=0;
      for(const t of foe.teams){
        if(t.body!=="swarm") continue;              /* 迷途對精英無效 */
        const n=t.units.reduce((c,u)=>c+(u.alive?1:0),0);
        if(n>0&&n>bn){ best=t; bn=n; }
      }
      if(best){ foe.lost=best.idx; env.stats.lost++;
        pwFire(env,pwTrOf(sd,"lost"),`🎭 迷途：${foe.p.name} 一隊三拍不出手`,sd); }
    }
  }
  if(pwAny(sd,"swap")){
    const e=pwLowest(foe,true);
    if(e&&pwBurn(e,foe,env)){
      const m=pwLowest(sd,false); if(m) pwBurn(m,sd,env);
      env.stats.swap++; pwFire(env,pwTrOf(sd,"swap"),`💧 抓交替：兩邊各燒 1 隻`,sd);
    }
  }
}
/* 目標：hp 最低者（扣掉本拍已分配的傷害）——護法的補刀口徑（集中收割，與群體的分散、精英的濺射區隔） */
function pwLowRem(foe){
  let best=null,br=0;
  for(const u of foe.units){
    if(!u.alive) continue;
    const rem=u.hp-u.pend; if(rem<=0) continue;
    if(!best||rem<br){ best=u; br=rem; }
  }
  return best;
}
/* 一側出手一次（對面名冊在本拍開始時固定，傷害入 pend、拍末一起結算） */
function pwPass(sd,foe,beat,fac,phase,env){
  let fear=null;
  if(beat===3&&pwHasHaunt(foe)){
    fear={f:pwSwarmN(sd)*(pwMax(foe,"fearMul")||1),dread:pwMax(foe,"dread")};
    if(fear.f>0||fear.dread>0){ env.stats.fear++;
      if(fear.dread>0) pwFire(env,pwTrOf(foe,"dread"),`🌧️ 恐懼：${sd.p.name} 群體再 −${fear.dread} atk`,foe);
      if(pwMax(foe,"fearMul")>1) pwFire(env,pwTrOf(foe,"fearMul"),`🕳️ 過陰咒：恐懼加倍`,foe);
    }
  }
  const gang=1+pwMax(sd,"gang");                    /* 圍毆（椅仔姑看穿再 +1） */
  const seeTr=pwMax(sd,"gang")?pwTrOf(sd,"gang"):null;
  const hits=new Map();                             /* 集火計數：整側共用，跨隊也算同一目標 */
  for(const t of sd.teams){
    if(t.body==="haunt") continue;                  /* 作祟不攻擊（護法卷 D 起 atk 1，會出手） */
    if(beat===3&&sd.lost===t.idx) continue;         /* 迷途：這一隊三拍不出手 */
    const aliveT=t.units.reduce((c,u)=>c+(u.alive?1:0),0);
    for(const u of t.units){
      if(!u.alive) continue;
      let a=u.atk+sd.mod+(t.bonus||0);
      if(t.tr&&t.tr.lastStand&&aliveT===1){ a+=t.tr.lastStand; pwFire(env,t.tr,`🏴 殘旗插心：atk+${t.tr.lastStand}`,sd); }
      if(fear) a-=(u.body==="elite")?Math.floor(fear.f/2):(fear.f+fear.dread);
      if(a<=0) continue;
      const pierce=!!(t.tr&&t.tr.pierce);
      let t1,t2=null;
      if(t.body==="ward"){ t1=pwLowRem(foe); }
      else { const tt=pwTopTwo(foe); t1=tt[0]; t2=tt[1]; }
      if(!t1) return;                               /* 對面已無可打的目標 */
      let d=a;
      if(t.tr&&t.tr.vsSwarm&&t1.body==="swarm"){ d+=t.tr.vsSwarm; pwFire(env,t.tr,`💅 咬手指：對群體 +${t.tr.vsSwarm}`,sd); }
      if(t.tr&&t.tr.vsElite&&t1.body==="elite"){ d+=t.tr.vsElite; pwFire(env,t.tr,`🐗 獠牙衝撞：對精英 +${t.tr.vsElite}`,sd); }
      if(t.body==="swarm"){
        const k2=(hits.get(t1)||0)+1; hits.set(t1,k2);
        if(k2===2||k2===3){ d+=gang; env.stats.gang++;   /* 對同一目標第 2、3 次攻擊各 +1 */
          if(seeTr) pwFire(env,seeTr,`🪑 看穿：圍毆額外 +${pwMax(sd,"gang")}`,sd); }
      }
      if(pierce&&foe.absorb>0) pwFire(env,t.tr,`👁️ 陰陽眼：無視送王船的吸收`,sd);
      pwStrike(u,sd,t1,foe,d,env,t.body==="ward"?"ward":"hit",pierce);
      if(t.body==="elite"&&t2){
        const st=foe.teams[t2.t];
        const full=!!(t.tr&&t.tr.cleaveFull);
        if(full) pwFire(env,t.tr,`⚔️ 斬瘟：濺射全額`,sd);
        let sp=full?a:Math.floor(a/2);

function pwSettle(sd,env){

    if(u.pend>0){ u.hp-=u.pend; u.pend=0;
      if(u.hp<=0){ u.alive=false; u.hp=0; sd.burned++; if(env) pwRec(env,env.beat,sd.tag,null,u.id,"burn",0,true); } }

}
/* 拍末：飼鬼甕的餓鬼進食——對面本拍有紙紮被燒掉，本方全體 hp+1 */
function pwFeed(sd,foe,env,before){
  const f=pwMax(sd,"feed");
  if(!f||foe.burned<=before) return;
  for(const u of sd.units) if(u.alive){ u.max+=f; u.hp+=f; }
  pwFire(env,pwTrOf(sd,"feed"),`🏺 餓鬼進食：${sd.p.name} 全體 hp+${f}`,sd);
}
/* 一次交鋒：雙方同時結算；祖靈之眼（一拍先手）時該側先打、對面先燒完再還手 */
function pwClash(beat,fac,X,Y,phase,env){
  const bx=X.burned, by=Y.burned;
  const fx=(beat===1&&pwAny(X,"first")), fy=(beat===1&&pwAny(Y,"first"));
  if(fx&&!fy){ pwFire(env,pwTrOf(X,"first"),`👁️ 祖靈先手：${X.p.name} 先結算`,X);
    pwPass(X,Y,beat,fac,phase,env); pwSettle(Y,env); pwPass(Y,X,beat,fac,phase,env); pwSettle(X,env); }
  else if(fy&&!fx){ pwFire(env,pwTrOf(Y,"first"),`👁️ 祖靈先手：${Y.p.name} 先結算`,Y);
    pwPass(Y,X,beat,fac,phase,env); pwSettle(X,env); pwPass(X,Y,beat,fac,phase,env); pwSettle(Y,env); }
  else { pwPass(X,Y,beat,fac,phase,env); pwPass(Y,X,beat,fac,phase,env); pwSettle(X,env); pwSettle(Y,env); }
  pwFeed(X,Y,env,by); pwFeed(Y,X,env,bx);

/* 主入口：ctx={rng, phase（phaseFor 的一筆或 null）, windId（風位席位 id 或 null）} */
function paperWar(A,B,ctx){
  ctx=ctx||{};
  const rng=ctx.rng||(()=>0.5);
  const phase=ctx.phase||null;
  const windId=(ctx.windId===undefined)?null:ctx.windId;
  const X=pwSide(A,"A"), Y=pwSide(B,"B");
  X.wind=(windId!=null&&A.id===windId); Y.wind=(windId!=null&&B.id===windId);
  X.armorV=pwMax(X,"armor"); X.armorTr=pwTrOf(X,"armor");
  Y.armorV=pwMax(Y,"armor"); Y.armorTr=pwTrOf(Y,"armor");
  const env={rng,log:[],beats:[],seen:{},beat:0,
    stats:{gang:0,splash:0,fear:0,lost:0,swap:0,bolt:0,bite:0,steal:0,regen:0,tr:{}}};
  for(let beat=1;beat<=3;beat++){
    const fac=BEAT_FAC[beat-1];
    env.beat=beat;
    pwRec(env,beat,null,null,null,"beatStart",0,false); /* 拍首標記：卷 C 靠它切拍，也保證 beats 不會是空陣列 */
    X.absorb=0; Y.absorb=0; X.lost=-1; Y.lost=-1;
    pwPrep(beat,fac,X,env,phase); pwPrep(beat,fac,Y,env,phase);
    if(beat===1){ pwBolt(X,Y,env); pwBolt(Y,X,env); }
    if(beat===3){ pwHaunt(X,Y,env); pwHaunt(Y,X,env); }
    pwClash(beat,fac,X,Y,phase,env);
  }
  const aX=pwAliveN(X), aY=pwAliveN(Y), hX=pwHpSum(X), hY=pwHpSum(Y);
  /* 勝負：剩餘隻數 → 剩餘 hp 總和 → 風位優先 → 仍平＝沿用現行 tie 路徑（勢均力敵、互不失血）。
     最後一關刻意不擲 S.rng：驗收凍結檔同時要求「除了雷女／虎爺的 15%，引擎零亂數」，
     而 resolveBattles 現行的 tie 路徑本來就是「不分勝負、不扣血」，兩條合起來就是這裡的寫法。 */
  let win=null;
  if(aX!==aY) win=(aX>aY)?X:Y;
  else if(hX!==hY) win=(hX>hY)?X:Y;
  else if(X.wind) win=X;
  else if(Y.wind) win=Y;
  if(!win) return {
    winner:null, loser:null, dmg:0, tie:true,
    burnedA:X.burned, burnedB:Y.burned, unitsA:X.n0, unitsB:Y.n0,
    aliveA:aX, aliveB:aY, hpA:hX, hpB:hY, phase:phase?phase.id:null,
    log:env.log, stats:env.stats, beats:env.beats,
  };
  const lose=(win===X)?Y:X;
  /* 扣血：敗方燒掉比例 × PW_MAX，夾在 [PW_MIN, PW_MAX] */
  let dmg=Math.ceil((lose.n0?lose.burned/lose.n0:0)*CFG.PW_MAX);
  dmg=Math.max(CFG.PW_MIN,Math.min(CFG.PW_MAX,dmg));
  const steal=pwAny(win,"steal")?pwMax(win,"steal"):0;   /* 偷命：三拍結束時敗方另 −1 */
  if(steal){ dmg+=steal; env.stats.steal+=steal; pwFire(env,pwTrOf(win,"steal"),`🪡 偷命：${lose.p.name} 另 −${steal}`,win); }
  return {
    winner:win.p, loser:lose.p, dmg,
    burnedA:X.burned, burnedB:Y.burned, unitsA:X.n0, unitsB:Y.n0,
    aliveA:aX, aliveB:aY, hpA:hX, hpB:hY, phase:phase?phase.id:null,
    log:env.log, stats:env.stats, beats:env.beats,
  };
}
/* 閘門治具（A1／A2／A6）：用同一支引擎跑「兩個人造袋子」的一對一，回甲方勝率。
   引擎本身是決定性的，所以每個 seed 抽一組「夜份（決定月相）＋風位」當外部條件——
   那正是真實牌局裡這兩袋會遇到的條件空間；opt.round／opt.wind 可固定其中一項（A6 逐月相用）。
   opt.wind：undefined＝依 seed 抽（甲／乙／無／無，對應 4 人 2 場的風位分布）、null＝無風位、0/1＝固定。 */
function duelBags(bagA,bagB,seeds,opt){
  opt=opt||{};
  const list=Array.isArray(seeds)?seeds:Array.from({length:seeds||1000},(_,i)=>i+1);
  const A={id:0,name:"甲",bag:bagA}, B={id:1,name:"乙",bag:bagB};
  const stats={gang:0,splash:0,fear:0,lost:0,swap:0,bolt:0,bite:0,steal:0,regen:0};
  const dmgs={}, burns={}, trs={};
  let winA=0, winB=0, ties=0, beatsN=0, killedN=0, burnN=0, emptyBeats=0;
  for(const s of list){
    const rng=mulberry32(s>>>0);
    const round=opt.round||(1+Math.floor(rng()*CFG.ROUNDS));
    let wid;
    if(opt.wind===undefined){ const w=Math.floor(rng()*4); wid=(w===0)?0:(w===1?1:null); }
    else wid=opt.wind;
    const r=paperWar(A,B,{rng,phase:phaseFor(round),windId:wid});
    if(r.winner===A) winA++; else if(r.winner===B) winB++; else ties++;
    for(const k in stats) stats[k]+=r.stats[k]||0;
    for(const k in r.stats.tr) trs[k]=(trs[k]||0)+r.stats.tr[k];
    if(r.beats){ beatsN+=r.beats.length; if(!r.beats.length) emptyBeats++;
      killedN+=r.beats.reduce((s,b)=>s+(b.killed?1:0),0); burnN+=r.burnedA+r.burnedB; }
    dmgs[r.dmg]=(dmgs[r.dmg]||0)+1;
    burns[r.burnedA]=(burns[r.burnedA]||0)+1; burns[r.burnedB]=(burns[r.burnedB]||0)+1;
  }
  /* rateA＝甲勝／總場（平手算沒贏）；rateDecided＝甲勝／有勝負的場（不計平手，兩袋同歸於盡時用這個看三角） */
  return {n:list.length,winA,winB,ties,
    rateA:list.length?winA/list.length:0,
    rateDecided:(winA+winB)?winA/(winA+winB):0,
    stats,dmgs,burns,trs,beatsN,killedN,burnN,emptyBeats};
}
/* ===== 卷 D D1：AI 估值改讀「這件的紙紮對我這桌的邊際戰果」 =====

   新制比的是三拍後剩下幾隻，一件 p7 精英可能比三件便宜貨還能打——AI 用舊眼睛玩新制，當然崩。

   rng 固定 0.5（不動 S.rng、不改任何結算、不耗亂數），分數＝剩餘隻數差（＋很小的 hp 差當第二判準），
   與引擎的勝負判準同一把尺。試過的解析近似（把袋子壓成 n/atk/hp 三個數）會系統性高估作祟、低估精英，

   估值與實測勝率的相關性由 tests/tools/paperwar-gate-D.mjs 的 D-A7b 量（門檻 ≥0.6）。 */
function pwTrial(myBag,foeBag,round){
  const A={id:0,name:"我",bag:myBag}, B={id:1,name:"敵",bag:foeBag};
  const r=paperWar(A,B,{rng:()=>0.5,phase:phaseFor(round),windId:null});
  return (r.aliveA-r.aliveB)+0.02*(r.hpA-r.hpB);
}
/* 桌上其餘活人的袋子（AI 估值要讀對手，不只讀自己） */
function pwFoeBagsOf(p){ return S.players.filter(q=>q.alive&&q.id!==p.id).map(q=>q.bag); }
function pwTrialAvg(myBag,foeBags,round){
  if(!foeBags.length) return 0;
  let s=0; for(const b of foeBags) s+=pwTrial(myBag,b,round);
  return s/foeBags.length;
}
function pairings(ids,round){
  const list=[...ids]; if(list.length%2)list.push(null);
  const m=list.length; if(m<2)return{pairs:[],bye:ids[0]??null};
  const others=list.slice(1),r=round%(m-1);
  const rot=[list[0],...others.map((_,k)=>others[(k+r)%others.length])];
  const pairs=[];let bye=null;
  for(let k=0;k<m/2;k++){
    const a=rot[k],b=rot[m-1-k];
    if(a===null)bye=b;else if(b===null)bye=a;else pairs.push([a,b]);
  }
  return{pairs,bye};
}
function battlePower(p){ return power(p)+(p.id===windPid(S.round)?CFG.WIND_POWER:0); }
function resolveBattles(){
  const alive=S.players.filter(p=>p.alive).map(p=>p.id);
  const {pairs,bye}=pairings(alive,S.round-1);
  const fights=[];
  pairs.forEach(([a,b])=>{
    const A=S.players[a],B=S.players[b];
    const pa=battlePower(A),pb=battlePower(B);
    /* 《紙紮夜戰》：PAPERWAR_ON 時改由三拍自動戰決勝負與傷害，power() 只留給 UI 當行情顯示。
       其餘（onBattle hooks、心願統計、extLoss）全部照舊走下面同一條路。 */
    let war=null;
    if(CFG.PAPERWAR_ON){
      war=paperWar(A,B,{rng:S.rng,phase:phaseFor(S.round),windId:windPid(S.round)});
      if(S.pwStat){ /* 活性統計（A9）：純記錄 */
        const T=S.pwStat; T.fights++;
        T.burn[war.burnedA]=(T.burn[war.burnedA]||0)+1; T.burn[war.burnedB]=(T.burn[war.burnedB]||0)+1;
        T.dmg[war.dmg]=(T.dmg[war.dmg]||0)+1;

        /* 卷 D D-A9：逐招觸發次數（27 件法寶各一個招，每件都要 >0） */

        for(const k in war.stats.tr) T.tr[k]=(T.tr[k]||0)+war.stats.tr[k];
        T.beats=(T.beats||0)+(war.beats?war.beats.length:0);
        T.killed=(T.killed||0)+(war.beats?war.beats.reduce((s,b)=>s+(b.killed?1:0),0):0);
        T.burnSum=(T.burnSum||0)+war.burnedA+war.burnedB;
        /* 「beats 非空」要排掉 beatStart 拍首標記才有鑑別力：拍首標記每場必有 3 筆，
           拿它算非空＝這條在所有合法輸入下恆真（02 §6.1 第 6 條的恆真式）。
           這裡只數「排除 beatStart 之後仍為空」的場數＝整場零傷害零燒的對決。 */
        const real=war.beats?war.beats.filter(b=>b.kind!=="beatStart").length:0;

    const [w,l,pw,pl,pwRaw,plRaw]=aWin?[A,B,pa,pb,paRaw,pbRaw]:[B,A,pb,pa,pbRaw,paRaw];
    const extra=war?[...war.log]:[];
    const ctx={w,l,pw,pl,pwRaw,plRaw,extra,war,
      dmg:war?war.dmg:(CFG.DMG_BASE+Math.min(CFG.DMG_MAX,Math.floor((pw-pl)/CFG.DMG_DIV)))};

    l.life-=dmg;

    if(S.wishNight) S.wishNight.battleWin.add(w.id); /* 心願統計：本夜結算戰勝者 */
    if(S.wishNight) S.wishNight.dmgDealt[w.id]=(S.wishNight.dmgDealt[w.id]||0)+dmg; /* 心願統計：造成的傷害（大獲全勝） */

    const drain=p.bag.reduce((s,x)=>s+(x.drain||0),0);
    if(drain){
      p.life-=drain;nightly.push(`🩸 ${p.name} 受詛咒侵蝕 -${drain}`);
      if(S.wishNight) S.wishNight.extLoss[p.id]=(S.wishNight.extLoss[p.id]||0)+drain; /* 東窗血光：非自願失血 */

  /* 虛張稅（§5.8）：盯了卻對那件零出價 → 付 MARK_TAX。AI 與真人同規則；在心願判定之前 */
  if(CFG.MARK_ON&&S.marks&&CFG.MARK_TAX>0) S.players.forEach(p=>{

  if(CFG.NIGHT_REGEN>0){
    const back=S.players.filter(p=>p.alive&&p.life>0);
    back.forEach(p=>{ p.life+=CFG.NIGHT_REGEN; });
    if(back.length) nightly.push(`🌅 天明回血：存活者各 +${CFG.NIGHT_REGEN}`);
  }
  /* 異事後效（ARCH_SPEC §3.10 順序最後）：陰間放貸每夜攤還；身故勾銷；不計入東窗 extLoss（待辦14裁定） */
  if(S.debts) S.players.forEach(p=>{
    const d=S.debts[p.id];
    if(!d) return;
    if(!p.alive){ delete S.debts[p.id]; return; }
    const pay=Math.ceil(d.left/d.nights);
    p.life-=pay; d.left-=pay; d.nights--;

  applyHooks("onNightEndGlobal",{log:nightly},null);

  /* 本夜規則造成的差異，戰況裡明講一行（可理解性層慣例，§11.7） */
  if(S.nightRule&&S.nightRule.report&&S.ruleStat){

  const deaths=[];
  S.players.forEach(p=>{if(p.alive&&p.life<=0){p.alive=false;p.life=0;deaths.push(p);}});

  S.players.forEach(p=>{p.sacrificed=0;});

  const nxev=eventForRound(S.round+1);
  if(nxev) nightly.push(`🔮 夜市耳語——明夜「${nxev.name}」將至：${nxev.hint||""}`);

  const nxrl=ruleForRound(S.round+1);

/* ================= 局末回顧：純記錄層（三條迴圈共用；不耗亂數、不改任何結算；UI 只讀不寫） ================= */
function recordAuction(reveal){

function recordNightEnd(fights,bye,deaths){

function finalizeHistory(){
  if(!S.history) return;
  const L=S.history.life, cur=S.players.map(p=>p.life), last=L[L.length-1];

function reviewSummary(){
  const H=S.history||{life:[],nights:[]};
  let maxBid=null, poison=0, burned=0; const wins={}, poisonBy={};
  H.nights.forEach(n=>{
    n.auction.forEach(a=>{
      a.bids.forEach(b=>{ burned+=b.cost||0; if(!maxBid||b.amt>maxBid.amt) maxBid={pid:b.pid,amt:b.amt,item:a.item,round:n.round}; });

    });

function beginRound(){

function beginRoundCore(){

function startEventUI(ev){

function renderEventInput(p,done){

function bumpEvent(d){ EVAMT=Math.max(0,Math.min(EVCAP,EVAMT+d)); $("evAmt").textContent=EVAMT; }
function pickEventOpt(pid,v){ EVCTX.choices[pid]=v; const d=EVDONE; EVDONE=null; d(); }
function confirmEventNum(pid){ EVCTX.choices[pid]=EVAMT; const d=EVDONE; EVDONE=null; d(); }
function passEvent(pid){ EVCTX.choices[pid]=null; const d=EVDONE; EVDONE=null; d(); }
function revealEventUI(){

/* 盯上頁的對手提示（2026-09-03 試玩回饋「不知道怎麼判斷」）：把角色卡 ⓘ 裡的反應型搬到宣告當下，

const MARK_REACT_WORD={avoid:"怯場",contest:"搶標",ignore:"無視"};
function markHintHTML(ap){
  if(!CFG.MARK_ON) return "";
  const foes=S.players.filter(p=>p.ai&&p.alive);
  if(!foes.length) return "";
  const eff=CFG.MARK_CRED_ON?Math.round(credOf(ap)*100):100;
  const rows=foes.map(p=>{ const mr=(p.ai.markReact==="avoid"||p.ai.markReact==="contest")?p.ai.markReact:"ignore";
    return `<span class="who" title="${p.name}">${p.av}</span>${MARK_REACT_WORD[mr]}${mr!=="ignore"?`<b>${eff}%</b>`:""}`; });
  const nA=foes.filter(p=>p.ai.markReact==="avoid").length, nC=foes.filter(p=>p.ai.markReact==="contest").length;
  const tip=nA>nC?"怯場型多：盯你要的那件並認真出價，牠們會讓路"
           :nC>nA?"搶標型多：盯誘餌，真目標會便宜（花信譽）"
           :"各型都有：先看誰會跟你搶主標";
  return `<span class="aihint">${rows.join('<span class="sep">｜</span>')}<br>💡 ${tip}</span>`;
}
function pickMark(i){

/* 盯上信譽的顯示（公開資訊，§5.8）：角色卡 ⓘ 與盯上宣告畫面共用同一份文案，不各自寫一套。

/* 獻祭放血：只有持有 bloodlet flag（目前＝獻祭刀）的出價者看得到。

function renderBloodBtn(ap){
