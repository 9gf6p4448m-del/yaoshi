/* 押寶夜的「一注」輸入條（非押寶夜回空字串，其餘夜的出價流程完全不變） */
function stakeHTML(ap){
  if(!YB) return "";
  const cap=consCapFor(ap);
  const n=YB.pick.filter(Boolean).length;
  const fee=n>0?CFG.BID_FEE:0;
  const worst=n>0?Math.ceil(YB.amt*(YB.type==="yaming"?0.5:CFG.CONS_LOSE_FRAC))+fee:0;
  return `<div class="stakebar">
    <div class="stakerow">
      <span style="font-size:11px">🎲 <b style="color:var(--gold)">押寶夜</b>・今夜這一注</span>
      <div class="stepper"><button onclick="ybBump(-1)">−</button><span class="amt" id="ybAmt">${YB.amt}</span><button onclick="ybBump(1)">＋</button></div>
      <button class="typebtn${YB.type==="yaming"?" yaming":""}" onclick="ybFlip()">${YB.type==="cons"?"保守標":"押命標"}</button>
      <span class="mut" style="font-size:10.5px;text-align:left;line-height:1.35">已勾 <b style="color:var(--gold)">${n}</b> 件・勾幾件都同一個數字、<b>最多得一件</b>${YB.type==="cons"?`・上限 ${cap}`:""}<br>${n>0?`全落標最多失 ${worst}（含買路錢 ${fee}）`:"未勾任何拍品＝今夜不出手"}・詛咒品不開標</span>
    </div>
  </div>`;
}
function ybBump(d){
  YB.amt=Math.max(0,YB.amt+d);
  if(YB.type==="cons"&&YB.amt>consCapFor(S.players[ACTIVE])) YB.type="yaming";
  showMarket();

function ybFlip(){
  if(YB.type==="cons") YB.type="yaming";
  else{ YB.type="cons"; const cap=consCapFor(S.players[ACTIVE]); if(YB.amt>cap) YB.amt=cap; }

let sheetIdx=null, YB=null;
function openSheet(i){

  const noDest=it.curse&&noDestroyNight();
  /* 預設對象與引擎的自動轉毒標同一份選法（strongestFoe），玩家仍可自己改 */
  if(noDest&&b.intent!=="poison"&&foes.length){

    <div class="bidrow">

      </div>

      ${it.curse?`<select class="tgtsel" id="shTgt" onchange="setTgt()">
        ${noDest?"":`<option value="destroy">買下銷毀（自保）</option>`}
        ${foes.map(p=>`<option value="${p.id}">毒標塞給 ${DIRS[p.id]}家・${p.name}</option>`).join("")}
      </select>`:""}
    </div>
    <div class="capnote" id="shCap"></div>
    <button class="bigbtn" style="margin-top:10px;width:100%" onclick="closeSheet()">確定</button>`;
  if(it.curse){$("shTgt").value=b.intent==="poison"?String(b.target):"destroy";}
  paintSheet();

function bump(d){
  const b=myBids[sheetIdx];
  if(d>0&&b.amt===0&&CFG.MAX_BIDS>0
     &&myBids.filter((x,k)=>k!==sheetIdx&&x.amt>0).length>=CFG.MAX_BIDS){
    $("shCap").textContent=`本夜最多 ${CFG.MAX_BIDS} 筆有效標，已滿——要標這件，先把另一件歸零`;
    return;
  }
  b.amt=Math.max(0,b.amt+d);
  if(b.type==="cons"&&b.amt>consCapFor(S.players[ACTIVE]))b.type="yaming";
  paintSheet();updateBudget();
}
function flipType(){
  const b=myBids[sheetIdx];
  if(b.type==="cons")b.type="yaming";
  else{b.type="cons";const cap=consCapFor(S.players[ACTIVE]);if(b.amt>cap)b.amt=cap;}
  paintSheet();updateBudget();
}
function setTgt(){
  const v=$("shTgt").value,b=myBids[sheetIdx];
  if(v==="destroy"){b.intent="keep";b.target=null;}else{b.intent="poison";b.target=+v;}
}
function paintSheet(){
  const b=myBids[sheetIdx];
  $("shAmt").textContent=b.amt;

  t.textContent=b.type==="cons"?"保守標":"押命標";
  t.className="typebtn"+(b.type==="yaming"?" yaming":"");

  const feeTxt=CFG.BID_FEE>0?`每筆有效標另付買路錢 ${CFG.BID_FEE} 壽命（不論輸贏）。`:"";
  const slotTxt=CFG.MAX_BIDS>0?`本夜有效標 ${nb}/${CFG.MAX_BIDS} 筆。`:"";
  /* 規則夜可換掉落標說明（落魄夜＝全額扣除）；沒有規則就照平常的兩句 */
  const ruleLose=(S.nightRule&&S.nightRule.sheetLose)?S.nightRule.sheetLose():null;
  const loseTxt=ruleLose||(CFG.CONS_LOSE_FRAC>0
    ?`落標退還 ${Math.round((1-CFG.CONS_LOSE_FRAC)*100)}%（付 ${Math.round(CFG.CONS_LOSE_FRAC*100)}%）`
    :"落標全額退還");
  $("shCap").textContent=b.type==="cons"
    ?`保守標：${loseTxt}，上限 ${consCapFor(S.players[ACTIVE])}。${feeTxt}${slotTxt}`
    :`押命標：無上限，${ruleLose||"落標仍失一半出價"}。${feeTxt}${slotTxt}`;
}
function closeSheet(){

function updateBudget(){
  const ap=S.players[ACTIVE];
  if(YB){ /* 押寶夜：一注只算一次，買路錢也只收一次 */
    const n=YB.pick.filter(Boolean).length;
    const tot=n>0?YB.amt+CFG.BID_FEE:0;
    const cap=budgetFor(ap);
    const el=$("budget");
    el.innerHTML=`${S.mode==="hotseat"?DIRS[ACTIVE]+"家 ":""}這一注合計 <b>${tot}</b>${n>0&&CFG.BID_FEE>0?`（含買路錢 ${CFG.BID_FEE}）`:""} ／ 壽命 ${ap.life}${S.debts&&S.debts[ap.id]?`<span style="color:#ff8484">（欠${S.debts[ap.id].left}）</span>`:""}　🎲 已勾 ${n} 件`;
    el.className=tot>cap?"over":"";
    $("mainbtn").disabled=tot>cap;
    return;
  }
  const nb=myBids.filter(b=>b.amt>0).length;
  const fees=nb*CFG.BID_FEE;
  const tot=myBids.reduce((s,b)=>s+b.amt,0)+fees;
  const el=$("budget");
  const cap=budgetFor(ap);
  el.innerHTML=`${S.mode==="hotseat"?DIRS[ACTIVE]+"家 ":""}出價合計 <b>${tot}</b>${fees>0?`（含買路錢 ${fees}）`:""} ／ 壽命 ${ap.life}${S.debts&&S.debts[ap.id]?`<span style="color:#ff8484">（欠${S.debts[ap.id].left}）</span>`:""}${CFG.MAX_BIDS>0?`　🏷 本夜標 ${nb}/${CFG.MAX_BIDS}`:""}`;
  el.className=tot>cap?"over":"";
  $("mainbtn").disabled=tot>cap;
}
function submitHumanBids(){
  hideBloodBtn();   /* 交卷後不再是出價階段，底部列的放血鈕收起來 */
  /* 押寶夜：交卷時才把「一注 X ＋ 勾選」展開成引擎吃的 bids 形狀（同一個 X 出現在每件勾選上） */
  if(YB) myBids=S.market.map((it,i)=>
    /* stake:true＝「這一列是真人在 UI 已經封好的一注」，toSingleStake 看到它就不加總、不夾上限 */
    (YB.pick[i]&&YB.amt>0&&!it.curse)?{amt:YB.amt,type:YB.type,intent:"keep",target:null,stake:true}
                                     :{amt:0,type:YB.type,intent:"keep",target:null,stake:true});
  S.humanBids[ACTIVE]=myBids;
  const hs=aliveHumans();

/* ================= 開標演出 ================= */
function startRevealDirect(){ startReveal(); }
async function startReveal(){
  $("mainbtn").disabled=true;
  SKIP=false;$("skipbtn").style.display="block";
  const reveal=resolveAuction();
  /* 開標渲染的可視程度交給 hook 決定。showTypes 預設 false（ARCH_SPEC §9 待辦 8：
     標書型態改為隱藏資訊，只有普渡爐主的 onReveal 會打開它）。
     viewer 傳「活著的真人」陣列：solo＝[南家]（與舊行為等價）；熱座＝兩位真人共看同一畫面，
     任一位是爐主就顯示（同機同螢幕本來就藏不住，取聯集是誠實解——限制記錄於 roles-report.md）。 */
  const rv={reveal,viewerId:0,showEntries:true,showTypes:false};
  applyHooks("onReveal",rv,aliveHumans());
  /* 落標實付的註記文字：規則夜可用 loseLabel 換掉（如落魄夜的「落標全付」），引擎不寫規則 id */
  const loseLbl=(S.nightRule&&S.nightRule.loseLabel)||"落標費";
  const stage=$("stage");
  if(S.bleedLog&&S.bleedLog.length){
    renderSeats();
    stage.innerHTML=`<div class="stageCard">${S.bleedLog.map(t=>`<div class="big" style="font-size:16px">${t}</div>`).join("")}</div>`;
    await sleep(CFG.T*1.4);
  }
  /* 開標前公告（2026-09-02 使用者裁定，回應「開標沒驚喜」）：先亮各件「幾人出價」再逐件開——
     密封標不變、金額不揭，但開之前有東西可猜可推。純呈現層，不動結算。 */
  const nBid=r=>r.entries.length?`${r.entries.length} 人出價`:"無人出價";
  const meIn=r=>(S.mode!=="hotseat"&&r.entries.some(e=>!e.p.ai))?`<span class="mut" style="font-size:10px">（含你）</span>`:"";
  if(rv.showEntries){
    renderSeats();
    stage.innerHTML=`<div class="stageCard" style="max-width:460px"><div class="big">🔔 開標前公告・各件出價人數</div>
      ${rv.reveal.map((r,i)=>`<div class="bidfly" style="animation:none"><span>${r.it.n}${r.it.curse?" 🕸":""}${markBadgeHTML(i)}</span><span>${nBid(r)}${meIn(r)}</span></div>`).join("")}
    </div>`;
    await waitMain("開標 ▸");
  }
  sfx("gong",{rnd:S.rngUi()}); /* 開市鑼 */
  for(const r of rv.reveal){
    renderSeats();
    veil(true); await sleep(450); /* 開標揭曉①：先黑幕，燈籠再亮（art-integration-guide §5.1） */
    stage.innerHTML=`<div class="stageCard anim-lantern-reveal" id="revealCard">
      <div class="big">${itemIcoInline(r.it)}${r.it.n}<span class="fchip ${FAC[r.it.f].cls}">${FAC[r.it.f].n}</span>
      <span class="mut" style="font-size:11px">　${r.it.ab?("✦ "+abDesc(r.it.ab)):r.it.d}</span></div>
      <div class="mut" style="font-size:12px">${rv.showEntries?nBid(r):""}</div>
      <div id="flyzone"></div><div id="outzone"></div>
    </div>`;
    veil(false);
    await sleep(CFG.T*0.8);
    const fz=$("flyzone");
    if(!rv.showEntries){
      fz.innerHTML=`<div class="bidfly"><span>出價已被遮蔽</span><span>—</span></div>`;
      await sleep(CFG.T*0.7);
    }else if(!r.entries.length){
      fz.innerHTML=`<div class="bidfly"><span>無人出價</span><span>—</span></div>`;
      await sleep(CFG.T*0.7);
    }else{
      const ordered=[...r.entries].sort((a,b)=>a.amt-b.amt);
      for(const e of ordered){
        fz.insertAdjacentHTML("beforeend",
          `<div class="bidfly ${e===r.winner?"win":""}"><span><img class="bico" src="assets/ui/bid-token.svg" alt="">${DIRS[e.p.id]}家・${e.p.name}${e.intent==="poison"?" 🕸毒標":""}</span><span>${e.amt} 壽命${rv.showTypes&&e.type==="yaming"?"・押命":""}${
            /* 實付顯示規則（2026-09-02 對抗覆審 HIGH-1/2）：
               得標者一律顯示——得標實付=出價+掛號費，兩種型態同式，不洩漏標書型態；
               落標者的實付兩型態算式不同（25% vs 50%），會被反推型態、廢掉普渡爐主的被動，
               故只在「這筆是真人自己的」或 viewer 有 showTypes 權限（爐主）時顯示。 */
            (e.cost>0&&(e===r.winner||!e.p.ai||rv.showTypes))?`・實付 ${e.cost}${(!e.p.ai)?`<span class="mut" style="font-size:10px">（${e===r.winner?"出價":loseLbl}${CFG.BID_FEE>0?"＋買路錢":""}）</span>`:""}`:""
          }</span></div>`);
        await sleep(CFG.T*0.65);
      }
    }
    $("outzone").innerHTML=`<div class="outcome">${r.outcome}</div>`;
    /* 險勝／惜敗（真人牽涉、差距 ≤1 才打）：讓「差一點」被看見，密封標的驚喜點就在這一行 */
    if(r.winner&&r.entries.length>=2&&rv.showEntries){
      const byAmt=[...r.entries].sort((a,b)=>b.amt-a.amt);
      const second=byAmt.find(e=>e!==r.winner);
      const margin=r.winner.amt-second.amt;
      const who=p=>(!p.ai&&S.mode!=="hotseat")?"你":p.name;
      if(margin<=1&&(!r.winner.p.ai||!second.p.ai)){
        const txt=margin===0?`⚖ 平標！${who(r.winner.p)}靠風位／籤運壓過 ${who(second.p)}`
          :(!r.winner.p.ai?`⚡ 險勝！只比 ${second.p.name} 多 1 壽命`:`💢 惜敗！${who(second.p)}只差 1 壽命`);
        $("outzone").insertAdjacentHTML("beforeend",`<div class="outcome">${txt}</div>`);
        await sleep(CFG.T*0.5);
      }
    }
    if(r.winner){
      sfx("bell",{rnd:S.rngUi()});
      /* 得標：拍品卡打燈籠光（art-integration-guide §5.1，與 bell 同一刻）。
         純 class，下一件拍品重畫 stage 時自然清掉 */
      const rc=$("revealCard"); if(rc) rc.classList.add("card-glow");
      sayFrom(r.winner.p.id, r.winner.intent==="poison"?"poison":"win");
      const losers=r.entries.filter(e=>e!==r.winner);
      if(losers.length&&!r.winner.p.ai)sayFrom(losers[0].p.id,"lose");
      if(r.winner.intent==="poison")sayFrom(r.winner.target,"poisoned");
    }
    for(const ev of r.events){
      /* 型態洩漏事件（typeLeak）按實付同規則過濾：真人的、或 viewer 有 showTypes（爐主）才顯示（覆核 F1） */
      if(ev.typeLeak && ev.pid!==undefined && S.players[ev.pid].ai && !rv.showTypes) continue;
      $("outzone").insertAdjacentHTML("beforeend",`<div class="outcome">${ev.txt}</div>`);
      await sleep(CFG.T*0.6);
    }
    renderSeats();
    revealGlow(r); /* 開標揭曉③④：得標者燈籠光、落標者壓暗（純 class，下一次 renderSeats 自然清掉） */
    /* 手動節奏：看夠了才按下一件（跳過中不停） */
    if(r!==rv.reveal[rv.reveal.length-1]) await waitMain("下一件拍品 ▸");
    else await sleep(CFG.T*0.8);
  }
  /* 本夜成交總覽 */
  SKIP=false;
  renderSeats();
  $("stage").innerHTML=`<div class="stageCard" style="max-width:460px">
    <div class="big">🏮 本夜成交總覽</div>
    ${rv.reveal.map(r=>`<div class="bidfly" style="animation:none"><span>${r.it.n}${r.it.curse?" 🕸":""}</span><span>${r.outcome}${r.winner?`（${r.winner.amt}${r.winner.cost!==undefined&&r.winner.cost!==r.winner.amt?`・實付 ${r.winner.cost}`:""}）`:""}</span></div>`).join("")}
  </div>`;
  $("mainbtn").textContent="開戰";
  $("mainbtn").disabled=false;
  $("mainbtn").onclick=startBattle;
  $("skipbtn").style.display="none";
}

    fxPunch(pw);                           /* 鏡頭撞進去再回位 */
    fxImpact(null,fxFacOf(f.w),pw);        /* 命中點噴火星，顏色取勝方主系 */
    fxLunge(f.w.id,f.l.id,pw);             /* 3D 人形：勝方前撞、敗方後仰 */

    const loserEl=f.l===f.A?$("dL"):$("dR");

    loserEl.classList.add("shake");
    loserEl.style.opacity=".55";
    sfx("hurt",{rnd:S.rngUi()});
    $("duelResult").innerHTML=`${f.w.name} 勝！<span class="dmg anim-stamp-in">${f.l.name} −${f.dmg} 壽命</span>`;
    const dd=Math.round(Math.abs(f.pa-f.pb));
    const base=CFG.DMG_BASE+Math.min(CFG.DMG_MAX,Math.floor(dd/CFG.DMG_DIV));
    const fml=base===f.dmg?`戰力差 ${dd} → 傷害 ${CFG.DMG_BASE}＋${f.dmg-CFG.DMG_BASE}＝${f.dmg}`:`戰力差 ${dd} → 公式傷害 ${base}、實際 ${f.dmg}（能力調整）`;
    $("duelSub").innerHTML=fml+(f.extra.length?`　${f.extra.join("　")}`:"");
    await sleep(CFG.T*1.6);

  ov.style.display="none";
}
async function startBattle(){

  const burnTxt=f=>{ if(!f.war) return ""; const lA=f.l===f.A;

    if(f.war&&f.extra&&f.extra.length)

      <div class="rnm">${R.name}</div>
      <div class="rlf">壽命 ${roleLife0(R)}${taken?"・已被選":""}</div>
    </div>`;
  }).join("");
  const R=SEL.cur?ROLES[SEL.cur]:null;
  /* desc 慣例「X流（起始N）。被動：…。AI 時…」的分句／過濾邏輯抽成 roleDescHTML()，
     座位卡「ⓘ」鈕重用同一支，不得各自複製一份（2026-09-02 試玩回饋） */
  $("selDesc").innerHTML=R?roleDescHTML(SEL.cur,false):"點一個角色，看被動與起始壽命";
  $("selBtn").disabled=!R;
  $("selBtn").textContent=SEL.mode==="hotseat"&&SEL.picks.length===0?"確定，換玩家二":"入市";
}
function pickRole(k){
  if(SEL.picks.includes(k)) return;
  SEL.cur=k;
  renderSelect();
}
function confirmRole(){
  if(!SEL.cur) return;
  SEL.picks.push(SEL.cur);
  SEL.cur=null;
  if(SEL.mode==="hotseat"&&SEL.picks.length<2){ renderSelect(); return; }
  $("selectScr").classList.remove("on");
  newGame(SEL.mode,FX_SEED,SEL.picks); /* FX_SEED 只在 ?fxcount=1&seed=N 的治具頁有值，正式頁恆為 undefined（卷 C3 T-6 逐場比對） */
}
/* ================= 測試出口：headless 模擬（不碰 DOM） ================= */
/* 固定腳本策略：每夜對 market 中 p 值最高的一件出保守標，金額 = min(保守標上限, 5)，
   不下毒標、不買銷毀。用途是把對局變成完全決定性，供重構前後逐項比對。 */
function scriptedBids(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  let bi=0;
  for(let i=1;i<S.market.length;i++) if(S.market[i].p>S.market[bi].p) bi=i;
  bids[bi]={amt:Math.min(consCapFor(p),5),type:"cons",intent:"keep",target:null};
  return bids;
}
/* ================= 平衡模擬器：可插拔策略（給 runMany 用，不影響 simulate/scriptedBids 既有行為） =================
   每個策略都是 (p)=>bids 的純函式，bids 形狀與 scriptedBids 相同：長度＝S.market.length 的陣列，
   每格 null 或 {amt,type,intent,target}。三者只讀 S.market／consCapFor 等既有唯讀狀態，不寫入任何全域。 */
function policyGreedy(p){ return scriptedBids(p); } /* 標 p 值最高者，複用既有腳本策略 */
function policyHoarder(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const candidates=[];
  S.market.forEach((it,i)=>{ if(!it.curse && it.p>=6) candidates.push(i); });
  if(!candidates.length) return bids; /* 沒有大貨，零出價 */
  let bi=candidates[0];
  for(const i of candidates) if(S.market[i].p>S.market[bi].p) bi=i;
  const cap=consCapFor(p);
  const want=S.market[bi].p+3;
  if(want<=cap){ bids[bi]={amt:want,type:"cons",intent:"keep",target:null}; }
  else{ const amt=Math.min(want,Math.max(1,p.life-1)); bids[bi]={amt,type:"yaming",intent:"keep",target:null}; }
  return bids;
}
function policySplitter(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const cap=consCapFor(p);
  const amt=Math.max(1,Math.min(2,cap));
  const order=S.market.map((_,i)=>i).sort((a,b)=>S.market[b].p-S.market[a].p);
  order.slice(0,Math.min(3,order.length)).forEach(i=>{ bids[i]={amt,type:"cons",intent:"keep",target:null}; });
  return bids;
}
/* 把任一策略包成「先放血再出價」——用來窮舉獻祭刀的最佳用法（keep 越低＝越敢壓命）。
   放血發生在出價之前，所以會同步壓縮該夜預算（預算＝壽命），代價是真的。 */
function withBleed(baseFn,keep,k){
  const f=p=>{ bleed(p,keep,k); return baseFn(p); };
  f.bleedParams={keep,k};
  return f;
}
/* aiLike：玩家完全照 AI 的決策邏輯打，用來分辨「規則漏洞」還是「AI 太笨」 */
function policyAiLike(p){
  const saved=p.ai; p.ai={aggr:0.7,spite:0.15};
  let b; try{ b=aiBids(p); } finally { p.ai=saved; }
  return b.map(x=>x||{amt:0,type:"cons",intent:"keep",target:null});
}
/* bargain：對「全部」非詛咒拍品都下最小保守標（把零成本選擇權吃到極限的舊優勢策略） */
function policyBargain(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  S.market.forEach((it,i)=>{ if(!it.curse) bids[i]={amt:1,type:"cons",intent:"keep",target:null}; });
  return bids;
}
/* sniper：只搶單一最高價品，出到保守標上限 */
function policySniper(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  let bi=-1,bv=-99; S.market.forEach((it,i)=>{ if(!it.curse&&it.p>bv){bv=it.p;bi=i;} });
  if(bi>=0) bids[bi]={amt:consCapFor(p),type:"cons",intent:"keep",target:null};
  return bids;
}
/* specialist：只標自己主力系（湊共鳴），小額保守標 */
function policySpecialist(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const f=mainFaction(p)||FACTIONS[0];
  S.market.forEach((it,i)=>{ if(!it.curse&&it.f===f) bids[i]={amt:Math.min(3,consCapFor(p)),type:"cons",intent:"keep",target:null}; });
  return bids;
}
/* minlegal：對每一件都出「最低合法價」——舊規則 79% 勝率的免費選擇權利用者 */
function policyMinLegal(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const cap=consCapFor(p), budget=budgetFor(p);
  let spent=0;
  S.market.forEach((it,i)=>{
    if(it.curse) return;
    const need=1;
    if(need>cap) return;
    if(spent+need+CFG.BID_FEE>budget) return;
    bids[i]={amt:need,type:"cons",intent:"keep",target:null}; spent+=need+CFG.BID_FEE;
  });
  return bids;
}
/* minlegal2：同上但只挑「戰力／實付比」最好的前 2 件（有掛號費時的理性最低價版） */
function policyMinLegal2(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const cap=consCapFor(p);
  const cand=[];
  S.market.forEach((it,i)=>{
    if(it.curse) return;
    const need=1;
    if(need>cap) return;
    cand.push({i,need,ratio:it.p/(need+CFG.BID_FEE)});
  });
  cand.sort((a,b)=>b.ratio-a.ratio).slice(0,2).forEach(c=>{
    bids[c.i]={amt:c.need,type:"cons",intent:"keep",target:null};
  });
  return bids;
}
/* feeaware：知道掛號費存在的理性玩家——把邊際共鳴算進價值、只投 CP 值（價值÷實付）最高的
   前 2 件、出價壓在夠競爭的中額。驗收 A5：防「補完舊漏洞、又開一個新漏洞」的守門策略。 */
function policyFeeAware(p){
  const bids=S.market.map(()=>({amt:0,type:"cons",intent:"keep",target:null}));
  if(!p.alive) return bids;
  const cap=consCapFor(p), budget=budgetFor(p);
  const cand=[];
  S.market.forEach((it,i)=>{
    if(it.curse) return;
    const c=p.bag.filter(x=>!x.curse&&x.f===it.f).length;
    const marginal=(c+1>=CFG.SET_MIN)?(c+1)*(c+1)-(c>=CFG.SET_MIN?c*c:0):0;
    const val=it.p+marginal+(it.ab?2:0);
    const amt=Math.max(1,Math.min(cap,Math.ceil(val/2)));
    cand.push({i,amt,cp:val/(amt+CFG.BID_FEE)});
  });
  cand.sort((a,b)=>b.cp-a.cp||a.i-b.i);
  let spent=0;
  const kmax=CFG.MAX_BIDS>0?CFG.MAX_BIDS:2;
  for(const c of cand.slice(0,kmax)){
    if(spent+c.amt+CFG.BID_FEE>budget) continue;
    bids[c.i]={amt:c.amt,type:"cons",intent:"keep",target:null};
    spent+=c.amt+CFG.BID_FEE;
  }
  return bids;
}
const POLICIES={ greedy:policyGreedy, hoarder:policyHoarder, splitter:policySplitter,
  aiLike:policyAiLike, bargain:policyBargain, sniper:policySniper,
  specialist:policySpecialist, minlegal:policyMinLegal, minlegal2:policyMinLegal2,
  feeaware:policyFeeAware };
/* 無頭跑一整局，供 runMany 統計聚合用。不重用/不修改 simulate()，避免任何動到既有等價基準的風險——
   完全靠 makeState/resolveAuction/resolveBattles/power 這些既有唯讀引擎函式組成，邏輯零重寫。 */
function playPolicyGame(seed,policies,picks){
  makeState("solo",seed,picks);
  const deathRound={}; S.players.forEach(p=>deathRound[p.id]=null);
  const factionWinCounts={}, factionOffered={};
  Object.keys(FAC).forEach(f=>{ factionWinCounts[f]=0; factionOffered[f]=0; });
  let poisonBids=0, totalBids=0, unsoldItems=0, drawnItems=0;
  /* 市集規則活性計數（A4）：各規則觸發夜數、收祟夜強制塞袋件數、押寶夜「同一注壓中多件」次數 */
  const ruleFired={}, ruleStat={extra:0,forced:0,multi:0,abstain:0,fallback:0};
  const markStat={tax:0,markedItems:0,markedBids:0,unmarkedItems:0,unmarkedBids:0,hItems:0,hOthers:0}; /* 盯上活性（§5.8 閘門 G2/G3） */
  const lifeByRound=[];
  for(;;){
    S.nightRule=ruleForRound(S.round); /* 本夜市集規則（與 beginRoundCore 同時機） */
    drawWishes(); /* 與 beginRound 同時機（出價前），三條迴圈亂數序一致 */
    drawMarks(); policyMarks(policies); /* 盯上宣告（§5.8） */
    runEventPhaseHeadless(); /* 異事夜（EVENT_ON=false 零消耗）；真人座位同走 ai 啟發式 */
    if(S.players.filter(p=>p.alive).length<=1){ /* 異事殺到剩1人：該夜不再拍賣/對決 */
      S.players.forEach(p=>{ if(!p.alive&&deathRound[p.id]===null) deathRound[p.id]=S.round; });
      lifeByRound.push(S.players.map(p=>p.life));
      break;
    }
    S.humanBids={};
    S.players.forEach(p=>{
      if(!p.ai){ const pol=(policies&&policies[p.id])||scriptedBids; S.humanBids[p.id]=pol(p); }
    });
    S.market.forEach(it=>{ factionOffered[it.f]=(factionOffered[it.f]||0)+1; drawnItems++; });
    const reveal=resolveAuction();
    reveal.forEach(r=>{
      totalBids+=r.entries.length;
      if(r.winner){
        factionWinCounts[r.it.f]=(factionWinCounts[r.it.f]||0)+1;
        if(r.winner.intent==="poison") poisonBids++;
      }else{ unsoldItems++; }
    });
    resolveBattles();
    if(S.markStat) Object.keys(markStat).forEach(k=>{ markStat[k]+=(S.markStat[k]||0); });
    if(S.nightRule){
      ruleFired[S.nightRule.id]=(ruleFired[S.nightRule.id]||0)+1;
      Object.keys(ruleStat).forEach(k=>{ ruleStat[k]+=(S.ruleStat[k]||0); });
    }
    S.players.forEach(p=>{ if(!p.alive && deathRound[p.id]===null) deathRound[p.id]=S.round; });
    lifeByRound.push(S.players.map(p=>p.life));
    const aliveN=S.players.filter(p=>p.alive).length;
    const humanN=S.players.filter(p=>!p.ai&&p.alive).length;
    if(!humanN||aliveN<=1||S.round>=CFG.ROUNDS) break;
    S.round++; S.market=S.nextMarket; S.nextMarket=drawMarketFor(S.round+1);
  }
  const gameLength=S.round;
  S.players.forEach(p=>{ if(deathRound[p.id]===null) deathRound[p.id]=gameLength; });
  stripEndgameItems();
  const rank=[...S.players].sort((a,b)=>(b.alive?1:0)-(a.alive?1:0)||b.life-a.life);
  return {
    seed, gameLength, winnerId:rank[0].id,
    finalLife:S.players.map(p=>p.life), finalPower:S.players.map(p=>power(p)),
    survival:S.players.map(p=>deathRound[p.id]),
    lifeByRound, factionWinCounts, factionOffered,
    poisonBids, totalBids, unsoldItems, drawnItems,
    ruleFired, ruleStat, markStat,
  };
}
/* runMany({seeds:[...] 或 n:N, policies:{playerId:policyFn}}) → 統計聚合，見 docs 交付需求。
   policies 只覆寫非 AI 座位（solo 模式僅 id0 是人類），AI 座位一律照舊走 aiBids。 */
function runMany(opts){
  opts=opts||{};
  const seeds=opts.seeds?[...opts.seeds]:Array.from({length:opts.n||200},(_,i)=>i+1);
  const policies=opts.policies||{};
  const results=seeds.map(sd=>playPolicyGame(sd,policies,opts.picks));
  const n=results.length;
  const nPlayers=n?results[0].finalLife.length:0;
  const winRate=new Array(nPlayers).fill(0);
  const survivalSum=new Array(nPlayers).fill(0);
  const lifeSum=new Array(nPlayers).fill(0);
  const powerSum=new Array(nPlayers).fill(0);
  const factionWinCounts={}, factionOffered={};
  const ruleFired={}, ruleStat={extra:0,forced:0,multi:0,abstain:0,fallback:0}; /* 市集規則活性統計（A4） */
  let poisonTotal=0,bidsTotal=0,unsoldTotal=0,drawnTotal=0,lengthSum=0;
  const lifeCurveSum=Array.from({length:CFG.ROUNDS},()=>new Array(nPlayers).fill(0));
  const lifeCurveCount=new Array(CFG.ROUNDS).fill(0);
  results.forEach(g=>{
    winRate[g.winnerId]++;
    g.survival.forEach((s,i)=>survivalSum[i]+=s);
    g.finalLife.forEach((l,i)=>lifeSum[i]+=l);
    g.finalPower.forEach((pw,i)=>powerSum[i]+=pw);
    Object.keys(g.factionWinCounts).forEach(f=>{ factionWinCounts[f]=(factionWinCounts[f]||0)+g.factionWinCounts[f]; });
    Object.keys(g.factionOffered).forEach(f=>{ factionOffered[f]=(factionOffered[f]||0)+g.factionOffered[f]; });
    poisonTotal+=g.poisonBids; bidsTotal+=g.totalBids; unsoldTotal+=g.unsoldItems; drawnTotal+=g.drawnItems;
    lengthSum+=g.gameLength;
    if(g.ruleFired) Object.keys(g.ruleFired).forEach(k=>{ ruleFired[k]=(ruleFired[k]||0)+g.ruleFired[k]; });
    if(g.ruleStat) Object.keys(ruleStat).forEach(k=>{ ruleStat[k]+=g.ruleStat[k]; });
    g.lifeByRound.forEach((lifeArr,ri)=>{ lifeCurveSum[ri]=lifeCurveSum[ri].map((v,pi)=>v+lifeArr[pi]); lifeCurveCount[ri]++; });
  });
  return {
    games:n,
    winRate:winRate.map(w=>n?w/n:0),
    avgSurvivalNights:survivalSum.map(s=>n?s/n:0),
    avgFinalLife:lifeSum.map(s=>n?s/n:0),
    avgFinalPower:powerSum.map(s=>n?s/n:0),
    lifeCurve:lifeCurveSum.map((arr,ri)=>lifeCurveCount[ri]?arr.map(v=>v/lifeCurveCount[ri]):null),
    factionWinCounts, unsoldRate:drawnTotal?unsoldTotal/drawnTotal:0,
    poisonUsageRate:bidsTotal?poisonTotal/bidsTotal:0,
    avgGameLength:n?lengthSum/n:0,
    ruleFired, ruleStat,
  };
}
/* 把 runMany 的統計輸出成可直接貼進 markdown 的表格 */
function statsToMarkdown(stats,title){
  const seatNames=["南家(id0)","北家(id1)","西家(id2)","東家(id3)"];
  let md=title?`#### ${title}\n\n`:"";

  md+="| 玩家 | 勝率 | 平均存活夜數 | 平均最終壽命 | 平均最終戰力 |\n|---|---|---|---|---|\n";
  stats.winRate.forEach((w,i)=>{
    md+=`| ${seatNames[i]||("玩家"+i)} | ${(w*100).toFixed(1)}% | ${stats.avgSurvivalNights[i].toFixed(2)} | ${stats.avgFinalLife[i].toFixed(2)} | ${stats.avgFinalPower[i].toFixed(2)} |\n`;
  });
  if(stats.ruleFired&&Object.keys(stats.ruleFired).length){
    md+=`市集規則觸發：${Object.keys(stats.ruleFired).map(k=>`${(NIGHTRULES[k]||{}).name||k} ${stats.ruleFired[k]} 夜`).join("　")}`
      +`　｜強制塞袋 ${stats.ruleStat.forced} 件（塞給沒出手者 ${stats.ruleStat.abstain} 次／全員出手落回壽命最高者 ${stats.ruleStat.fallback} 次）`
      +`　一注壓中多件 ${stats.ruleStat.multi} 次　落標多付 ${stats.ruleStat.extra} 壽命\n`;
  }
  md+="\n| 陣營 | 得標次數 |\n|---|---|\n";
  Object.keys(stats.factionWinCounts).forEach(f=>{ md+=`| ${f} | ${stats.factionWinCounts[f]} |\n`; });
  return md;
}
/* ================= 優勢策略窮舉器（強制閘門，見 docs/GAME_DESIGN.md 六之四） =================
   analyzeEvent({name,players,options,payoff}) → 窮舉所有玩家選擇組合，回報是否存在優勢策略／免費午餐。
   判定定義照設計文件字面實作，不自行更動：
   - 弱優勢：選項 A 對玩家 i 而言，在每一種對手選擇組合下收益都 ≥ 其他所有選項，且至少一種組合下嚴格 >
   - freeLunch：存在「全員選同一項」的組合使每個人收益都 > 0
   - verdict='FAIL' 若 dominant 非空 或 freeLunch 為真 */
function decodeCombo(code,players,nOpts){
  const idxs=new Array(players); let c=code;
  for(let k=0;k<players;k++){ idxs[k]=c%nOpts; c=Math.floor(c/nOpts); }
  return idxs;
}
function analyzeEvent(spec){
  const {players,options,payoff}=spec;
  const nOpts=options.length;
  const total=Math.pow(nOpts,players);
  if(total>2000000) throw new Error("analyzeEvent: 組合數過大（"+total+"），請縮小 options 或 players");
  const payoffTable=[];
  for(let code=0;code<total;code++){
    const idxs=decodeCombo(code,players,nOpts);
    const choices=idxs.map(ix=>options[ix]);
    payoffTable.push({idxs,result:payoff(choices)});
  }
  const dominant=[]; const detail=[];
  for(let i=0;i<players;i++){
    const tables=options.map(()=>({}));
    for(const entry of payoffTable){
      const A=entry.idxs[i];
      const otherKey=entry.idxs.filter((_,j)=>j!==i).join(",");
      tables[A][otherKey]=entry.result[i];
    }
    for(let A=0;A<nOpts;A++){
      let dominatesAll=true, strictSomewhere=false;
      for(let B=0;B<nOpts && dominatesAll;B++){
        if(B===A) continue;
        for(const key of Object.keys(tables[A])){
          const pa=tables[A][key], pb=tables[B][key];
          if(pa<pb){ dominatesAll=false; break; }
          if(pa>pb) strictSomewhere=true;
        }
      }
      if(dominatesAll) dominant.push({player:i,option:options[A],strict:strictSomewhere});
    }
    detail.push({player:i,table:tables.map((t,idx)=>({option:options[idx],byOthers:t}))});
  }
  let freeLunch=false;
  for(let a=0;a<nOpts;a++){
    const choices=new Array(players).fill(options[a]);
    if(payoff(choices).every(v=>v>0)){ freeLunch=true; break; }
  }
  const verdict=(dominant.length>0||freeLunch)?"FAIL":"PASS";
  return {dominant,freeLunch,verdict,detail};
}
/* 窮舉閘門的雙向測試治具：舊版試膽大會（已知有優勢策略，必須 FAIL）／修正版（少數決，必須 PASS） */
const EVENT_OLD_SHRINE={
  name:"試膽大會（舊版・已知有 bug）", players:4, options:["in","out"],
  payoff(choices){
    const countIn=choices.filter(c=>c==="in").length;
    if(countIn===0) return choices.map(()=>-4);
    return choices.map(c=>c==="in"?(-2+15/countIn):0);
  }
};
const EVENT_NEW_SHRINE={
  name:"試膽大會（修正版・少數決）", players:4, options:["in","out"],
  payoff(choices){
    const n=choices.length, countIn=choices.filter(c=>c==="in").length, countOut=n-countIn;
    if(countIn===0||countOut===0) return choices.map(()=>-3);
    if(countIn===countOut) return choices.map(()=>-1);
    const inIsMinority=countIn<countOut;
    return choices.map(c=>c==="in"?(inIsMinority?6:-3):(inIsMinority?-3:6));
  }
};

const EVENT_SPEC_PLAGUE={
  name:"瘟王過境（湊12／失敗-6／最高投入得寶≈5）", players:4, options:[0,2,3,4],
  payoff(ch){
    const tot=ch.reduce((a,b)=>a+b,0);
    if(tot>=12){ const mx=Math.max(...ch); const nt=ch.filter(c=>c===mx).length;
      return ch.map(c=>-c+(c===mx&&mx>0?5/nt:0)); }

  }
};
const EVENT_SPEC_GHOST={
  name:"厲鬼索命（0號=被索者／無人出價-10／他人得標奪寶≈5）", players:4, options:[0,2,4,6],
  payoff(ch){
    const mx=Math.max(...ch);
    if(mx===0) return ch.map((c,i)=>i===0?-10:0);
    const tied=ch.map((c,i)=>c===mx?i:-1).filter(i=>i>=0), n=tied.length;
    const out=ch.map(()=>0);
    tied.forEach(w=>{ out[w]-=mx/n; if(w!==0){ out[w]+=5/n; out[0]-=5/n; } });
    return out;
  }
};
/* 第二批五樁的閘門 spec（2026-09-02 Node 實測均 PASS；建模假設見各註解）。

const EVENT_SPEC_ZONGZI={
  name:"送肉粽·修A（C=4王船煞/落選沾穢-1/無人-5）", players:4, options:["pass",0,3,6],
  payoff(ch){
    const asks=ch.map(c=>c==="pass"?null:c);
    const act=asks.map((a,i)=>a!==null?i:-1).filter(i=>i>=0);
    if(!act.length) return ch.map(()=>-5);
    const mn=Math.min(...act.map(i=>asks[i]));
    const tied=act.filter(i=>asks[i]===mn), n=tied.length;
    const out=ch.map(()=>0);
    act.forEach(i=>{ out[i]-=1; });
    tied.forEach(w=>{ out[w]+=(mn-4+1)/n; });

  }};
const EVENT_SPEC_GUAN={
  name:"觀落陰·修B（V=3零和資訊/落標付半）", players:4, options:[0,2,4],
  payoff(ch){
    const mx=Math.max(...ch);
    if(mx===0) return ch.map(()=>0);
    const V=3;
    const tied=ch.map((c,i)=>c===mx?i:-1).filter(i=>i>=0), n=tied.length;
    const o=ch.map(()=>0);
    for(const w of tied){
      o[w]+=(-mx+V)/n;
      for(let i=0;i<4;i++) if(i!==w) o[i]+=(-V/3-(ch[i]>0?Math.ceil(ch[i]/2):0))/n;
    }

  }};
const EVENT_SPEC_LOAN={
  name:"陰間放貸·修C（還8/11/14/17，獨借+2）", players:4, options:["borrow","no"],
  payoff(ch){
    const k=ch.filter(c=>c==="borrow").length;
    const repay=k?({1:8,2:11,3:14,4:17})[k]:0;
    return ch.map(c=>c==="borrow"?10-repay:0);
  }};
const EVENT_SPEC_WIND={
  name:"大風吹·修D 風向圈（富袋0號值6其餘2/單人圈-1）", players:4, options:["E","W"],
  payoff(ch){
    const worth=[6,2,2,2];
    const out=ch.map(()=>0);
    for(const side of ["E","W"]){
      const circ=ch.map((c,i)=>c===side?i:-1).filter(i=>i>=0);
      if(circ.length===1){ out[circ[0]]-=1; continue; }
      for(const i of circ){
        const others=circ.filter(j=>j!==i);
        out[i]-=worth[i];
        out[i]+=others.reduce((s,j)=>s+worth[j],0)/others.length;
      }
    }
    return out;
  }};
const EVENT_SPEC_POE={
  name:"博杯·修E 廟口擲杯（彩池0.8+寶4/成功者中最高注奪彩）", players:4, options:[0,2,5,10],
  payoff(ch){
    const act=ch.map((x,i)=>x>0?i:-1).filter(i=>i>=0);
    const pot=ch.reduce((a,b)=>a+b,0);
    const out=ch.map(x=>-x);
    if(!act.length) return out;
    const n=act.length;
    for(let mask=1; mask<(1<<n); mask++){
      let pr=1; const succ=[];
      act.forEach((pi,k)=>{

      });

      const tied=succ.filter(i=>ch[i]===mx);
      tied.forEach(w=>{ out[w]+=pr*(0.8*pot+4)/tied.length; });
    }
    return out;
  }};

    const pre=snapPlayers();
    if(S.players.filter(p=>p.alive).length<=1){ /* 異事殺到剩1人：該夜不再拍賣/對決 */
      nights.push({round:S.round, market:S.market.map(x=>x.n), pre, auction:[], mid:pre, battles:[],
        bye:null, nightly:[], deaths:[], ...(evres?{event:evres}:{}), post:snapPlayers()});
      break;
    }
    const market=S.market.map(x=>x.n);
    S.humanBids={};
    S.players.forEach(p=>{ if(!p.ai) S.humanBids[p.id]=scriptedBids(p); });
    const reveal=resolveAuction();
    const auction=reveal.map(r=>({
      item:r.it.n,
      winnerId:r.winner?r.winner.p.id:null,
      amt:r.winner?r.winner.amt:null,
      outcome:r.outcome,
      events:r.events.map(e=>e.txt),

    const battles=R.fights.map(f=>({

      winnerId:f.tie?null:f.w.id, dmg:f.tie?0:f.dmg,
      extra:f.extra?[...f.extra]:[],

      round:S.round, market, pre, auction, mid, battles,
      bye:R.bye, nightly:R.nightly, deaths:R.deaths.map(d=>d.id),
      ...(evres?{event:evres}:{}),
      post:snapPlayers(),
    });
