<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>妖市・L1 三組連鎖試玩</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #130d12; color: #fff0d4; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100dvh; border: 0; }
  #openMenu { position: fixed; top: max(6px,env(safe-area-inset-top)); right: max(6px,env(safe-area-inset-right)); z-index: 10; border: 1px solid #d8a45b; border-radius: 8px; padding: 5px 9px; background: #21151fe8; color: #ffe4ab; font-size: 12px; }
  #menu { position: fixed; z-index: 20; inset: 0; background: #130d12ed; display: grid; place-items: center; padding: 16px; overflow: auto; }
  #menu[hidden] { display: none; }
  .box { width: min(620px, 100%); max-height: 100%; overflow: auto; border: 1px solid #9d6b45; border-radius: 14px; padding: 16px; background: #241821; box-shadow: 0 10px 35px #0008; }
  h1 { margin: 0 0 8px; font-size: clamp(18px,3vw,26px); }
  p { margin: 6px 0; line-height: 1.5; font-size: 13px; }
  .mut { color: #d1baa8; }
  .choices { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin-top: 12px; }
  .choices button, #closeMenu { border: 1px solid #ba8650; border-radius: 8px; background: #4c2830; color: #fff2d9; padding: 9px 8px; font: inherit; font-size: 13px; cursor: pointer; }
  .choices button:hover, .choices button:focus-visible, #closeMenu:focus-visible { background: #764047; outline: 2px solid #eabb74; }
  #closeMenu { margin-top: 8px; }
  #status { position: fixed; z-index: 9; right: max(90px,calc(env(safe-area-inset-right) + 90px)); top: max(10px,env(safe-area-inset-top)); max-width: 160px; border-radius: 6px; padding: 4px 7px; background: #21151fc9; color: #fff2d9; font-size: 11px; line-height: 1.4; pointer-events: none; }
  @media (max-width: 560px) { .box { padding: 12px; } .choices { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<iframe id="game" title="妖市遊戲"></iframe>
<button type="button" id="openMenu" aria-label="開啟試玩選單">練習選單</button>
<div id="status" role="status">選擇一組連鎖練習，或開始正常隨機局。</div>
<div id="menu" role="dialog" aria-modal="true" aria-labelledby="heading">
  <div class="box">
    <h1 id="heading">妖市・三組連鎖試玩</h1>
    <p>練習局預置玩家 1 的首件材料與首夜第 1 件補件；材料不消耗。進入後點第 1 件拍品，建議出價 3，再完成夜戰觀察效果。每局只玩 3 夜。</p>
    <p id="guide" aria-live="polite">選擇一組連鎖查看玩法。</p>
    <p>遊戲中按「？」→「返回連攜試玩選單」，即可換組或查看練習說明。</p>
    <p class="mut">練習預置供玩法觀察，並非正式平衡結果。正式平衡與美術盲讀尚待驗收。</p>
    <div class="choices">
      <button type="button" data-case="water">水陸偷渡<br><small>拼板舟＋水鬼浮標</small></button>
      <button type="button" data-case="eyes">千眼神算<br><small>祖靈之眼＋千里眼銅鈴</small></button>
      <button type="button" data-case="tiger">雙虎滅煞<br><small>虎爺印＋虎姑婆指甲</small></button>
      <button type="button" data-case="eyesDestiny">千眼天命（冷讀）<br><small>主持人用・私密天命已指定</small></button>
      <button type="button" data-case="normal">正常隨機局<br><small>原始設定與市集</small></button>
    </div>
    <button type="button" id="closeMenu">返回遊戲</button>
  </div>
</div>
<script type="module" src="./l1-practice.mjs"></script>
</body>
</html>
