<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160"
     role="img" aria-labelledby="t-dangpu" data-character="dangpu" data-faction="yinqi"
     class="ys-char state-healthy">
  <title id="t-dangpu">陰間當鋪</title>
  <style>
    /* 角色專屬色全部收在下面這一行的 CSS 變數裡，其餘規則十個檔逐字相同——
       十張頭像同時內嵌進同一頁時樣式才不會互相蓋掉。三態只切 --skin 一個變數。 */
    .ys-char[data-character="dangpu"]{ --skin:#cfc0a8; --skin-pale:#adaaa0; --disc:var(--c-yinqi,#3d6e4e); --cloth:#1c1a26; --hair:#1a0a0a; }
    .ys-char .disc{ fill:var(--disc); }
    .ys-char .skin{ fill:var(--skin); stroke:var(--c-ink,#1a0a0a); stroke-width:3.5; stroke-linejoin:round; }
    .ys-char .cloth{ fill:var(--cloth); stroke:var(--c-ink,#1a0a0a); stroke-width:3.5; stroke-linejoin:round; }
    .ys-char .hair{ fill:var(--hair); stroke:var(--c-ink,#1a0a0a); stroke-width:3.5; stroke-linejoin:round; }
    .ys-char .ln{ fill:none; stroke:var(--c-ink,#1a0a0a); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
    .ys-char .thin{ fill:none; stroke:var(--c-ink,#1a0a0a); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .ys-char .solid{ fill:var(--c-ink,#1a0a0a); }
    .ys-char .bone{ fill:#e8e0cc; stroke:var(--c-ink,#1a0a0a); stroke-width:3; stroke-linejoin:round; }
    .ys-char .paper{ fill:#ece6d6; stroke:var(--c-ink,#1a0a0a); stroke-width:3; stroke-linejoin:round; }
    .ys-char .red{ fill:var(--c-xianghu,#c84040); stroke:var(--c-ink,#1a0a0a); stroke-width:3; stroke-linejoin:round; }
    .ys-char .metal{ fill:#b8b0a0; stroke:var(--c-ink,#1a0a0a); stroke-width:3; stroke-linejoin:round; }
    .ys-char .eye-dead{ display:none; }
    .ys-char[data-character].state-pale{ --skin:var(--skin-pale); }
    .ys-char[data-character].state-pale .cloth{ opacity:.72; }
    .ys-char[data-character].state-dying{ --skin:#8bc4c4; }
    .ys-char[data-character].state-dying .cloth{ opacity:.58; }
    .ys-char.state-dying .eye-live{ display:none; }
    .ys-char.state-dying .eye-dead{ display:inline; }
  </style>
  <circle class="disc" cx="80" cy="80" r="74"/>
  <clipPath id="cp-dangpu"><circle cx="80" cy="80" r="74"/></clipPath>
  <g clip-path="url(#cp-dangpu)">
    <!-- 高領黑衣 -->
    <path class="skin" d="M70 106 h20 v16 h-20 z"/>
    <path class="cloth" d="M16 162 v-16 q4 -26 28 -32 l22 -6 h28 l22 6 q24 6 28 32 v16 z"/>
    <path class="cloth" d="M66 116 h28 v10 h-28 z"/>
    <!-- 算盤：橫在胸前，價錢當場就算給你聽 -->
    <path class="cloth" d="M34 132 h92 v24 h-92 z"/>
    <path class="thin" d="M34 144 h92"/>
    <g class="metal">
      <circle cx="46" cy="138" r="3.4"/><circle cx="56" cy="138" r="3.4"/><circle cx="66" cy="138" r="3.4"/>
      <circle cx="104" cy="138" r="3.4"/><circle cx="114" cy="138" r="3.4"/>
      <circle cx="46" cy="150" r="3.4"/><circle cx="76" cy="150" r="3.4"/><circle cx="86" cy="150" r="3.4"/>
      <circle cx="114" cy="150" r="3.4"/>
    </g>
    <!-- 臉：瘦長，沒有多餘表情 -->
    <path class="skin" d="M56 46 h48 v38 q0 24 -24 28 q-24 -4 -24 -28 z"/>
    <path class="hair" d="M52 48 q8 -20 28 -20 t28 20 q-14 -9 -28 -8 t-28 8 z"/>
    <!-- 圓框眼鏡：鏡片後面看不出他在想什麼 -->
    <path class="thin" d="M56 66 h14 M90 66 h14"/>
    <g class="eye-live">
      <circle class="bone" cx="67" cy="80" r="10"/>
      <circle class="bone" cx="93" cy="80" r="10"/>
      <circle class="solid" cx="67" cy="80" r="3.2"/>
      <circle class="solid" cx="93" cy="80" r="3.2"/>
    </g>
    <g class="eye-dead">
      <circle class="bone" cx="67" cy="80" r="10"/>
      <circle class="bone" cx="93" cy="80" r="10"/>
      <path class="ln" d="M60 80 h14 M86 80 h14"/>
    </g>
    <path class="ln" d="M77 80 h6"/>
    <path class="ln" d="M57 78 l-5 -4 M103 78 l5 -4"/>
    <!-- 一條線的嘴 -->
    <path class="ln" d="M72 100 h16"/>
  </g>
</svg>
