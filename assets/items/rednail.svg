<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="t-rednail" data-item="rednail" data-faction="yinqi" class="ys-icon">
  <title id="t-rednail">紅線繡花鞋</title>
  <style>
    .ys-icon[data-faction="yinqi"] .ln{ fill:none; stroke:var(--c-yinqi-light, #70b080); stroke-width:2;
                  stroke-linecap:round; stroke-linejoin:round; }
    .ys-icon[data-faction="yinqi"] .accent{ fill:var(--c-yinqi, #3d6e4e); stroke:none; }
  </style>
  <!-- 繡花鞋：船形鞋身，鞋頭上翹 -->
  <path class="ln" d="M10 46 Q10 38 20 36 L34 32 C40 30 46 32 48 37 Q49 42 44 46 Z"/>
  <!-- 鞋口與繡紋 -->
  <path class="ln" d="M18 38 Q26 40 34 37 M20 41 Q27 43 33 41"/>
  <!-- 鞋底 -->
  <path class="ln" d="M10 46 L44 46"/>
  <!-- 點綴色塊：紅線繫在鞋頭，往畫面外拉長 -->
  <path class="accent" d="M46 35 C50 28 54 18 57 9 L58.4 9.6 C55.2 18.6 51 28.4 47.3 35.8 Z"/>
</svg>
