<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="t-xianji" data-item="xianji" data-faction="zuli" class="ys-icon">
  <title id="t-xianji">獻祭刀</title>
  <style>
    .ys-icon[data-faction="zuli"] .ln{ fill:none; stroke:var(--c-zuli-light, #d4a870); stroke-width:2;
                  stroke-linecap:round; stroke-linejoin:round; }
    .ys-icon[data-faction="zuli"] .accent{ fill:var(--c-zuli, #8b6040); stroke:none; }
  </style>
  <!-- 刀柄 -->
